# A made-up schema used only by the validator's own tests.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://keia-atlas.test/schemas/widget
title: Widget
type: object
additionalProperties: false
required: [id, name, ports]
properties:
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
  name:
    type: string
  ports:
    type: integer
    minimum: 0
  face:
    enum: [front, rear]
