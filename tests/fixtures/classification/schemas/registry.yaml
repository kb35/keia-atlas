# Made-up registry for the classification tests: one folder with no label, one labelled Secret,
# and one whose label is not one of the four.
collections:
  - folder: widgets
    schema: ext/widget.schema.yaml
  - folder: gizmos
    schema: ext/widget.schema.yaml
    classification: Secret
  - folder: sprockets
    schema: ext/sprocket.schema.yaml
    classification: Confidential
