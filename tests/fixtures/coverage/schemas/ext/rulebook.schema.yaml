# A made-up standards schema used only by the coverage check's own tests: just enough shape for the check to read.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://keia-atlas.test/schemas/rulebook
title: Rulebook
type: object
required: [id, sections]
properties:
  id: { type: string }
  sections: { type: array }
