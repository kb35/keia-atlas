# A made-up standard: one must rule per kind of proof, rules whose field no widget carries, and one that does not
# say how it is proved.
id: widgets
sections:
  - id: all
    rules:
      - { id: has-ports, level: must, rule: Count the ports., check: The widget's ports in the record., record: "widgets:ports" }
      - { id: has-colour, level: must, rule: Paint it., check: The widget's colour in the record., record: "widgets:colour" }
      - { id: both, level: must, rule: Face and colour., check: Both in the record., record: ["widgets:face", "widgets:colour"] }
      - { id: on-the-day, level: must, rule: Test it on the day., check: A photo in the handover pack., record: on-site }
      - { id: from-the-tool, level: must, rule: Keep it online., check: The controller shows it online., record: connect }
      - { id: not-said, level: must, rule: Say nothing., check: Nobody knows. }
      - { id: only-should, level: should, rule: A should rule is not counted., check: Anything., record: "widgets:colour" }
