# Which schema checks which data folder.
#
# Every folder under data/ must be listed here, or validation fails.
# That way a typo in a folder name can't quietly skip the checks.
#
# Each entry:
#   folder: the folder under data/
#   schema: the schema file under schemas/ that every YAML file in it must pass
#   classification: the folder's default label (docs/rules/data.md F10): Public, Internal or Restricted.
#     Public is facts about models; Internal is facts about Aigna staff may see; Restricted is facts about
#     Aigna's buildings that would help an attacker. Secret never sits in data/. A field more sensitive
#     than its folder says so with x-classification in its schema.

collections:
  # Space types: Keia composite profiles plus Keia Atlas's options and outlets.
  - folder: space-types
    schema: ext/space-type.schema.yaml
    classification: Public

  # Device classes (video bar, touch controller...): Keia object profiles, with one change: each platform lists
  # helpful_fields (Keia says required_fields, still accepted), so a record without a serial is not blocked.
  - folder: device-classes
    schema: keia/object-profile.schema.yaml
    classification: Public

  # Published documents the data is drawn from: Keia source registry files, unchanged.
  - folder: sources
    schema: keia/source-entry.schema.yaml
    classification: Public

  # Device models: specific products with every port, from vendor documentation.
  - folder: device-models
    schema: ext/device-model.schema.yaml
    classification: Public

  # Sites: the made-up company's buildings, and its remote workers.
  - folder: sites
    schema: ext/site.schema.yaml
    classification: Internal

  # Spaces: real spaces at each site, one folder per site.
  - folder: spaces
    schema: ext/space.schema.yaml
    classification: Internal

  # Installs: what is installed in each space, by position and physical unit.
  - folder: installs
    schema: ext/install.schema.yaml
    classification: Internal

  # Refresh policy: years in service per device class and hours per lifecycle task.
  - folder: refresh-policy
    schema: ext/refresh-policy.schema.yaml
    classification: Internal

  # Projects: delivery work at a site, with phase, thin tasks and simulated agents. Demo data.
  - folder: projects
    schema: ext/project.schema.yaml
    classification: Internal

  # Playbooks: the repeatable way to run each kind of project. Demo data.
  - folder: playbooks
    schema: ext/playbook.schema.yaml
    classification: Internal

  # Lab tests: new devices, firmware and features tried before they enter the standard. Demo data.
  - folder: lab
    schema: ext/lab-test.schema.yaml
    classification: Internal

  # Incidents: ServiceNow incidents matched to rooms and devices. Demo data, no live connection.
  - folder: incidents
    schema: ext/incident.schema.yaml
    classification: Internal

  # Standing rules: routine jobs a named owner approved once, with their conditions, caps, way back and runs
  # (src/lib/rules.mjs). Demo data: nothing runs against a real system.
  - folder: standing-rules
    schema: ext/standing-rule.schema.yaml
    classification: Internal

  # Year plan: pipeline, reviews and change freezes for twelve months. Demo data.
  - folder: plan
    schema: ext/year-plan.schema.yaml
    classification: Internal

  # Planning: budget envelopes and prices, the ratio model, headcount changes and scenarios, by financial year. Demo data.
  - folder: planning
    schema: ext/planning.schema.yaml
    classification: Internal

  # Firmware lines: releases per model family and Aigna's decision on each.
  - folder: firmware
    schema: ext/firmware-line.schema.yaml
    classification: Internal

  # Advisories: what must be known before installing, updating or troubleshooting a model.
  - folder: advisories
    schema: ext/advisory.schema.yaml
    classification: Internal

  # Model choices: why each model is in the standard, and the meeting platforms it supports.
  - folder: model-choices
    schema: ext/model-choice.schema.yaml
    classification: Internal

  # Configurations: the settings Aigna chooses per model, cited.
  - folder: configurations
    schema: ext/configuration.schema.yaml
    classification: Internal

  # Racks: what is mounted where in each comms room rack.
  - folder: racks
    schema: ext/rack.schema.yaml
    classification: Restricted

  # Typical rack layouts: what a room profile's build option looks like in the rack before any room is built to it.
  - folder: rack-layouts
    schema: ext/rack.schema.yaml
    classification: Internal

  # Vendors: integration, service and manufacturer partners, and their contracts. Demo data.
  - folder: vendors
    schema: ext/vendor.schema.yaml
    classification: Internal

  # Rack equipment: real switches, firewalls, console servers, panels and UPSs, for drawing racks.
  - folder: rack-gear
    schema: ext/rack-gear.schema.yaml
    classification: Public

  # Spares on site: stock kept at each site, where it is kept and the minimum to hold. Demo data.
  - folder: spares
    schema: ext/spares.schema.yaml
    classification: Internal

  # Cables: patch cables in racks and spare cables in stores, per site. Demo data.
  - folder: cables
    schema: ext/cables.schema.yaml
    classification: Internal

  # Standards: the house cable colour and labelling standard (cables.yaml) and the house standards library.
  - folder: standards
    schema: ext/standards.schema.yaml
    classification: Public

  # Known issues: what each maker publishes about faults in its firmware, read with the firmware list and
  # matched to the fleet (decision 0029). Real where cited from a release note; made-up feeds say demo: true.
  - folder: known-issues
    schema: ext/known-issues.schema.yaml
    classification: Public

  # Maker cases: faults Aigna raised with a maker and tracks until it answers (decision 0029). Demo data.
  - folder: maker-cases
    schema: ext/maker-case.schema.yaml
    classification: Internal

  # House values: time servers, DNS, calendar and vault naming, the VLAN per kind of device and the management
  # platforms, recorded once. Each unit's build sheet is worked out from them.
  - folder: house-values
    schema: ext/house-values.schema.yaml
    classification: Restricted

  # Floors: each office floor's outline, core, corridors, risers, racks, trays and access points. Made up (rule F8).
  - folder: floors
    schema: ext/floor.schema.yaml
    classification: Restricted

  # Runs: permanent links from comms room patch panels to every outlet and access point, and the riser fibre. Made up.
  - folder: runs
    schema: ext/runs.schema.yaml
    classification: Restricted

  # Circuits: the internet providers' circuits, from the building entry to the firewalls. Made up.
  - folder: circuits
    schema: ext/circuits.schema.yaml
    classification: Restricted

  # Switch ports: each site's VLAN table (subnet and gateway), and how every switch port is set (state, mode,
  # native and tagged VLANs) with what is on its far end, as the switch platform reports it. Made up.
  - folder: switch-ports
    schema: ext/switch-ports.schema.yaml
    classification: Restricted

  # Privacy records: one per kind of sensing device (camera, microphone, video bar, codec, desk video device,
  # door and CCTV equipment) at a group of sites, with purpose, lawful basis, DPIA, notice, retention and
  # works-council reference. Every installed sensing unit must be covered by exactly one. Demo data.
  - folder: privacy
    schema: ext/privacy-record.schema.yaml
    classification: Internal

  # Accessibility: per site, what each room with a room guide offers (hearing loop to IEC 60118-4 and its last
  # test, assistive listening, captions, step-free access). The room guide shows it. Demo data.
  - folder: accessibility
    schema: ext/accessibility.schema.yaml
    classification: Internal

  # Licences: room and platform licence pools (Google Meet hardware, Webex, Teams Rooms, device management), with
  # seats, renewal and cost; the seats in use are counted from the units. The Licences capability. Demo data.
  - folder: licences
    schema: ext/licence.schema.yaml
    classification: Internal

  # Room checks: recurring checks and planned maintenance, per kind of space, with a checklist naming the standard's
  # rules it proves; src/lib/checks.mjs dates the rounds. The Room checks capability. Demo data.
  - folder: checks
    schema: ext/check-plan.schema.yaml
    classification: Internal

  # Out of service: spaces taken out of service, why and until when, and who was told (simulated). The Out of
  # service capability. Demo data.
  - folder: out-of-service
    schema: ext/out-of-service.schema.yaml
    classification: Internal

  # Alert rules: what the monitoring tools raise, who gets it, quiet hours and the silences Atlas's own records set.
  # The Alert rules capability. Demo data; the alerts themselves are simulated (src/lib/alerts.mjs).
  - folder: alert-rules
    schema: ext/alert-rule.schema.yaml
    classification: Internal

  # Credentials: certificates, device service accounts, SNMP users and API credentials by reference (a vault name,
  # never the secret), with what uses them and when they expire. The Certificates and secrets capability. Demo data.
  # Restricted: it maps which secret opens which kind of device.
  - folder: credentials
    schema: ext/credential.schema.yaml
    classification: Restricted

  # Security flaws: vulnerabilities per model and firmware line, with affected and fixed versions, matched to the
  # fleet (src/lib/flaws.mjs). The Security flaws capability. Demo data: made-up ids. Restricted, like the
  # vulnerable-firmware list it produces.
  - folder: security-flaws
    schema: ext/security-flaw.schema.yaml
    classification: Restricted

  # Config backups: per office, each network device's last config backup and its drift from the network standard,
  # as read from the backup tool (Oxidized). The Config backups capability. Simulated. Restricted: it names settings
  # that differ from the standard.
  - folder: config-backups
    schema: ext/config-backup.schema.yaml
    classification: Restricted

  # Meeting quality: per office, each video space's call quality score, its trend, poor calls and their cause, as read
  # from the meeting platform. The Meeting quality capability. Simulated.
  - folder: meeting-quality
    schema: ext/meeting-quality.schema.yaml
    classification: Internal

  # On call: who answers out of hours in each region, week by week (src/lib/oncall.mjs). People by id, never by
  # contact details; paging stays with the paging tool. Demo data.
  - folder: on-call
    schema: ext/on-call.schema.yaml
    classification: Internal

  # Fault history: faults resolved before the incidents held in full, one line each, matched to a space and unit.
  # Repeat faults are counted from these and data/incidents (src/lib/repeats.mjs). Demo data.
  - folder: fault-history
    schema: ext/fault-history.schema.yaml
    classification: Internal

  # Connected records: units, spaces, tickets and events brought in by a connector (docs/connectors/), each with
  # its source mark and the system's own record kept aside. One folder per system. Restricted, because an import
  # can hold rack positions and addresses.
  - folder: connected
    schema: connectors/record.schema.yaml
    classification: Restricted

  # A provider's own Keia, kept beside the demo company's (docs/service-providers.md): one folder per provider and one
  # per area of its work. A registered folder can be a path, and the longest one a file sits in checks it, so each area
  # has its own schema. Made up for the demo; prices are fictional. Internal: the provider's own records (costs, margin,
  # crews, stock); nothing here flows to a client except what an engagement shares.
  #   sales  price list, labour rates, standard terms and opportunities (src/lib/provider-sales.mjs)
  #   ops    stock, purchase orders, jobs, crew, visits, surveys, RAMS reviews and handover packs (src/lib/provider-ops.mjs)
  - folder: providers/northlight/sales
    schema: ext/provider-sales.schema.yaml
    classification: Internal

  - folder: providers/northlight/ops
    schema: ext/provider-ops.schema.yaml
    classification: Internal

  # Events: client briefings and visits in the experience centres, with their rooms, demo kit, run of show,
  # technician, readiness checks and report (src/lib/events.mjs). Every client and host is made up. Demo data.
  - folder: events
    schema: ext/event.schema.yaml
    classification: Internal

  # Demo and loaner kit at each experience centre: charge and last test per unit; bookings are on the events. Demo data.
  - folder: demo-kit
    schema: ext/demo-kit.schema.yaml
    classification: Internal
