# Which schema checks which data folder.
#
# Every folder under data/ must be listed here, or validation fails.
# That way a typo in a folder name can't quietly skip the checks.
#
# Each entry:
#   folder: the folder under data/
#   schema: the schema file under schemas/ that every YAML file in it must pass

collections:
  # Space types: Keia composite profiles plus Keia Atlas's options and outlets.
  - folder: space-types
    schema: ext/space-type.schema.yaml

  # Device classes (video bar, touch controller...): Keia object profiles, unchanged.
  - folder: device-classes
    schema: keia/object-profile.schema.yaml

  # Published documents the data is drawn from: Keia source registry files, unchanged.
  - folder: sources
    schema: keia/source-entry.schema.yaml

  # Device models: specific products with every port, from vendor documentation.
  - folder: device-models
    schema: ext/device-model.schema.yaml

  # Sites: the made-up company's buildings, and its remote workers.
  - folder: sites
    schema: ext/site.schema.yaml

  # Spaces: real spaces at each site, one folder per site.
  - folder: spaces
    schema: ext/space.schema.yaml

  # Installs: what is installed in each space, by position and physical unit.
  - folder: installs
    schema: ext/install.schema.yaml

  # Refresh policy: years in service per device class and hours per lifecycle task.
  - folder: refresh-policy
    schema: ext/refresh-policy.schema.yaml

  # Projects: delivery work at a site, with phase, thin tasks and simulated agents. Demo data.
  - folder: projects
    schema: ext/project.schema.yaml

  # Playbooks: the repeatable way to run each kind of project. Demo data.
  - folder: playbooks
    schema: ext/playbook.schema.yaml

  # Lab tests: new devices, firmware and features tried before they enter the standard. Demo data.
  - folder: lab
    schema: ext/lab-test.schema.yaml

  # Incidents: ServiceNow incidents matched to rooms and devices. Demo data, no live connection.
  - folder: incidents
    schema: ext/incident.schema.yaml

  # Year plan: pipeline, reviews and change freezes for twelve months. Demo data.
  - folder: plan
    schema: ext/year-plan.schema.yaml

  # Planning: budget envelopes and prices, the ratio model, headcount changes and scenarios, by financial year. Demo data.
  - folder: planning
    schema: ext/planning.schema.yaml

  # Firmware lines: releases per model family and Aigna's decision on each.
  - folder: firmware
    schema: ext/firmware-line.schema.yaml

  # Advisories: what must be known before installing, updating or troubleshooting a model.
  - folder: advisories
    schema: ext/advisory.schema.yaml

  # Model choices: why each model is in the standard, and the meeting platforms it supports.
  - folder: model-choices
    schema: ext/model-choice.schema.yaml

  # Configurations: the settings Aigna chooses per model, cited.
  - folder: configurations
    schema: ext/configuration.schema.yaml

  # Racks: what is mounted where in each comms room rack.
  - folder: racks
    schema: ext/rack.schema.yaml

  # Typical rack layouts: what a room profile's build option looks like in the rack before any room is built to it.
  - folder: rack-layouts
    schema: ext/rack.schema.yaml

  # Vendors: integration, service and manufacturer partners, and their contracts. Demo data.
  - folder: vendors
    schema: ext/vendor.schema.yaml

  # Rack equipment: real switches, firewalls, console servers, panels and UPSs, for drawing racks.
  - folder: rack-gear
    schema: ext/rack-gear.schema.yaml

  # Spares on site: stock kept at each site, where it is kept and the minimum to hold. Demo data.
  - folder: spares
    schema: ext/spares.schema.yaml

  # Cables: patch cables in racks and spare cables in stores, per site. Demo data.
  - folder: cables
    schema: ext/cables.schema.yaml

  # Standards: the house cable colour and labelling standard (cables.yaml) and the house standards library.
  - folder: standards
    schema: ext/standards.schema.yaml

  # Known issues: what each maker publishes about faults in its firmware, read with the firmware list and
  # matched to the fleet (decision 0029). Real where cited from a release note; made-up feeds say demo: true.
  - folder: known-issues
    schema: ext/known-issues.schema.yaml

  # Maker cases: faults Aigna raised with a maker and tracks until it answers (decision 0029). Demo data.
  - folder: maker-cases
    schema: ext/maker-case.schema.yaml

  # House values: time servers, DNS, calendar and vault naming, the VLAN per kind of device and the management
  # platforms, recorded once. Each unit's build sheet is worked out from them.
  - folder: house-values
    schema: ext/house-values.schema.yaml

  # Floors: each office floor's outline, core, corridors, risers, racks, trays and access points. Made up (rule F8).
  - folder: floors
    schema: ext/floor.schema.yaml

  # Runs: permanent links from comms room patch panels to every outlet and access point, and the riser fibre. Made up.
  - folder: runs
    schema: ext/runs.schema.yaml

  # Circuits: the internet providers' circuits, from the building entry to the firewalls. Made up.
  - folder: circuits
    schema: ext/circuits.schema.yaml
