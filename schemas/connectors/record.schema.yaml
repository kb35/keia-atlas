# Connected record: any file under data/connected/. Its `kind` says which shape it has.
# The registry points the data/connected folder here (schemas/registry.yaml).
# Canonical model v1: the four v0 kinds (unit, space, ticket, event) and seven more (port, connection, network,
# address, group, circuit, contact). See docs/connectors/model.md.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/connectors/record
title: Connected record
type: object
required: [kind]
properties:
  kind: { enum: [unit, space, ticket, event, port, connection, network, address, group, circuit, contact] }
allOf:
  - if: { properties: { kind: { const: unit } }, required: [kind] }
    then: { $ref: unit }
  - if: { properties: { kind: { const: space } }, required: [kind] }
    then: { $ref: space }
  - if: { properties: { kind: { const: ticket } }, required: [kind] }
    then: { $ref: ticket }
  - if: { properties: { kind: { const: event } }, required: [kind] }
    then: { $ref: event }
  - if: { properties: { kind: { const: port } }, required: [kind] }
    then: { $ref: port }
  - if: { properties: { kind: { const: connection } }, required: [kind] }
    then: { $ref: connection }
  - if: { properties: { kind: { const: network } }, required: [kind] }
    then: { $ref: network }
  - if: { properties: { kind: { const: address } }, required: [kind] }
    then: { $ref: address }
  - if: { properties: { kind: { const: group } }, required: [kind] }
    then: { $ref: group }
  - if: { properties: { kind: { const: circuit } }, required: [kind] }
    then: { $ref: circuit }
  - if: { properties: { kind: { const: contact } }, required: [kind] }
    then: { $ref: contact }
