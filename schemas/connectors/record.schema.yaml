# Connected record: any file under data/connected/. Its `kind` says which shape it has.
# The registry points the data/connected folder here (schemas/registry.yaml).

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/connectors/record
title: Connected record
type: object
required: [kind]
properties:
  kind: { enum: [unit, space, ticket, event] }
allOf:
  - if: { properties: { kind: { const: unit } }, required: [kind] }
    then: { $ref: unit }
  - if: { properties: { kind: { const: space } }, required: [kind] }
    then: { $ref: space }
  - if: { properties: { kind: { const: ticket } }, required: [kind] }
    then: { $ref: ticket }
  - if: { properties: { kind: { const: event } }, required: [kind] }
    then: { $ref: event }
