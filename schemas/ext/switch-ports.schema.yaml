# Switch ports at a site: the site's VLAN table (subnet and gateway per VLAN), and how every port on every switch is
# set, as the switch platform (UniFi, Meraki or Netgear) reports it: state, mode, native VLAN, tagged VLANs, and what
# is on its far end. One file per site (data/switch-ports/<site>.yaml). Made up for the demo.
#
# The far end names each link of the chain (run, patch cord, unit and its port), so the file reads on its own; the
# validator (tools/crossrefs-switchports.mjs) checks every name against the room wiring, the runs and the patch cords,
# so the chain is recorded once and can never disagree with them. Whether a port follows the VLAN plan is not a
# validation error: it is a finding the pages show ("To review"), because a real switch can be set wrong.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/switch-ports
title: Switch ports at a site
type: object
additionalProperties: false
required: [site, read_at, vlans, switches, demo]
$defs:
  vlan: { type: integer, minimum: 1, maximum: 4094 }
  portId:
    description: A port number on a rack switch (1, 49), or a port id from the model on an in-room switch (lan-9).
    oneOf:
      - { type: integer, minimum: 1 }
      - { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
  far:
    description: >
      What the port reaches. A room outlet or access point: run (its permanent link), patch (the patch cord from the
      panel port to this switch port), and the unit and unit_port plugged in (none when the outlet is empty). A room
      device on an in-room switch: unit and unit_port. Another switch: switch (its id here) and port, with the patch
      cords and any riser run between. A firewall or controller: rack and u.
    type: object
    additionalProperties: false
    properties:
      run: { type: string }
      patch: { type: string }
      patches: { type: array, items: { type: string } }
      unit: { description: "The asset tag of the unit on the far end.", type: string, pattern: "^AG-[0-9]{6}$" }
      unit_port: { description: "The unit's own port, as the model or the space type names it (lan-1).", type: string }
      switch: { description: "Another switch's id in data/switch-ports.", type: string }
      port: { $ref: "#/$defs/portId" }
      rack: { type: string }
      u: { type: integer, minimum: 1 }
properties:
  site: { description: "The site id, the same as the file name.", type: string, pattern: "^[a-z0-9]+$" }
  read_at: { description: "When the switch platform was last read (simulated in the demo).", type: string, format: date-time }
  note: { type: string }
  demo: { const: true }
  vlans:
    description: The site's VLAN table. Every VLAN in the network standard's plan, with its subnet and gateway (made-up private addresses).
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [vlan, subnet]
      properties:
        vlan: { $ref: "#/$defs/vlan" }
        subnet: { type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$" }
        gateway: { description: "None for a VLAN that is not routed (AV, kept in each room).", type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$" }
        dhcp: { description: "Where addresses come from.", type: string }
        note: { type: string }
  switches:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, platform, ports]
      properties:
        id: { description: "The switch's hostname: its unit's hostname where it has one.", type: string, pattern: "^[a-z]{3}-[0-9]{2,4}-[a-z]{2,4}[0-9]{2}$" }
        rack: { description: "A comms room switch's rack and unit (data/racks).", type: string }
        u: { type: integer, minimum: 1 }
        space: { description: "An in-room switch's space and position (data/installs).", type: string }
        position: { type: string }
        platform: { description: "The switch platform its connector would read and set it through.", enum: [unifi, meraki, netgear] }
        ports:
          description: Every port that is patched or cabled, active or parked.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [port, state]
            properties:
              port: { $ref: "#/$defs/portId" }
              state: { description: "Active; or parked: patched to an outlet with nothing plugged in, shut and on no VLAN.", enum: [active, parked] }
              mode: { enum: [access, trunk] }
              native: { description: "The untagged VLAN (for an access port, its one VLAN).", $ref: "#/$defs/vlan" }
              tagged: { description: "The tagged VLANs on a trunk.", type: array, items: { $ref: "#/$defs/vlan" }, uniqueItems: true }
              far: { $ref: "#/$defs/far" }
            allOf:
              - if: { properties: { state: { const: active } } }
                then: { properties: { mode: true, native: true }, required: [mode, native] }
              - if: { properties: { mode: { const: access } }, required: [mode] }
                then: { not: { properties: { tagged: true }, required: [tagged] } }
              - if: { properties: { mode: { const: trunk } }, required: [mode] }
                then: { properties: { tagged: { type: array, minItems: 1 } }, required: [tagged] }
        disabled:
          description: 'The ports with nothing patched, shut: numbers and ranges on a rack switch ("41-48,51-52"), port ids on an in-room switch.'
          oneOf:
            - { type: string, pattern: "^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$" }
            - { type: array, items: { $ref: "#/$defs/portId" } }
      description: A comms room switch gives rack and u; an in-room switch gives space and position; never both.
      oneOf:
        - { properties: { rack: true, u: true }, required: [rack, u] }
        - { properties: { space: true, position: true }, required: [space, position] }
