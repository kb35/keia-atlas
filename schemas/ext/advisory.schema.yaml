# Advisory: something everyone touching a model must know before they install, update or troubleshoot it.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/advisory
title: Advisory
type: object
additionalProperties: false
required: [id, date, level, title, says, action, models, sources, status]
properties:
  id: { type: string, pattern: "^ADV-[0-9]+$" }
  date: { type: string, format: date }
  level: { enum: [do-not-install, act, check, info] }
  status: { enum: [open, decided, closed] }
  title: { type: string }
  says: { description: What the vendor documents say., type: string }
  action: { description: What Aigna does about it., type: string }
  models: { type: array, items: { type: string } }
  sources: { type: array, items: { type: string } }
  raised_by: { type: string }
  owner: { type: string }
  demo_note: { type: string }
