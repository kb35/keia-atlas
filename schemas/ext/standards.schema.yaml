# The standards folder holds two kinds of file: the cable colour and labelling standard (cables.yaml, its own
# shape, which the cable checks read) and house standards (every other file). A file with colours is the first.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/standards
title: Standards folder
type: object
if: { type: object, properties: { colours: { type: array } }, required: [colours] }
then: { $ref: "https://kb35.github.io/keia-atlas/schemas/ext/cable-standard" }
else: { $ref: "https://kb35.github.io/keia-atlas/schemas/ext/house-standard" }
