# Lab test: a new device, firmware release or feature tried in the Lab before it can enter the
# house standard. The innovation engineer runs it; the service manager decides what happens next.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/lab-test
title: Lab test
type: object
additionalProperties: false
required: [id, title, kind, owner, status, start, why, checks, demo]
properties:
  id: { type: string, pattern: "^LAB-[0-9]+$" }
  title: { type: string }
  kind: { enum: [device, firmware, feature, integration] }
  owner: { type: string }
  with: { type: array, items: { type: string } }
  status: { enum: [queued, testing, passed, failed, adopted] }
  start: { type: string, format: date }
  end: { type: string, format: date }
  why: { type: string }
  models: { description: Device models under test., type: array, items: { type: string } }
  project: { type: string, pattern: "^PRJ-[0-9]+$" }
  raised_by: { description: "Who or what asked for the test: a person id, or an agent name.", type: string }
  checks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, result]
      properties:
        name: { type: string }
        result: { enum: [pass, fail, pending] }
        note: { type: string }
  outcome: { type: string }
  decided_by: { type: string }
  demo: { const: true }
