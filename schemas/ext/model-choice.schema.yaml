# Model choice: why a model is in the house standard, where it is used, and which meeting platforms it supports.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/model-choice
title: Model choice
type: object
additionalProperties: false
required: [model, status, why, platforms]
properties:
  model: { type: string }
  status: { enum: [standard, legacy, candidate, under-review] }
  since: { type: string }
  decided_by: { type: string }
  review: { type: string, format: date }
  why:
    type: array
    items: { type: object, additionalProperties: false, required: [point], properties: { point: { type: string }, source: { type: string } } }
  platforms:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, support]
      properties:
        name: { type: string }
        support: { enum: [yes, no, not-confirmed, via-partner] }
        note: { type: string }
        source: { type: string }
  firmware: { description: A firmware line id., type: string }
  configuration: { description: A configuration id., type: string }
