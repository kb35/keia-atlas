# Incident: a ServiceNow incident as Keia Atlas sees it. The ticket fields mirror ServiceNow's
# incident table; `history` mirrors the ticket's activity log; the keia_atlas block is what Keia Atlas
# adds by matching the ticket to a room and its devices. Tickets stay in ServiceNow (decision 0020);
# the lifecycle rules are in decision 0024 and checked by tools/crossrefs.mjs.
# Demo data: there is no live ServiceNow connection.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/incident
title: Incident
type: object
additionalProperties: false
required: [number, opened, short_description, caller, priority, priority_proposed, state, assignment_group, subject, history, keia_atlas, demo]
$defs:
  when: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$", description: "Local time at the site, to the minute (2026-09-28T07:58)." }
properties:
  number: { type: string, pattern: "^INC[0-9]{7}$", description: The ServiceNow incident number. }
  opened: { $ref: "#/$defs/when", description: When the ticket was opened. The first history entry has the same time. }
  short_description: { type: string }
  description: { type: string }
  caller: { type: string, description: The person who reported it (a made-up name). }
  priority: { enum: [1, 2, 3, 4], description: "The priority in force, as ServiceNow holds it: 1 critical, 2 high, 3 moderate, 4 low. It is priority_proposed, or priority_override's priority when a person changed it (checked in tools/crossrefs-incidents.mjs)." }
  priority_proposed:
    enum: [1, 2, 3, 4]
    description: >
      The priority worked out from impact and urgency when the ticket came in. It is a proposal: a person may
      change it, and the reason is kept (priority_override).
  priority_override:
    description: A person changed the proposed priority. Who, when and why are kept, and the page shows "Changed from P3" with the reason.
    type: object
    additionalProperties: false
    required: [priority, reason, by, at]
    properties:
      priority: { enum: [1, 2, 3, 4], description: The priority the person set. It differs from priority_proposed. }
      reason: { type: string, minLength: 1, description: "Why, in plain words: what the proposal could not know." }
      by: { type: string, description: A person in the demo team (src/lib/demo.mjs). }
      at: { $ref: "#/$defs/when" }
  priority_reason: { type: string, description: "Why the priority was proposed, in a few words: \"booked in 68 min\", \"no booking affected\". The band shows it beside the priority." }
  booking:
    description: The booking the fault puts at risk, captured from room booking. Attendees are counted, never named.
    type: object
    additionalProperties: false
    required: [at, people]
    properties:
      at: { $ref: "#/$defs/when" }
      people: { type: integer, minimum: 1 }
  major:
    description: A major incident runs the urgency rule and names one commander (Keia Method 2.5, SYNTHESIS 2.12).
    type: object
    additionalProperties: false
    required: [at, commander, reason]
    properties:
      at: { $ref: "#/$defs/when" }
      commander: { type: string, description: The one person in charge until it is over (src/lib/demo.mjs). }
      reason: { type: string }
  raised_by:
    description: A standing rule raised this incident because a run was unable to complete (data/standing-rules).
    type: object
    additionalProperties: false
    required: [rule, run]
    properties:
      rule: { type: string }
      run: { type: string, pattern: "^RUN-[0-9]+$" }
      change: { type: string, pattern: "^CHG-[0-9]+$" }
  state: { enum: [new, in-progress, on-hold, resolved], description: The ticket's state now. Must equal the last state in history. }
  assignment_group: { type: string }
  subject:
    description: What the ticket is about, once Keia Atlas has matched it. A whole room, or one device in it.
    type: object
    additionalProperties: false
    required: [kind, room]
    properties:
      kind: { enum: [room, device] }
      room: { type: string, description: A room id (data/spaces). }
      position: { type: string, description: "For a device: its position in the room's install (video-bar, display#2, kit-07/network-gateway)." }
      device: { type: string, description: "For a device: the asset tag of the unit at that position. A device needs both position and device; a room has neither (checked in tools/crossrefs-incidents.mjs)." }
  history:
    description: The ticket's activity log, oldest first, as ServiceNow keeps it, plus the notes Keia Atlas adds.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [at, source]
      properties:
        at: { $ref: "#/$defs/when" }
        state: { enum: [new, in-progress, on-hold, resolved], description: Set when this entry changes the ticket's state. }
        by: { type: string, description: A person in the demo team (src/lib/demo.mjs) who made the entry. }
        person: { type: string, description: "Someone outside the team, by name: the caller, a vendor's engineer." }
        source: { enum: [servicenow, keia_atlas], description: Where the entry was made. Keia Atlas entries are work notes it wrote back (stage 4) or matches it made (stage 2). }
        hold_reason: { enum: [awaiting-caller, awaiting-vendor, awaiting-change, awaiting-parts], description: Why the ticket is on hold. Only on an on-hold entry. }
        resolution:
          description: How it was resolved. Only on a resolved entry.
          type: object
          additionalProperties: false
          required: [code, notes]
          properties:
            code: { enum: [fixed, workaround, no-fault-found, duplicate, cancelled] }
            notes: { type: string, minLength: 1 }
        note: { type: string, description: "The comment or work note, in plain words." }
        rule: { type: string, description: "The standing rule that made this entry (data/standing-rules), when it was done automatically." }
        run: { type: string, pattern: "^RUN-[0-9]+$", description: "The rule's run, so the entry opens its How was this done? card." }
  demo: { const: true }
  keia_atlas:
    type: object
    additionalProperties: false
    required: [matched_by, evidence, next]
    properties:
      matched_by: { type: string, description: How Keia Atlas knew which room and device the ticket is about. }
      symptom: { type: string, description: "The symptom in the device profile's guide this matches (a key under discrimination in data/device-classes)." }
      firmware: { type: string, description: "The firmware device management reports for the unit, when it reports one." }
      evidence:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [from, says, level]
          properties:
            from: { type: string }
            says: { type: string }
            level: { enum: [ok, warn, bad] }
      related: { description: "Linked work: a project task (T-1234), a Lab test or a known issue.", type: array, items: { type: string } }
      next: { description: "What Keia Atlas suggests doing next, from the guide.", type: array, items: { type: string } }
      assigned: { type: string }
      work_note: { description: "Stage 4: the note Keia Atlas would write back to the ticket.", type: string }
      captured_fix: { type: string }
      held_at: { $ref: "#/$defs/when", description: "The demo holds this incident at this moment, so its flow can be played from the start. The page says so." }
      facts:
        description: The unit's facts beside the picture, each one line (last seen, the switch port, the last change).
        type: array
        items:
          type: object
          additionalProperties: false
          required: [label, value]
          properties:
            label: { type: string }
            value: { type: string }
            level: { enum: [ok, warn, bad] }
            to: { type: string, description: A link inside the site. }
      diagnosis:
        description: >
          The suggestion for a P1 or P2, folded until the person has recorded what they think it is (cognitive
          forcing, SYNTHESIS 2.3). Evidence strength is a count of signals, never a percentage.
        type: object
        additionalProperties: false
        required: [suggests, signals]
        properties:
          suggests: { type: string, description: "The cause the signals point to: \"a PoE fault\"." }
          signals:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [says, fits]
              properties:
                says: { type: string }
                fits: { enum: [agrees, differs, not-checked], description: "Whether the signal agrees with the suggestion, differs from it, or was not checked." }
          unlike: { type: string, description: A known error it looks like and why it is not that one. }
          ai: { type: string, description: "When AI drafted the words: says so, with the model and region." }
      actions:
        description: The standing rules the Do section offers for this record; each shows the verb its rule declares.
        type: array
        items:
          type: object
          additionalProperties: false
          required: [rule, target]
          properties:
            rule: { type: string }
            target: { type: string, description: "What it acts on, in the verb's words: \"GE1/0/12\"." }
            again: { type: string, pattern: "^RUN-[0-9]+$", description: The run this would run again. }
