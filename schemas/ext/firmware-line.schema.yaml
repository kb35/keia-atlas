# Firmware line: the software releases for a family of models, and Aigna's decision on each.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/firmware-line
title: Firmware line
type: object
additionalProperties: false
required: [id, name, vendor, models, releases]
properties:
  id: { type: string }
  name: { type: string }
  vendor: { type: string }
  models: { type: array, items: { type: string } }
  managed_in: { description: "Where updates are pushed from.", type: string }
  releases:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [version, released, status, headlines, source]
      properties:
        version: { type: string }
        released: { description: "YYYY-MM or YYYY-MM-DD.", type: string, pattern: "^\\d{4}-\\d{2}(-\\d{2})?$" }
        status: { enum: [standard, lab, blocked, superseded, available] }
        headlines: { type: array, items: { type: string } }
        known_issues: { type: array, items: { type: string } }
        aigna: { description: "Aigna's note on this release.", type: string }
        lab: { type: string, pattern: "^LAB-[0-9]+$" }
        advisory: { type: string, pattern: "^ADV-[0-9]+$" }
        source: { description: A source id from data/sources., type: string }
