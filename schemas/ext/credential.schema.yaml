# Credential reference: a certificate, a device service account, an SNMP user or an API credential, by reference only
# (the Certificates and secrets capability, src/lib/modules.mjs). Where it lives in the vault, what uses it, who owns
# it and when it expires. Never the secret itself: `vault` must be a vault name, and tools/secrets.mjs checks every file.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/credential
title: Credential reference
type: object
additionalProperties: false
required: [id, kind, name, vault, used_by, purpose, issued, expires, owner_role, demo]
properties:
  id: { type: string, pattern: "^[a-z0-9-]+$" }
  kind: { enum: [certificate, service-account, snmp-user, api-token] }
  name: { type: string }
  vault: { description: "Where it lives in the vault: vault:<path>. Never the secret.", type: string, pattern: "^vault:\\S" }
  used_by:
    description: What uses it. Models (in some offices), units, or a management platform (data/house-values/).
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      models: { type: array, minItems: 1, items: { type: string } }
      sites: { type: array, minItems: 1, items: { type: string } }
      units: { type: array, minItems: 1, items: { type: string, pattern: "^AG-[0-9]{6}$" } }
      platform: { type: string }
  purpose: { description: "What it is for, in a sentence.", type: string }
  issuer: { description: Who issued a certificate., type: string }
  issued: { type: string, format: date }
  rotated: { description: When the secret was last changed., type: string, format: date }
  expires: { type: string, format: date }
  owner_role: { description: The role that renews or rotates it (a role in src/lib/demo.mjs)., type: string }
  demo: { description: Made up for the demo., const: true }
