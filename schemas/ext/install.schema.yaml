# Install: what is actually installed in one space.
# Files live in data/installs/<site>/ and the file name is the space id.
#
# Keia's logical and physical identity:
# - a position is the role (the video bar in this room): its model and hostname
#   stay the same when the hardware is replaced.
# - a unit is one physical box, with its own serial and asset tag.
# During a replacement a position has two units: the old one (legacy, stage retire)
# and the new one.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/install
title: Install
type: object
additionalProperties: false
required: [space, positions]
properties:
  space:
    description: Space id (a file in data/spaces/<site>/).
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  fitted:
    description: Optional equipment keys from the space type option that are fitted here.
    type: array
    uniqueItems: true
    items: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
  positions:
    type: array
    items: { $ref: "#/$defs/position" }
  notes:
    type: array
    items: { type: string }
  older_kit:
    description: >
      Older devices that are not part of the room's current standard, kept so the record goes back
      as far as the building does. With no retired date the device is still installed (and shows in
      the inventory and the work plan). With a retired date it has been taken out and is history only.
    type: array
    items: { $ref: "#/$defs/olderUnit" }
  spare_units:
    description: >
      An IT store's spare units: boxes on its shelves that belong to no position yet. Each has its own serial and
      asset tag and the status Spare, which sits between procured and in service in a unit's life. When one is
      fitted it moves out of here into the position it fills, with stage manage.
    type: array
    items: { $ref: "#/$defs/spareUnit" }

$defs:
  spareUnit:
    type: object
    additionalProperties: false
    required: [model, serial, asset_tag, stage, arrived, cabinet, shelf]
    properties:
      model: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      serial: { type: string, pattern: "^DEMO-[A-Z]{3}-[0-9]{6}$" }
      asset_tag: { type: string, pattern: "^AG-[0-9]{6}$" }
      stage: { const: spare }
      arrived: { description: The day it arrived in the store., type: string, format: date }
      cabinet: { description: "A cabinet of the store room profile option, in words (Cabinet A).", type: string }
      shelf: { description: "A shelf of that cabinet, in words (Shelf 2).", type: string }
      notes: { type: string }

  olderUnit:
    type: object
    additionalProperties: false
    required: [model, serial, asset_tag, installed]
    properties:
      model: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      hostname: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      serial: { type: string, pattern: "^DEMO-[A-Z]{3}-[0-9]{6}$" }
      asset_tag: { type: string, pattern: "^AG-[0-9]{6}$" }
      installed: { type: string, format: date }
      retired: { type: string, format: date }
      notes: { type: string }

  position:
    type: object
    additionalProperties: false
    required: [position, units]
    properties:
      position:
        description: >
          The equipment key from the space type option, with #n for the nth of
          several, and a unit prefix for repeated spaces (desk-07/monitor, kit-12/dock).
        type: string
        pattern: "^([a-z]+-[0-9]{2,3}/)?[a-z0-9-]+(#[0-9]+)?$"
      model:
        description: Device model id. Left out for kit the guideline names no model for (displays).
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      hostname:
        description: Logical name for networked devices; it stays with the role, not the box.
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      units:
        type: array
        minItems: 1
        maxItems: 2
        items: { $ref: "#/$defs/unit" }

  unit:
    type: object
    additionalProperties: false
    required: [serial, asset_tag, stage]
    properties:
      serial:
        description: Made-up serial number, always starting DEMO-.
        type: string
        pattern: "^DEMO-[A-Z]{3}-[0-9]{6}$"
      asset_tag: { type: string, pattern: "^AG-[0-9]{6}$" }
      stage:
        description: Keia lifecycle stage.
        enum: [plan, procure, deploy, manage, retire]
      installed: { type: string, format: date }
      model:
        description: Only when this unit is a different model from its position's (an outgoing switch replaced by another make). Left out, the unit is the position's model.
        type: string
      legacy:
        description: The outgoing unit during a replacement; its records carry a -legacy suffix.
        type: boolean
      notes: { type: string }
