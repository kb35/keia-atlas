# Security flaw: a published vulnerability in a model's firmware (the Security flaws capability, src/lib/modules.mjs).
# Its severity, the models and firmware line it is in, which versions are affected and the version that fixes it.
# src/lib/flaws.mjs matches it to the fleet's units. In the demo every flaw is made up (demo: true, CVE-DEMO- ids).
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/security-flaw
title: Security flaw
type: object
additionalProperties: false
required: [id, title, severity, models, affected, published, demo]
properties:
  id: { description: "The CVE id; a made-up one says so: CVE-DEMO-YYYY-NNNN.", type: string, pattern: "^CVE-(DEMO-)?\\d{4}-\\d{4,}$" }
  title: { type: string }
  severity: { enum: [critical, high, medium, low] }
  cvss: { type: number, minimum: 0, maximum: 10 }
  firmware_line: { description: "The line in data/firmware/, when Atlas tracks its versions.", type: string }
  models: { type: array, minItems: 1, items: { type: string } }
  affected: { description: "Which versions, in words.", type: string }
  fixed_in: { description: "The first version with the fix (a release of the firmware line, when there is one).", type: string }
  published: { type: string, format: date }
  source: { description: A source id from data/sources/., type: string }
  aigna: { description: "Aigna's note: what it does about it.", type: string }
  demo: { description: Made up for the demo., const: true }
