# A provider's own records (data/providers/<provider>/<area>/): what a service provider such as Northlight AV keeps
# in its own Keia and never shares with a client (docs/service-providers.md, section 3). One folder per provider,
# one subfolder per area of its work. Each file says its `area`, and the area's own schema checks it:
#   ops     stock, purchase orders, jobs, crews, site surveys, RAMS reviews and handover packs (provider-ops)
# Another area (sales) adds its own branch here with its own schema.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/ext/provider-record
title: A provider's own record
type: object
required: [area, provider]
properties:
  area: { description: "Which part of the provider's work the file belongs to.", enum: [ops, sales] }
  provider: { description: "The provider's organisation id (src/lib/engagements.mjs ORGS).", type: string, pattern: "^[a-z][a-z0-9-]*$" }
allOf:
  - if: { properties: { area: { const: ops } } }
    then: { $ref: "https://kb35.github.io/keia-atlas/schemas/ext/provider-ops" }
