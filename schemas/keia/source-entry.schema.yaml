# Strict JSON Schema copy of Keia's source-entry schema.
#
# Original: vendor/keia/schemas/content/source-entry.schema.yaml.
# Keia keeps source entries in registry files: a small header plus a list of
# entries (see vendor/keia/registry/sources/_example-source.yaml). This schema
# checks one such file; each item in `entries` follows Keia's source-entry fields.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/keia/source-entry
$comment: "keia-schema-version: 1.0"
title: Keia source registry file (strict copy)
description: A list of documents that knowledge is drawn from, each with where to find it and when it was last checked.
type: object
additionalProperties: false
required: [name, version, schema, category, entries]
properties:
  name: { type: string, minLength: 1 }
  version: { type: string, minLength: 1 }
  schema: { const: source-entry }
  category: { type: string, minLength: 1 }
  entries:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/entry" }

$defs:
  entry:
    type: object
    additionalProperties: false
    required: [id, title, description, category, domains, topics, last_verified, access]
    properties:
      id: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      title: { type: string, minLength: 1 }
      description: { type: string, minLength: 1 }
      category: { type: string, minLength: 1 }
      domains:
        type: array
        minItems: 1
        items: { type: string }
      topics:
        type: array
        minItems: 1
        items: { type: string }
      last_verified: { type: string, format: date }
      access:
        description: Keia rule, at least one access tier.
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [tier, method]
          properties:
            tier: { enum: [A, B, C] }
            method: { enum: [api, browser, manual] }
            tool: { type: string }
            parameters: { type: object }
            url: { type: string, format: uri }
            instructions: { type: string }
