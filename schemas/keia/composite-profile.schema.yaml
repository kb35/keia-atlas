# Strict JSON Schema copy of Keia's composite-profile schema.
#
# Keia's original (vendor/keia/schemas/content/composite-profile.schema.yaml)
# describes the fields in prose. This copy states the same fields as checkable
# rules. tests/keia-drift.test.mjs fails if the two disagree on field names or
# on which fields are required.
#
# The top level is left open on purpose: Keia Atlas adds a `keia_atlas:` block
# through schemas/ext/space-type.schema.yaml, which closes it again.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kb35.github.io/keia-atlas/schemas/keia/composite-profile
$comment: "keia-schema-version: 1.0"
title: Keia composite profile (strict copy)
description: What a correctly built space contains, by equipment category, and how to verify it.
type: object
required: [schema, profile, sources, equipment_categories, verification_model]
properties:
  schema:
    const: composite-profile

  profile:
    type: object
    additionalProperties: false
    required: [name, space_type, version, last_updated, owner, purpose]
    properties:
      name: { type: string, minLength: 1 }
      space_type: { $ref: "#/$defs/slug" }
      version: { type: string, minLength: 1 }
      last_updated: { type: string, format: date }
      owner: { type: string, minLength: 1 }
      capacity: { type: string }
      purpose: { type: string, minLength: 1 }

  sources:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/sourceRef" }

  equipment_categories:
    description: Keia rule, at least one equipment category.
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [category, description, object_profile, quantity]
      properties:
        category: { type: string, pattern: "^[a-z0-9_]+$" }
        description: { type: string, minLength: 1 }
        object_profile:
          description: Path to the object profile for this category, or null if none exists yet.
          type: [string, "null"]
        quantity: { type: string, minLength: 1 }
        live_source: { type: string, format: uri }
        notes: { type: string }

  verification_model:
    type: object
    additionalProperties: false
    required: [platforms_to_check]
    properties:
      platforms_to_check:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [platform, check]
          properties:
            platform: { type: string, minLength: 1 }
            check: { type: string, minLength: 1 }

  discrimination:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [description, classification_steps]
      properties:
        description: { type: string }
        classification_steps:
          type: array
          minItems: 1
          items: { type: string }

$defs:
  slug:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  sourceRef:
    type: object
    additionalProperties: false
    required: [file, provides]
    properties:
      file: { type: string, minLength: 1 }
      provides: { type: string, minLength: 1 }
