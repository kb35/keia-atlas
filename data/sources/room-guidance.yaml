  - id: tia-568-cabling
    title: 'ANSI/TIA-568, Commercial Building Telecommunications Cabling (current revision 568-E, 2020)'
    description: >-
      The structured cabling standard. Horizontal cabling is at most 90 m installed (the permanent
      link) and 100 m with patch cords (the channel), and each work area gets at least two
      telecommunications outlets. The standard is sold by TIA; the links are public summaries.
      Used for the data outlets in every space type.
    category: standard
    domains:
