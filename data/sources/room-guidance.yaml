        method: browser
        url: https://learn.microsoft.com/en-us/microsoftteams/rooms/rooms-plan
  - id: microsoft-teams-room-guidance
    title: 'Microsoft Learn: Meeting room guidance for Teams'
    description: >-
      Microsoft's room design guidance. All-in-one audio and video devices suit smaller rooms,
      separate microphones and speakers larger ones; dual front-of-room displays are recommended
      for medium and large rooms and need a touch console. Its Signature Teams Room is 25 × 14 ft
      for 6 to 8 people, a curved table facing a display centred on the table, and power and
      network at both the table and the equipment. Used for the hybrid meeting room, the
      makerspace and the kit class for each room size.
    category: standard
    domains:
      - workplace-technology
    topics:
      - space-type
      - meeting-room
      - room-size
      - video-conferencing
      - power-and-data
    last_verified: "2026-09-30"
    access:
