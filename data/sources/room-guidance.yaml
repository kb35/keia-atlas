# Source registry: public room guidance
# The public industry guidance the space types are based on (decision 0006): display sizing,
# room sizes and the kit class for each size, structured cabling, and the makers' own room sizes
# for the house models. Facts, short summaries and links only; nothing is copied from the documents.
# Where a space type goes beyond these, it says so as a house assumption.

name: Public room guidance

version: "2.0.0"

schema: source-entry

category: standard

entries:
  - id: avixa-v202-display-image-size
    title: 'AVIXA V202.01:2016 (ANSI/INFOCOMM), Display Image Size for 2D Content in Audiovisual Systems (DISCAS)'
    description: >-
      The standard for sizing a displayed image from where people sit: the image height follows
      the farthest viewer and the size of the smallest thing they must read (the element height),
      for two viewing needs, basic decision making (reading content) and analytical decision
      making (pixel-level detail); it also bounds the closest viewer. Sold by AVIXA; the page
      summarises it. Used for the display sizes in every space type with a display.
    category: standard
    domains:
      - workplace-technology
    topics:
      - space-type
      - display-sizing
      - viewing-distance
    last_verified: "2026-09-30"
    access:
      - tier: B
        method: browser
        url: https://www.avixa.org/resources/standards/display-image-size-for-2d-content
      - tier: C
        method: manual
        url: https://webstore.ansi.org/standards/infocomm/avixav202012016
        instructions: The full standard is sold through the ANSI webstore.
  - id: avixa-discas-calculators
    title: 'AVIXA: Analytical and Basic Decision Making calculators (DISCAS)'
    description: >-
      AVIXA's free calculators for the DISCAS standard: solve for the farthest viewer, the
      minimum image height or the maximum resolution. Use to check a display size for a room.
    category: standard
    domains:
      - workplace-technology
    topics:
      - display-sizing
      - viewing-distance
    last_verified: "2026-09-30"
    access:
      - tier: B
        method: browser
        url: https://www.avixa.org/resources/display-image-size-calculators/analytical-and-basic-decision-making-calculations
  - id: avixa-discas-training
    title: 'AVIXA CTS-Prep Workshop: Aspect Ratio and DISCAS (April 2020)'
    description: >-
      AVIXA training slides on DISCAS. Basic decision making usually uses an element height of 2 to
      4 percent of the image, with 3 percent a good starting point; the worked example sizes a
      conference room with a farthest viewer at 28 ft to a 56 in image height at 3 percent (image
      height is the farthest viewer divided by 6). The closest viewer sits no more than 30 degrees
      from eye level to the top of the image. A 16:9 image's height is its diagonal times 9 / 18.36.
    category: standard
    domains:
      - workplace-technology
    topics:
      - display-sizing
      - viewing-distance
    last_verified: "2026-09-30"
    access:
      - tier: B
        method: browser
        url: https://cdn.avixa.org/production/docs/default-source/default-document-library/cts-prep-aspect-ratio-and-discas-apr2020.pdf
  - id: microsoft-teams-rooms-plan
    title: 'Microsoft Learn: Plan for Microsoft Teams Rooms'
    description: >-
      Microsoft's planning guide for meeting rooms. Its sample deployment template sizes rooms as
      Focus (10 × 9 ft, 2 to 4 people), Small (16 × 16 ft, 4 to 6), Medium (18 × 20 ft, 6 to 12)
      and Large (15 × 32 ft, 12 to 16), and asks for power for the screens and the room system.
      Used for the meeting room sizes and capacities.
    category: standard
    domains:
      - workplace-technology
    topics:
      - space-type
      - meeting-room
      - room-size
      - video-conferencing
    last_verified: "2026-09-30"
    access:
