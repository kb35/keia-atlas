# House standard: displays in meeting rooms and signage. Made up for the demo.
# The step-by-step settings for each display line are in its configuration; this standard says what every display must do.
id: displays
name: Displays
area: displays
order: 6
version: "1.0"
effective: "2026-09-29"
owner: Service manager, AV
summary: "Every display is sized for its farthest seat, mounted at the house height, wired to the network for fleet management, and switched by the room system and a timer rather than its own energy saving."
intro: >-
  A display that goes to sleep on its own, sits on nobody's network and changes brightness as the sun moves is the source of
  most "no picture" calls. This standard fixes that for every display in a meeting room or on signage: size it, hang it,
  wire it, then configure it from its configuration guide (Samsung QMC or LG UH5Q-E), in the setup order.
scope:
  - Flat panel displays in meeting rooms, huddle rooms, focus rooms, recording studios, reception and signage.
  - "Not in scope: desk monitors (home offices and workstations) and LED walls, which are designed per project."
related: [meeting-av, signage, network, power]
applies_to:
  classes: [display]
  models: [samsung-qm65c, samsung-qm85c, lg-55uh5q-e, lg-75uh5q-e]
  configurations: [samsung-qmc-display, lg-uh5q-display]
  space_types: [conference-room-small, conference-room-medium, conference-room-large, hybrid-meeting-room, huddle-room, makerspace, reception-concierge, pantry]
figures:
  - { n: "6x", label: To the farthest seat }
  - { n: "1,000 mm", label: "Bottom edge, seated" }
  - { n: "Wired", label: Every display }
  - { n: "Off", label: Own energy saving }
sections:
  - id: sizing
    title: Choosing the size
    intro: Size by the farthest seat and the content, not by the wall. The table is worked out for 16:9 displays.
    figure: viewing-distance
    table:
      caption: "Farthest seat for each size (house rule of thumb, 16:9)"
      columns: [Size, Image height, "Farthest seat, general content (6x)", "Farthest seat, detailed content (4x)"]
      rows:
        - [55 inch, 0.69 m, 4.1 m, 2.7 m]
        - [65 inch, 0.81 m, 4.9 m, 3.2 m]
        - [75 inch, 0.93 m, 5.6 m, 3.7 m]
        - [85 inch, 1.06 m, 6.3 m, 4.2 m]
        - [98 inch, 1.22 m, 7.3 m, 4.9 m]
      note: "Detailed content is spreadsheets, drawings and code. For a room where people read fine detail, use the AVIXA DISCAS method with the real content instead of this table."
    rules:
      - id: farthest-seat
        level: must
        rule: Choose the display so the farthest seat is no more than six times the image height away, or four times for rooms used for detailed content.
        why: Text on a slide must be readable from the back of the room; too small a display is the most common design fault in meeting rooms.
        check: Measure the farthest seat on the room plan and compare it with the table.
        record: on-site
        house: true
        sources: [avixa-discas]
      - id: discas
        level: should
        rule: For a presentation, training or analysis room, size the display with the AVIXA DISCAS method using the smallest text people must read.
        why: The rule of thumb is a floor; DISCAS works from what viewers actually need to see.
        check: The design pack includes the DISCAS calculation.
        sources: [avixa-discas]
      - id: commercial
        level: must
        rule: Use only commercial displays rated for the hours they will run (24/7 for signage), from the house lines in the space type.
        why: Consumer TVs are not rated for long hours, lack network control and can change their settings with an update.
        check: The model in Keia Atlas is a house model with a 24/7 rating.
        record: device-models:rated_hours
        house: true
  - id: mounting
    title: Mounting height and fixing
    figure: display-height
    rules:
      - id: seated-height
        level: must
        rule: In seated rooms, mount the display with its bottom edge 1,000 mm above the floor (plus or minus 50 mm), centred on the table, with the camera or video bar directly above or below it.
        why: Faces on the far end then sit close to a seated person's eye height (about 1,200 mm), so people look at the camera while they look at the screen.
        check: Measure from the finished floor to the bottom edge of the display.
        record: on-site
        house: true
      - id: vertical-angle
        level: should
        rule: Keep the top of the image within 30 degrees above the eye line of the nearest seat.
        why: A display that is too high or too close strains necks in a long meeting.
        check: On the room plan, the nearest seat's distance is at least 1.7 times the height from eye level (1,200 mm) to the top of the image.
        house: true
      - id: fixing
        level: must
        rule: Fix the mount into studs, blockwork or a backing plate with fixings rated for at least four times the display's weight, never into plasterboard alone.
        why: An 85 inch display weighs over 40 kg; a mount that pulls out of a wall is a serious injury.
        check: Photo of the fixings before the display is hung, and the mount's rating in the handover pack.
        record: on-site
        house: true
      - id: protrusion
        level: must
        rule: In corridors, reception and other routes people walk along, keep the display and mount within 100 mm of the wall when its bottom edge is between 685 and 2,030 mm above the floor.
        why: Someone with a visual impairment finds obstacles with a cane at floor level; a display sticking out above that is not detected.
        check: Measure the depth from the wall to the front of the display.
        record: on-site
        sources: [ada-307]
      - id: outlets-behind
        level: must
        rule: Put the power and data outlets in a recessed box behind the display, inside its outline.
        why: No cables below the screen, and the plugs can be reached by lifting the display off its mount.
        check: See the power and earthing standard; photo before the display is hung.
        record: on-site
        house: true
  - id: network
    title: Network connection and fleet management
    rules:
      - id: wired
        level: must
        rule: Connect every display's LAN port to a wired outlet on the Displays and signage VLAN (31), with a DHCP reservation and the hostname site-room-dsp and number.
        why: A display on the network can be turned on, checked and updated from anywhere; one without is only found broken when a meeting starts.
        check: The display answers on its reserved address and its name resolves in DNS.
        record: [installs:hostname, installs:mac]
        house: true
      - id: fleet
        level: must
        rule: Enrol every display in its manufacturer's fleet management (Samsung VXT or LG Business Cloud) under its hostname, and turn on SNMP for monitoring.
        why: Fleet management shows every display's power, input, temperature and firmware in one place and can act on it; monitoring raises an alert when one stops answering.
        check: The display is online in fleet management and in monitoring.
        record: connect
        house: true
        sources: [samsung-manual, lg-guide]
      - id: network-standby
        level: must
        rule: Set the display to keep its network connection in standby (Samsung Remote Configuration on; LG PM Mode Network Ready and Wake On LAN on).
        why: With the default standby the display drops off the network when it is off, so nothing can turn it back on remotely.
        check: Turn the display off, then turn it on from fleet management.
        record: on-site
        sources: [samsung-manual, lg-guide]
      - id: ip-control
        level: should
        rule: Control the display over the network (Samsung MDC, LG network control or the room's control system), and use RS-232 only where the room system has no network control.
        why: Network control needs no extra cable and works from fleet management too.
        check: The room system turns the display on and off and changes its input during commissioning.
        house: true
  - id: power-behaviour
    title: Timers, energy saving and standby
    intro: "The room system turns a meeting room display off when the room is empty, and a daily timer is the backstop. The display's own energy saving and automatic power off are turned off, because they cause more trouble than they save."
    rules:
      - id: timers
        level: must
        rule: Set an On timer on working days at the office's opening time and an Off timer every day at closing time plus one hour, with the country's public holidays, from a clock set by NTP.
        why: Signage is on when people arrive, and every display is off overnight even if the room system misses it; that is where the energy is saved.
        check: The timers in fleet management match the office's hours in Keia Atlas.
        record: sites:office_hours
        house: true
      - id: energy-saving-off
        level: must
        rule: Turn the display's energy saving and automatic brightness modes off (Samsung Energy Saving Solution; LG Energy Saving and Smart Energy Saving).
        why: They dim the picture, make content look dull and change the brightness under the camera during a call. Turning the display off when nobody is there saves far more.
        check: The settings read Off in fleet management.
        record: connect
        sources: [samsung-manual, lg-guide]
      - id: auto-off-off
        level: must
        rule: Turn off every automatic power off (no signal power off, auto power off, no IR power off, DPM standby).
        why: When the video bar sleeps the display switches itself off and may not wake for the next meeting, which people report as no picture; nobody uses a remote, so an idle timer turns working displays off.
        check: Leave a room idle for 20 minutes, then start a call; the display wakes and shows the call.
        record: on-site
        sources: [samsung-manual, lg-guide]
      - id: power-on-after-cut
        level: should
        rule: Set the display to come back to its last state (or on) after a power cut.
        why: Signage comes back on its own; the room system or timer turns an empty room off.
        check: Switch the outlet off and on during commissioning.
        house: true
  - id: inputs
    title: Inputs and CEC
    rules:
      - id: input-map
        level: must
        rule: Connect the video bar or signage player to HDMI 1, and keep HDMI 2 for a wired laptop input where the space type has one.
        why: The same input everywhere makes remote support simple, and on the LG line HDMI 3 and DisplayPort cannot wake the display.
        check: The wiring in Keia Atlas matches the display's inputs.
        record: space-types:wiring
        house: true
        sources: [lg-owners-manual]
      - id: cec
        level: must
        rule: Turn HDMI-CEC on in rooms where the video bar wakes the display, and off for signage and rooms with a control system.
        why: The video bar uses CEC to wake the display and select its input; anywhere else CEC from a player or laptop switches the display unexpectedly.
        check: Start a call from the touch controller in a video bar room; the display wakes on the right input.
        record: on-site
        house: true
      - id: auto-input
        level: should
        rule: In meeting rooms, let the display switch back to HDMI 1 when a wired laptop is unplugged; on signage, fix the input.
        why: The next meeting starts on the video bar, and signage never shows a blank input.
        check: Plug in and unplug a laptop at the table.
        house: true
  - id: care
    title: Firmware, time, locks and names
    rules:
      - id: firmware
        level: must
        rule: Turn automatic updates off and apply the release the Lab has passed, from fleet management, in the office's change window.
        why: An update can change menus and defaults or restart a display during a meeting.
        check: Every display runs the fleet standard firmware for its model.
        record: firmware:releases
        house: true
      - id: locks
        level: must
        rule: Change the default PIN or password to the site's, then lock the menus, the buttons, USB and (LG) Wi-Fi and screen share, as the last setup step.
        why: Displays are in public rooms; a changed setting is a support call, and a default PIN is on the internet.
        check: The remote cannot open the menu without the PIN; fleet management still works.
        record: on-site
        house: true
      - id: clone
        level: should
        rule: Configure the first display of each model fully, save its settings to USB (Samsung Clone Product, LG Setting Data Cloning) and load them on the rest, then set only each one's name.
        why: One tested set of settings, applied the same way on every display, in a fraction of the time.
        check: The configuration check in the project's Deploy page passes for every display.
        house: true
references:
  - id: avixa-discas
    name: ANSI/AVIXA V202.01, Display Image Size for 2D Content in Audiovisual Systems (DISCAS)
    publisher: AVIXA
    kind: standard
    summary: A method for choosing image size from the farthest viewer's distance, what the viewer has to do with the content (read it or study it) and the size of the smallest element on screen.
    url: https://www.avixa.org/standards/discas
    checked: "2026-09-29"
  - id: ada-307
    name: 2010 ADA Standards for Accessible Design, section 307 (Protruding Objects)
    publisher: United States Access Board and Department of Justice
    kind: regulation
    summary: Wall-mounted objects whose leading edge is between 27 and 80 inches (685 and 2,030 mm) above the floor may stick out at most 4 inches (100 mm) into a circulation path.
    url: https://www.access-board.gov/ada/#ada-307
    checked: "2026-09-29"
  - id: samsung-manual
    name: Samsung QBC, QHC and QMC user manual (BN81-24537A-12)
    publisher: Samsung
    kind: vendor
    summary: The QMC's power control, energy saving, timers, MDC control, SNMP and locks, with their menu paths.
    source: samsung-qmc-user-manual
    checked: "2026-09-29"
  - id: lg-guide
    name: LG Digital Signage user guide, webOS 24
    publisher: LG
    kind: vendor
    summary: The UH5Q-E's power modes (PM Mode, Wake On LAN, no signal power off), energy saving, scheduler, SNMP, LG Business Cloud and lock mode.
    source: lg-webos-24-signage-user-guide
    checked: "2026-09-29"
  - id: lg-owners-manual
    name: LG UH5Q-E owner's manual (43 to 65 inch)
    publisher: LG
    kind: vendor
    summary: The rear ports, and that HDMI 3 and DisplayPort cannot wake the display from DPM standby.
    source: lg-uh5q-owners-manual-43-65
    checked: "2026-09-29"
demo: true
