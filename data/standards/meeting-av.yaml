# House standard: meeting room AV. Made up for the demo. The devices and their settings are in the space types and configurations.
id: meeting-av
name: Meeting room AV
area: meeting-av
order: 7
version: "1.0"
effective: "2026-03-01"
owner: Service manager, AV
summary: Every meeting room is built from its space type, with the camera at the display, audio that covers every seat, and one way to join a call.
intro: >-
  The space type says what goes in a room and the configurations say how each device is set up. This standard covers what
  sits between them: where things go, how the room is cabled, what it must sound and look like, and how it is handed over.
scope:
  - Meeting rooms, huddle rooms, focus rooms and recording studios with video or content sharing.
  - The devices in the room, their cabling and their placement.
related: [displays, scheduler-panels, network, power, cabling]
applies_to:
  classes: [video-bar, codec, touch-controller, camera, microphone, loudspeaker, av-switcher, av-extender, amplifier]
  configurations: [poly-x-google-meet, poly-tc10-pairing, poly-e-series-camera, poly-ip-microphone-pairing, logitech-meetup-2-google-meet]
  space_types: [conference-room-small, conference-room-medium, conference-room-large, hybrid-meeting-room, huddle-room, focus-room, presentation-recording-room]
figures:
  - { n: 1, label: Space type per room }
  - { n: "0.6 s", label: Most echo (RT60) }
  - { n: "100%", label: Seats seen and heard }
  - { n: 1, label: Way to join a call }
sections:
  - id: build
    title: Build to the space type
    rules:
      - id: profile-first
        level: must
        rule: Build every room to its space type and build option in Keia Atlas; anything different is a change record before it is installed.
        why: A room built to its space type can be supported by anyone who knows the space type, and its spares are already on the shelf.
        check: Keia Atlas shows the room matching its space type after commissioning.
        house: true
      - id: certified
        level: must
        rule: Use only devices certified for the room's meeting platform (Google Meet or Microsoft Teams Rooms) in the mode the room uses.
        why: Certified devices get updates tested with the platform; uncertified ones break without warning.
        check: The model's page in Keia Atlas lists the platform as supported.
        sources: [google-meet-hardware]
      - id: configured
        level: must
        rule: Configure every device from its configuration in Keia Atlas, in the setup order, and record it in the project's Deploy page.
        why: The same settings everywhere mean a fault in one room is solved once.
        check: Every device in the room shows Configured in the project.
        house: true
  - id: placement
    title: Where things go
    rules:
      - id: camera-at-display
        level: must
        rule: Mount the camera or video bar directly above or below the main display, centred, with its lens between 900 and 1,300 mm above the floor in a seated room.
        why: People look at the screen, so a camera next to it makes eye contact with the far end.
        check: Measure the lens height; the camera's view shows every seat with heads in the top third of the frame.
        house: true
      - id: seats-in-view
        level: must
        rule: Check that every seat is in the camera's field of view and within the microphones' pickup range from the manufacturer's data sheet.
        why: Someone out of view or out of pickup range is out of the meeting.
        check: Sit in each seat during commissioning; the far end sees and hears you clearly.
        house: true
      - id: touch-controller
        level: should
        rule: Put the touch controller on the table within reach of the seat nearest the display, with its cable through the table box, not across the table.
        why: The person running the meeting sits there, and a loose cable gets pulled.
        check: Photo of the table at handover.
        house: true
      - id: no-backlight
        level: should
        rule: Do not put the camera facing a window, and fit blinds on windows behind the seats.
        why: A bright window behind people turns them into silhouettes.
        check: Look at the camera image with the blinds open at midday.
        house: true
  - id: room-quality
    title: How the room must sound and look
    rules:
      - id: reverb
        level: should
        rule: Keep the room's reverberation time (RT60) at or below 0.6 seconds, with acoustic panels where it is higher.
        why: An echoey room is hard to hear at the far end however good the microphones are.
        check: A measurement with a sound level meter or app during commissioning, recorded in the handover pack.
        house: true
      - id: audio-coverage
        level: should
        rule: Design ceiling or wall loudspeakers for even sound across the seats, following the AVIXA audio coverage uniformity method.
        why: Everyone should hear the far end at the same level, not loud at one end and faint at the other.
        check: Measure the level at each seat; the spread is within the design's target.
        sources: [avixa-acu]
      - id: lighting
        level: should
        rule: Light faces evenly from the front, and avoid downlights directly above the seats.
        why: Cameras need light on faces; downlights cast shadows under eyes.
        check: Look at the camera image with the room's normal lighting.
        house: true
  - id: cabling
    title: Cabling and power in the room
    rules:
      - id: room-outlets
        level: must
        rule: Provide the data and power outlets the space type lists, behind the display and at the table, with every device on its own outlet.
        why: A room built with too few outlets ends up on a desk switch or a power strip under the table.
        check: The outlet count matches the space type.
        house: true
      - id: leads-fixed
        level: must
        rule: Label every fixed room lead (HDMI, USB-C, network) at both ends and tie it off in the table box and behind the display.
        why: Leads that are labelled and tied are not borrowed or unplugged.
        check: Every lead in the room has a label at each end.
        house: true
      - id: usb-length
        level: must
        rule: Keep passive USB runs within the USB limit (about 5 m for USB 2.0 and less for faster USB); use an active or extended USB link beyond that.
        why: USB beyond its length fails in ways that look like a faulty camera.
        check: Measure the run; an extender is fitted where needed.
        sources: [usb-if]
  - id: handover
    title: Handover
    rules:
      - id: test-call
        level: must
        rule: Make a test call from the room to another room and to a laptop, share content wired and wireless, and book the room from its panel.
        why: Proves the room works end to end, not just each device on its own.
        check: The room's verification in Keia Atlas is complete with the test results.
        house: true
      - id: room-guide
        level: should
        rule: Put a short printed guide on the table (join, share, call for help) with the room's name and the service desk number.
        why: People who struggle with a room ask for help instead of giving up.
        check: Guide present at handover.
        house: true
references:
  - id: avixa-acu
    name: ANSI/AVIXA A102.01, Audio Coverage Uniformity in Listener Areas
    publisher: AVIXA
    kind: standard
    summary: A method for measuring and stating how evenly a sound system covers the listening area, so a design can set a target and prove it was met.
    url: https://www.avixa.org/standards
    checked: "2026-09-29"
  - id: google-meet-hardware
    name: Google Meet hardware certified devices
    publisher: Logitech
    kind: vendor
    summary: The list of devices certified for Google Meet hardware, which the space types choose from.
    source: logitech-google-meet-hardware-certified-devices
    checked: "2026-09-29"
  - id: usb-if
    name: USB 2.0 and USB 3.2 specifications
    publisher: USB Implementers Forum
    kind: standard
    summary: Set the electrical limits that keep passive USB cables short, about 5 m for USB 2.0 and shorter for faster modes.
    url: https://www.usb.org/documents
    checked: "2026-09-29"
demo: true
