# Device class: Signage player
# A Keia object profile: what a healthy device of this class looks like on every
# platform that knows about it. Specific models are in data/device-models/ (step 3).

schema: object-profile

profile:
  name: Signage player
  object_role: Small computer that plays scheduled content on a digital signage display
  naming_prefixes:
    - sig
  version: "1.0"
  last_updated: "2026-09-27"
  owner: Keia Atlas maintainers

sources:
  - file: data/sources/room-guidance.yaml
    provides: Which space types use this class of device, and where it goes

platforms:
  keia_atlas:
    required_fields:
      - space
      - model
      - serial
      - lifecycle_state
      - expected_firmware
    healthy_indicators:
      - recorded in the space its space type expects
      - every port wired as the space type says
  inventory:
    required_fields:
      - asset_tag
      - serial
      - model
      - space
      - status
      - hostname
    healthy_indicators:
      - status is active
      - space matches where the device is installed
  dhcp_dns:
    required_fields:
      - hostname
      - mac_address
      - ip_address
    healthy_indicators:
      - address reservation matches the MAC address
      - forward and reverse DNS records resolve
  device_management:
    required_fields:
      - device_name
      - serial
      - firmware_version
    healthy_indicators:
      - online in the vendor's content and device management service
      - firmware at the fleet standard for the model
      - settings match the configuration profile for the model
    firmware_expectations: Set per model by its configuration profile
  monitoring:
    required_fields:
      - monitor_name
    healthy_indicators:
      - reporting
      - no open critical alerts

consistency:
  - check: serial match
    compare:
      - keia_atlas.serial
      - inventory.serial
  - check: space match
    compare:
      - keia_atlas.space
      - inventory.space
  - check: hostname match
    compare:
      - inventory.hostname
      - dhcp_dns.hostname
  - check: firmware match
    compare:
      - device_management.firmware_version
      - keia_atlas.expected_firmware

discrimination:
  display_shows_nothing:
    likely_causes:
      - player without PoE
      - HDMI cable or display input
      - no content scheduled
    first_check: device_management
  player_offline:
    likely_causes:
      - PoE port off
      - network cable unplugged
      - address changed
    first_check: dhcp_dns

not_applicable:
  - room_booking
