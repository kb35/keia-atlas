# Device class: Desk video device
# A Keia object profile: what a healthy device of this class looks like on every
# platform that knows about it. Specific models are in data/device-models/ (step 3).

schema: object-profile

profile:
  name: Desk video device
  object_role: Personal video device with its own screen, camera and speakers, also usable
    as a laptop monitor
  naming_prefixes:
    - vc
  version: "1.0"
  last_updated: "2026-09-27"
  owner: Keia Atlas maintainers

sources:
  - file: data/sources/room-guidance.yaml
    provides: Which space types use this class of device, and where it goes

platforms:
  keia_atlas:
    required_fields:
      - space
      - model
      - serial
      - lifecycle_state
      - expected_firmware
    healthy_indicators:
      - recorded in the space its space type expects
      - every port wired as the space type says
  inventory:
    required_fields:
      - asset_tag
      - serial
      - model
      - space
      - status
      - hostname
    healthy_indicators:
      - status is active
      - space matches where the device is installed
  dhcp_dns:
    required_fields:
      - hostname
      - mac_address
      - ip_address
    healthy_indicators:
      - address reservation matches the MAC address
      - forward and reverse DNS records resolve
  device_management:
    required_fields:
      - device_name
      - serial
      - firmware_version
    healthy_indicators:
      - online in the vendor's device management service
      - firmware at the fleet standard for the model
      - settings match the setup guide for the model
    firmware_expectations: Set per model by its setup guide
  room_booking:
    required_fields:
      - resource_name
      - capacity
    healthy_indicators:
      - room resource exists and is linked to the device
      - capacity matches the space

consistency:
  - check: serial match
    compare:
      - keia_atlas.serial
      - inventory.serial
  - check: space match
    compare:
      - keia_atlas.space
      - inventory.space
  - check: hostname match
    compare:
      - inventory.hostname
      - dhcp_dns.hostname
  - check: firmware match
    compare:
      - device_management.firmware_version
      - keia_atlas.expected_firmware

discrimination:
  meeting_will_not_start:
    likely_causes:
      - device offline
      - room account signed out
    first_check: device_management

not_applicable:
  - monitoring
