# Device class: Home network gateway
# A Keia object profile: what a healthy device of this class looks like on every
# platform that knows about it. Specific models are in data/device-models/ (step 3).

schema: object-profile

profile:
  name: Home network gateway
  object_role: Router and Wi-Fi access point in one box, for a remote worker's home, managed
    centrally
  version: "1.0"
  last_updated: "2026-09-27"
  owner: Keia Atlas maintainers

sources:
  - file: data/sources/room-guidance.yaml
    provides: Which space types use this class of device, and where it goes

platforms:
  keia_atlas:
    required_fields:
      - space
      - model
      - serial
      - lifecycle_state
      - expected_firmware
    healthy_indicators:
      - recorded in the space its space type expects
      - every port wired as the space type says
  inventory:
    required_fields:
      - asset_tag
      - serial
      - model
      - space
      - status
    healthy_indicators:
      - status is active
      - space matches where the device is installed
  device_management:
    required_fields:
      - device_name
      - serial
      - firmware_version
    healthy_indicators:
      - online in the vendor's cloud management service
      - firmware at the fleet standard for the model
      - settings match the setup guide for the model
    firmware_expectations: Set per model by its setup guide

consistency:
  - check: serial match
    compare:
      - keia_atlas.serial
      - inventory.serial
  - check: space match
    compare:
      - keia_atlas.space
      - inventory.space
  - check: firmware match
    compare:
      - device_management.firmware_version
      - keia_atlas.expected_firmware

discrimination:
  no_internet:
    likely_causes:
      - home broadband down
      - gateway offline
      - WAN cable unplugged
    first_check: device_management

not_applicable:
  - dhcp_dns
  - room_booking
  - monitoring
