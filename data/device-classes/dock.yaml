# Device class: Dock
# A Keia object profile: what a healthy device of this class looks like on every
# platform that knows about it. Specific models are in data/device-models/ (step 3).

schema: object-profile

profile:
  name: Dock
  object_role: Desk hub that gives a laptop display, network, charging and accessories over
    one cable
  version: "1.0"
  last_updated: "2026-09-27"
  owner: Keia Atlas maintainers

sources:
  - file: data/sources/room-guidance.yaml
    provides: Which space types use this class of device, and where it goes

platforms:
  keia_atlas:
    helpful_fields:
      - space
      - model
      - serial
      - lifecycle_state
    healthy_indicators:
      - recorded in the space its space type expects
      - every port wired as the space type says
  inventory:
    helpful_fields:
      - asset_tag
      - serial
      - model
      - space
      - status
    healthy_indicators:
      - status is active
      - space matches where the device is installed

consistency:
  - check: serial match
    compare:
      - keia_atlas.serial
      - inventory.serial
  - check: space match
    compare:
      - keia_atlas.space
      - inventory.space

discrimination:
  laptop_not_charging_or_no_display:
    likely_causes:
      - cable not Thunderbolt or USB-C rated
      - dock without power
      - laptop port not Thunderbolt
    first_check: keia_atlas

not_applicable:
  - dhcp_dns
  - device_management
  - room_booking
  - monitoring
