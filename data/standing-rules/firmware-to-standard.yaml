# Standing rule: bring a unit's firmware to the standard. Demo data (rule F8). Firmware cannot be put back by
# software, so the rule never runs alone: it prepares the update and a person confirms every run.
id: firmware-to-standard
name: Firmware rule
title: Bring a unit's firmware to the standard
owner: sofia
service: av
approved: { at: "2026-03-20T15:00", change: CHG-158, version: 2 }
verb: Update {target} to the standard firmware
reversal: { kind: ask, words: "Firmware cannot be put back by software, so a person confirms every run." }
applies_to:
  classes: [video-bar, touch-controller, codec]
  trigger: A unit's firmware does not match the standard
window: "22:00 to 05:00"
conditions:
  - A person confirmed this run
  - Inside the window, 22:00 to 05:00, with no meeting booked until after it
  - The standard version passed the Lab
  - Not in a change freeze
caps: { per_wave: 5, booked_meeting: never, freeze: never, halt_after: 1 }
steps:
  - { kind: read, words: "Read the unit's version and the standard", seconds: 2 }
  - { kind: write, words: "Send the update and let the unit restart", seconds: 600 }
  - { kind: readback, words: "Read back the version and make a test call", seconds: 60 }
reads:
  - The unit's firmware (device management)
  - The standard and its Lab result (Keia Atlas)
  - Bookings (room booking)
rules_out:
  - A meeting before the update ends
  - A version the Lab has not passed
not_checked:
  - Every accessory's own firmware (each is its own run)
cadence: confirmed by a person
runs:
  - { id: RUN-6040, at: "2026-09-16T22:30", result: done, target: "lon-203-vc01, 4.6.1 to 4.6.2", by: sofia, did: "Updated to 4.6.2.460046 and made a test call", ms: 712000 }
  - { id: RUN-6044, at: "2026-09-23T22:30", result: done, target: "cph-407-vc01, 4.6.1 to 4.6.2", by: sofia, did: "Updated to 4.6.2.460046 and made a test call", ms: 698000 }
demo: true
