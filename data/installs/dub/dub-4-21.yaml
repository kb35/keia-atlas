# Installed in dub-4-21. Serials and asset tags are made up.

# The UniFi pilot (decision 0028): on 21 Sept 2026 both access switches were replaced by UniFi Pro Max 48 PoE
# in the same rack units, with the same patching. The Cisco units are the outgoing (legacy) units until
# they are collected; the rack file records what stood in each slot before.
# The same day the room was built out to its own sizing (20 rooms, 68 desks, 8 video rooms: 199 outlets): three more
# UniFi Pro Max 48 PoE access switches, so five in all, in a 42U rack with five 48-port patch panels.
space: dub-4-21
positions:
  - position: access-switch#1
    model: unifi-usw-pro-max-48-poe
    hostname: dub-421-as01
    units:
      - serial: DEMO-DUB-001206
        asset_tag: AG-001206
        stage: retire
        installed: "2021-09-06"
        legacy: true
        model: cisco-catalyst-9200l-48p-4g
        notes: Cisco Catalyst 9200L-48P-4G, replaced in the UniFi pilot on 21 Sept 2026. Unplugged, waiting to be collected.
