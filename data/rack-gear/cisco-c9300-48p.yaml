# Rack equipment: Cisco Catalyst 9300-48P. Facts from the vendor documents listed; how Aigna uses it is ours (demo).
id: cisco-c9300-48p
manufacturer: Cisco
model: Catalyst 9300-48P
part_number: C9300-48P
kind: access-switch
rack_units: 1
width: full
face: rj48-module
owner: IT infrastructure
does: 'Access switch with power over Ethernet: the data outlets on this floor connect to it through the patch panel.'
front: 48x RJ-45 10/100/1000 PoE+ ports arranged in two rows across most of the front width; a modular uplink-network-module
  bay at the right-hand end for SFP+/SFP28 uplinks; USB mini-Type-B console port and a USB Type-A storage port near
  the uplink bay; Beacon/UID LED and button, plus system and port-status LEDs, in the upper-left corner; a Mode
  button for cycling port-LED display modes (link/PoE). Fans are on the rear panel (3 hot-swappable 12V fan modules
  with their own green status LEDs).
facts:
  Width (mm): '445'
  Depth (mm): '488'
  Height (mm): '44'
  Weight: 7.59 kg
  Default power supply: PWR-C1-715WAC (options range from 350W to 1900W AC, plus a 715W DC option)
  Poe budget: 437W to 1440W of PoE+ power depending on power-supply configuration (per Cisco's PoE table)
sources:
- title: 'cisco.com: Product-overview'
  url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig/Product-overview.html
- title: 'cisco.com: technical-specs'
  url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig/technical-specs.pdf
