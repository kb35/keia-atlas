  url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9300-series-switches/nb-06-cat9300-ser-data-sheet-cte-en.html
leds:
  system_led: green = normal operation; amber = power supply or fan problem
  port_led_stat_mode: green (solid) = link present; blinking green = link activity
  port_led_poe_mode: green = PoE active and functioning normally
