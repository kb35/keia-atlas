does: 'Core switch in the UniFi house standard, one of a pair: every access switch in the building uplinks to it over 10G fibre, and it connects to the gateways over 25G.'
front: 'Silver steel front. Left to right: a 1.3-inch touchscreen (switch management and AR), a plain section with vent slots above, then 28 10G SFP+ cages in 14 columns (odd numbers on top), then four 25G SFP28 cages (29 and 31 on top, 30 and 32 below), then a recessed reset button. At the back: the RPS power backup input, four fans and the AC inlet with a safety latch.'
