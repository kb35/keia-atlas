does: 'Gateway and firewall at the internet edge in the UniFi house standard, one of a pair in Shadow Mode (one takes over if the other fails). It also runs the UniFi Network application that manages the site''s UniFi switches.'
front: 'Silver steel front with vent slots along the top. A 1.3-inch touchscreen at the left; at the right, port 1 (2.5 GbE RJ45, WAN by default) above port 2 (2.5 GbE RJ45), SFP+ ports 3 and 4, SFP28 ports 5 (WAN by default) and 6, then a recessed reset button. At the back: three fans and two hot-swappable 150W power supplies, each with its own AC inlet.'
