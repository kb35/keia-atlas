# Rack equipment: Palo Alto Networks PA-445. Facts from the vendor documents listed; how Aigna uses it is ours (demo).
id: paloalto-pa-445
manufacturer: Palo Alto Networks
model: PA-445
part_number: PA-445
kind: firewall
rack_units: 1
width: tray
face: fw-pa400
owner: IT infrastructure
does: Firewall at the internet edge, one of a pair. A desktop unit on a rack tray.
front: 'Left to right: 2x USB-A ports (debug/admin only), an RJ-45 console port and a micro-USB console port, then
  1x combo SFP/RJ-45 1G port, a dedicated 1G RJ-45 out-of-band management port, then the main 8x RJ-45 1G traffic
  ports (4 plain, 4 PoE-capable), then the two power-adapter inlets, with 3 status LEDs (PWR, STAT, ALM) grouped
  near the power inlets. The PA-415 and PA-445 have identical port counts but a visually different panel layout
  from each other (Palo Alto notes this explicitly). No HA LED on this model (that only exists on the PA-410).'
facts:
  Width (mm): '330.2'
  Depth (mm): '225.4'
  Height (mm): '42.2'
  Weight: 'standalone lb: 8.7, shipping lb: 12.6'
  Typical consumption w: 140 W (with 91W of PoE output)
  Max consumption w: 146 W (with 91W of PoE output)
  Input: 100-240 VAC, 50-60 Hz, single 150W external adapter, optional second adapter for redundancy
  Max current: 2.9 A @ 12 VDC
  Heat output btu hr: '117'
sources:
- title: 'digitalscepter.com: pa-400-series'
  url: https://digitalscepter.com/assets/datasheets/pa-400-series.pdf
- title: 'docs.paloaltonetworks.com: pa-400-front-panel'
  url: https://docs.paloaltonetworks.com/hardware/pa-400-hardware-reference/pa-400-firewall-overview/pa-400-front-panel
- title: 'docs.paloaltonetworks.com: interpret-the-leds-on-a-pa-400-firewall'
  url: https://docs.paloaltonetworks.com/hardware/pa-400-hardware-reference/service-the-pa-400-firewall-hardware/interpret-the-leds-on-a-pa-400-firewall
leds:
  pwr: green = powered on; off = not powered / internal power fault
  stat: green = firewall operating normally; red = firewall booting
  alm: red = hardware failure (power adapter, drive, overheat, or HA failover); off = normal
