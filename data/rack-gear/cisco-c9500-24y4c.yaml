# Rack equipment: Cisco Catalyst 9500-24Y4C. Facts from the vendor documents listed; how Aigna uses it is ours (demo).
id: cisco-c9500-24y4c
manufacturer: Cisco
model: Catalyst 9500-24Y4C
part_number: C9500-24Y4C
kind: core-switch
rack_units: 1
width: full
face: sfp24-qsfp4
owner: IT infrastructure
does: 'Core switch: the building''s centre. Every floor''s fibre and the firewalls connect here.'
front: '24x 25G SFP28 downlink ports across the left two-thirds of the panel, arranged in a single row; 4x 100G
  QSFP28 uplink ports grouped at the right of that row for redundant/stacking uplinks; RJ-45 console port, USB-A
  and USB micro-B (or USB-C on later units) console/management ports to the right of the port bank; a row of system
  status LEDs (SYSTEM, STATUS, ACTIVE) plus a Mode/Beacon button in the upper-left corner; hot-swappable fan tray
  and dual power-supply bays on the rear. Not stated: exact per-LED colour meanings for this model (the general
  Catalyst 9000 convention is green = normal/link, amber = fault/degraded, off = no power/link).'
facts:
