# Rack equipment: Ubiquiti UniFi Switch Pro Max 48 PoE. Facts from the vendor documents listed (checked 29 Sept 2026); how Aigna uses it is ours (demo).
id: unifi-usw-pro-max-48-poe
manufacturer: Ubiquiti
model: UniFi Switch Pro Max 48 PoE
part_number: USW-Pro-Max-48-PoE
device_model: unifi-usw-pro-max-48-poe
standard: unifi
kind: access-switch
rack_units: 1
width: full
face: unifi-sw48
owner: IT infrastructure
does: 'Access switch with power over Ethernet, in the UniFi house standard: the data outlets on this floor connect to it through the patch panel, and it uplinks to the core over 10G fibre.'
front: 'Silver steel front. Left to right: a 1.3-inch touchscreen (switch management and AR), then 48 RJ45 ports in three blocks of 16, odd numbers on the top row (1 to 24 Gigabit PoE+, 25 to 32 Gigabit PoE++, 33 to 40 2.5 GbE PoE+, 41 to 48 2.5 GbE PoE++), then four 10G SFP+ cages (49 and 51 on top, 50 and 52 below), then a recessed reset button. The RJ45 ports light up (Etherlighting). At the back: the RPS power backup input, four fans and the AC inlet.'
facts:
  Width (mm): '442.4'
  Depth (mm): '400 (399.6 on the dimension drawing)'
  Height (mm): '44 (43.7 on the dimension drawing)'
  Weight: 6.2 kg without brackets, 6.3 kg with
  Power supply: AC/DC, internal, 870W; universal input 100–240V AC, 50/60 Hz; DC backup from a UniFi RPS
  Max consumption: 100W excluding PoE output, 820W including it
  Poe budget: 720W total PoE availability (32 PoE+ ports at up to 32W, 16 PoE++ ports at up to 64W)
  Uplinks: 4x 10G SFP+
leds:
  etherlighting: The RJ45 ports light up to show port location, speed or link, and native VLAN or network
  touchscreen: 1.3-inch touchscreen for status and management
