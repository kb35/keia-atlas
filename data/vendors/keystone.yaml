# Demo vendor. The company, contract and figures are made up.
id: keystone
name: Keystone Service
kind: service
summary: Maintenance contract for meeting room equipment at every office. Break-fix on site and advance replacement.
regions: [amer, emea, apac]
people: [dev]
owner: sofia
contract:
  ref: AG-SVC-2026-01
  start: "2026-01-01"
  end: "2028-12-31"
  scope:
    - On-site break-fix for covered models
    - Advance replacement of failed units
    - Firmware updates only when Aigna asks, to the Aigna standard
  excludes:
    - Damage, moves and changes
    - Anything not on the covered list
  sla:
    - { what: "P1 (room down, meeting today)", target: 4 hours on site }
    - { what: "P2 (room degraded)", target: Next working day }
    - { what: Advance replacement shipped, target: Next working day }
  covers_models: [poly-studio-x32, poly-studio-x52, poly-studio-x72, poly-g62, poly-tc10, logitech-meetup-2, logitech-tap-scheduler]
record: { jobs: 37, on_time: 95, snags_open: 0 }
gets:
  - { when: service, what: "The device's page: model, firmware standard, advisories, configuration and history" }
  - { when: service, what: "The incident, with the evidence Keia Atlas found" }
demo: true
