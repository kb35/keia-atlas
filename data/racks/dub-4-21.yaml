# Rack in the Dublin office's fourth floor comms room (IDF), the UniFi pilot (decision 0028): the two original access switches were
# swapped for UniFi Pro Max 48 PoE on 21 Sept 2026 in the same units with the same patching; `replaced` keeps what was there.
# The floor serves 20 rooms, 68 desks and 8 video rooms, so the room was built out to its own sizing on the same date:
# a 42U rack, five 48-port panels for 199 outlets, five access switches (240 ports, 20 percent headroom) and space to grow.
