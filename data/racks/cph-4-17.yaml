# Rack in the Copenhagen office's comms room (MDF), fourth floor: the whole office, in a 24U small-office rack (the older Cisco and Palo Alto build).
# The floor's 125 outlets need three 48-port panels and four access switches (150 ports with headroom) in a 42U rack. This room holds three access switches (144 ports) in 24U with almost no free unit: short on ports and on space, so the refresh has a reason.
