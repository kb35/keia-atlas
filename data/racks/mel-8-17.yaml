# Rack in the Melbourne office's comms room (MDF), Level 8: the whole office, in the older Cisco and Palo Alto build.
# The 129 outlets need three 48-port panels and four access switches (155 ports with headroom) in a 42U rack, and the room has exactly that: it is sized right, but its core and access switches (2019) reach their years in service in 2026.
# Layout follows a typical 42U office MDF; the equipment is real, the placement is the demo's.
