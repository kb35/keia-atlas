# Demo privacy record: the door controller and CCTV camera at the Dublin office reception. Made up; not legal advice.
# Drafted for the demo on 30 Sept 2026 so the reception's security devices are covered; a person reviews every
# legal field before anything like it is used for real (AGENTS.md, "Checks written for the demo").
name: Reception door access and CCTV, Dublin
covers:
  classes: [security-device]
  sites: [dub]
captures: [video, badge-id]
identifies_people: true
processing:
  where: on-device-and-cloud
  note: The camera records to the security platform; the door controller sends each badge number and door event to the access control platform. Keia Atlas holds neither; it records only that the devices exist and how they are wired.
purpose: Keeping the office entrance secure, and knowing who opened the door when something goes wrong.
law: GDPR (Ireland)
lawful_basis: Legitimate interests (Article 6(1)(f)), balanced in the DPIA
dpia:
  ref: DPIA-AIG-2026-09
  date: "2026-09-15"
notice:
  posted: true
  where: A sign at the entrance, beside the badge reader
  text: CCTV and door access control operate at this entrance for security. Footage is kept for 30 days and door events for 90 days. Questions to privacy@aigna.example.
retention: Camera footage for 30 days, door events for 90 days, then deleted; longer only when an incident needs it.
works_council:
  none: No works council at the Dublin office. The staff forum was told before the devices went in.
approver: Data protection officer, with the facilities and security lead
occupancy:
  counted: false
  per_person_views: false
never:
  - Face recognition
  - Sound recording
  - Pointing the camera at desks or meeting rooms
demo: true
