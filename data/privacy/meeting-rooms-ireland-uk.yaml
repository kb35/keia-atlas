# Demo privacy record: Aigna's meeting-room cameras and microphones in Dublin and London. Made up; not legal advice.
name: Meeting room cameras and microphones, Ireland and UK
covers:
  classes: [video-bar, camera, microphone, codec, desk-video-device]
  sites: [dub, lon]
captures: [video, audio, people-count]
identifies_people: false
processing:
  where: on-device-and-cloud
  note: Picture and sound go only to the call in progress. The video bar works out how many people are in the room and sends that number to the manufacturer's management service, which passes hourly room totals to Keia Atlas.
purpose: Video calls from the room, and room-level counts so that no-show bookings are released and rooms are sized to how they are used.
law: GDPR (Ireland) and UK GDPR
lawful_basis: Legitimate interests (Article 6(1)(f)), balanced in the DPIA
dpia:
  ref: DPIA-AIG-2025-07
  date: "2025-06-12"
  reviewed: "2026-06-10"
notice:
  posted: true
  where: On the booking panel outside each room, and on the room's display between calls
  text: This room has a camera and microphones for video calls. They send picture and sound only while a call is on. The room also counts how many people are in it, as a number; no pictures and no names are kept. Questions to privacy@aigna.example.
retention: Nothing from the room is recorded; a call is recorded only when someone in it starts the meeting service's own recording. People counts are kept as hourly room totals for 13 months, then deleted.
works_council:
  none: No works council at the Dublin or London offices. The staff forum was consulted before the rollout (minutes SF-2025-06).
approver: Data protection officer, with the head of Workplace Technology
occupancy:
  counted: true
  min_group_size: 3
  per_person_views: false
never:
  - Face recognition or speaker identification
  - Emotion, engagement or attention scoring
  - Recording from the room itself
  - Keeping or passing on a live camera feed
demo: true
