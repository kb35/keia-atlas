# Demo privacy record: the door controller and CCTV camera at the New York office reception. Made up; not legal advice.
# Drafted for the demo on 30 Sept 2026 so the reception's security devices are covered; a person reviews every
# legal field before anything like it is used for real (AGENTS.md, "Checks written for the demo").
name: Reception door access and CCTV, New York
covers:
  classes: [security-device]
  sites: [nyc]
captures: [video, badge-id]
identifies_people: true
processing:
  where: on-device-and-cloud
  note: The camera records to the security platform; the door controller sends each badge number and door event to the access control platform. Keia Atlas holds neither; it records only that the devices exist and how they are wired.
purpose: Keeping the office entrance secure, and knowing who opened the door when something goes wrong.
law: "US state notice rules (New York Civil Rights Law 52-c)"
lawful_basis: Written notice to staff under Aigna's workplace monitoring policy, and a sign for visitors.
dpia:
  ref: PIA-AIG-2026-09
  date: "2026-09-15"
notice:
  posted: true
  where: A sign at the entrance, beside the badge reader, and in the monitoring policy every new starter signs
  text: CCTV and door access control operate at this entrance for security. Footage is kept for 30 days and door events for 90 days.
retention: Camera footage for 30 days, door events for 90 days, then deleted; longer only when an incident needs it.
works_council:
  none: No works council or union agreement covers this office.
approver: Chief privacy officer, with the facilities and security lead
occupancy:
  counted: false
  per_person_views: false
never:
  - Face recognition
  - Sound recording
  - Pointing the camera at desks or meeting rooms
demo: true
