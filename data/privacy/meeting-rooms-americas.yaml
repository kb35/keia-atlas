# Demo privacy record: Aigna's meeting-room cameras and microphones in the Americas offices. Made up; not legal advice.
name: Meeting room cameras and microphones, Americas
covers:
  classes: [video-bar, camera, microphone, codec, desk-video-device]
  sites: [nyc, chi, tor, jnu]
captures: [video, audio, people-count]
identifies_people: false
processing:
  where: on-device-and-cloud
  note: Picture and sound go only to the call in progress. The video bar works out how many people are in the room and sends that number to the maker's management service, which passes hourly room totals to Keia Atlas.
purpose: Video calls from the room, and room-level counts so that no-show bookings are released and rooms are sized to how they are used.
law: "US state notice rules (New York Civil Rights Law 52-c at the New York office); Ontario's Employment Standards Act written policy on electronic monitoring (Toronto)"
lawful_basis: Written notice to staff under Aigna's workplace monitoring policy. No biometric data is taken, so Illinois BIPA does not apply in Chicago.
dpia:
  ref: PIA-AIG-2025-11
  date: "2025-10-02"
notice:
  posted: true
  where: On the booking panel outside each room, and in the monitoring policy every new starter signs
  text: This room has a camera and microphones for video calls. They send picture and sound only while a call is on. The room also counts how many people are in it, as a number; no pictures and no names are kept.
retention: Nothing from the room is recorded; a call is recorded only when someone in it starts the meeting service's own recording. People counts are kept as hourly room totals for 13 months, then deleted.
works_council:
  none: No works council or union agreement covers these offices.
approver: Chief privacy officer, with the head of Workplace Technology
occupancy:
  counted: true
  min_group_size: 3
  per_person_views: false
never:
  - Face recognition or speaker identification
  - Emotion, engagement or attention scoring
  - Recording from the room itself
  - Keeping or passing on a live camera feed
demo: true
