# On call in Asia Pacific (schemas/ext/on-call.schema.yaml). Made up for the demo: the rota, the hours and the people.
# Three offices in three time zones: the rota runs on Singapore time, and each office's technician covers its own
# mornings.
region: apac
name: Asia Pacific out of hours
time_zone: Asia/Singapore
covers: [sin, mel, tyo, rap]
out_of_hours: { weekdays_from: "19:00", weekdays_to: "07:00", weekends: true }
handover: { day: mon, at: "08:00" }
escalate_to: yusuf
paging: Paged through the service desk's on-call tool; numbers are kept there, not here.
weeks:
  - { from: "2026-09-21", person: ruby, backup: arjun }
  - { from: "2026-09-28", person: arjun, backup: kenji }
  - { from: "2026-10-05", person: kenji, backup: ruby }
  - { from: "2026-10-12", person: ruby, backup: arjun }
  - { from: "2026-10-19", person: arjun, backup: kenji }
  - { from: "2026-10-26", person: kenji, backup: ruby }
  - { from: "2026-11-02", person: ruby, backup: arjun }
  - { from: "2026-11-09", person: arjun, backup: kenji }
demo: true
