# Poly VideoOS releases for the Studio X and G62 family, from HP/Poly release posts and notes.
# Versions, dates, headlines and known errors are the vendor's. Status and "aigna" notes are Aigna's (demo).
id: poly-videoos
name: Poly VideoOS
vendor: HP Poly
models: [poly-studio-x32, poly-studio-x52, poly-studio-x72, poly-g62]
managed_in: Poly Lens, with automatic updates off; the TC10 is updated with the system it is paired to
releases:
  - version: 5.0.1.470014
    released: "2026-08-28"
    status: blocked
    advisory: ADV-001
    headlines:
      - Android 13 on the systems; the TC10 moves to Android 12
      - Partner apps no longer bundled in the main package
      - Fixes the TC10 reconnecting after a scheduled restart
      - Fixes devices showing offline in Poly Lens
    known_issues:
      - TC10 disconnects
      - Systems failing to wake over HDMI
      - Wi-Fi issues
    aigna: Do not install. Version 5 drops Google Meet and cannot be rolled back to version 4.
    source: poly-videoos-5-0-1-post
  - version: 5.0.0-418922
    released: "2026-05-06"
    status: blocked
    advisory: ADV-001
    headlines:
      - New machine-learning camera framing
      - Better AI noise blocking
      - Lower audio and video latency
      - Needs 4.6.0 first; X30, X50, X70, G7500 and TC8 not supported
    known_issues:
      - X52 with TC10 won't wake with HDMI connected
      - Wi-Fi won't disconnect after losing the network
      - HDMI content blocks automatic entry to Device Mode
    aigna: Do not install. Supports only Microsoft Teams Rooms and Poly Device Mode.
    source: poly-videoos-5-0-0-post
  - version: 4.7.0-466077
    released: "2026-06-18"
    status: lab
    lab: LAB-07
    headlines:
      - The REST API's X-XSRF token requirement can be turned off
      - HP Direct Connect for Teams on the codec
      - Tested against CVE-2025-48543 and CVE-2024-43093
      - Ships Google Meet app 20260222.00.00
    known_issues:
      - External camera reverts to the built-in camera after a reboot on X52 and X32 (PVENG-35985)
      - Wi-Fi with Cisco access points (PVENG-20443)
      - Trio C60 audio clipping (VOICE-77624)
    aigna: The last version 4 release. In the Lab now; it becomes the standard only if the camera issue doesn't affect Aigna rooms.
    source: poly-videoos-4-7-0-post
  - version: 4.6.2.460046
    released: "2026-02"
    status: standard
    headlines:
      - Admin password synced to paired devices, including touch controllers
      - REST API hardening
      - Fixes video freezing on HDMI input (X32, X52, X72)
    known_issues:
      - External camera reverts to the built-in camera after a reboot on X52 and X32
      - Wi-Fi with Cisco access points
    aigna: The Aigna standard since March 2026.
    source: poly-videoos-4-6-2-notes
  - version: 4.6.1.444241
    released: "2025-11"
    status: superseded
    headlines:
      - RS-232 on the G62 through a USB adapter
      - Extron DMP and DTP3 support
      - Camera auto-recovery
    known_issues:
      - E60 or E70 camera reverts to the built-in camera on X52 and X32
    source: poly-videoos-4-6-1-notes
