# Advisory. Vendor facts are cited; the date raised, owner and action are Aigna's (demo).
id: ADV-003
date: "2026-09-28"
level: act
status: open
title: The G62 is not supported for Google Meet
says: Poly's partner mode guide says Google Meet is not supported on the Studio G62 or G7500; the G62 is certified for Microsoft Teams Rooms, Zoom Rooms and Tencent.
action: Large conference rooms use a G62 and Aigna meets on Google Meet. Until the service manager decides, large rooms run the G62 in Poly Video Mode, joining meetings over SIP. Decision needed on the large room type.
