# Advisory. Vendor facts are cited; the date raised, owner and action are Aigna's (demo).
id: ADV-002
date: "2026-06-19"
level: check
status: open
title: External camera can revert to the built-in camera after a reboot
says: On the X52 and X32, an external camera (such as an E60 or E70) can revert to the built-in camera after a reboot. Listed as a known error in 4.6.1, 4.6.2 and 4.7.0.
action: In rooms with an external camera, check the camera source after any reboot or update, and include it in the room's verification.
models: [poly-studio-x52, poly-studio-x32]
sources: [poly-videoos-4-7-0-post, poly-videoos-4-6-1-notes]
