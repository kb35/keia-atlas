# Advisory. Vendor facts are cited; the date raised, owner and action are Aigna's (demo).
id: ADV-001
date: "2026-05-08"
level: do-not-install
status: decided
title: Do not install Poly VideoOS 5 on any Google Meet room
says: VideoOS 5.0 supports only Microsoft Teams Rooms and Poly Device Mode. Google Meet and Poly Video Mode are listed as not supported, and the upgrade to 5 cannot be rolled back to version 4.
action: Keep automatic updates off in Poly Lens and on each device. Stay on the version 4 line (4.6.2 now, 4.7.0 if it passes the Lab). Revisit if Poly adds Google Meet to version 5.
models: [poly-studio-x32, poly-studio-x52, poly-studio-x72, poly-g62]
sources: [poly-videoos-5-0-compatibility, poly-videoos-5-0-0-post]
raised_by: Vendor watcher
owner: sofia
