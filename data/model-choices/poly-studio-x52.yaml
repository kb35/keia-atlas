# Why this model is in the Aigna standard. Vendor facts are cited; decisions and dates are demo.
model: poly-studio-x52
status: standard
since: "2023-04"
decided_by: sofia
review: "2027-03-31"
firmware: poly-videoos
configuration: poly-x-google-meet
why:
  - { point: "Runs Google Meet natively, so rooms join from the room calendar with no laptop.", source: hp-poly-google-platform }
  - { point: "Certified for Microsoft Teams Rooms on Android too, so the same hardware works if a site moves to Teams.", source: ms-teams-android-certified }
  - { point: "One bar holds camera, microphones and speakers: fewer parts to fail in a medium room." }
  - { point: "Managed from Poly Lens alongside the rest of the Poly fleet.", source: poly-lens-quickstart-video }
platforms:
  - { name: Google Meet, support: yes, note: "Named by Poly, HP and Google.", source: poly-partner-mode-ag-4-6-0 }
  - { name: Microsoft Teams Rooms, support: yes, note: "Certified at firmware 5.0.0.418601.", source: ms-teams-android-certified }
  - { name: Poly Video Mode (SIP and H.323), support: yes, note: "Version 4 only; not in version 5.", source: poly-videoos-5-0-compatibility }
