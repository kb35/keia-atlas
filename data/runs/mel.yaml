allowance:
  rack_slack_m: 3
  outlet_slack_m: 0.3
  outlet_cord_m: 5
  notes: "House: a 3 m service loop at the panel and 0.3 m at the outlet are in each length; the channel check adds the recorded patch cord and 5 m for the device cord."
tester: A calibrated Cat6A certification tester (made up); every result is invented for the demo.
