    - title: "ANSI/TIA-568.2-D: 90 m permanent link, 100 m channel (named in the house cabling standard)"
      url: https://tiaonline.org/products-and-services/tia-standards/
    - title: "Category 6 cable (Wikipedia): 90 m of solid horizontal cable plus patch cords, 100 m in all"
      url: https://en.wikipedia.org/wiki/Category_6_cable
allowance:
  rack_slack_m: 3
  outlet_slack_m: 0.3
  outlet_cord_m: 5
  notes: "House: a 3 m service loop at the panel and 0.3 m at the outlet are in each length; the channel check adds the recorded patch cord and 5 m for the device cord."
tester: A calibrated Cat6A certification tester (made up); every result is invented for the demo.
