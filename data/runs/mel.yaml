# Permanent links at the Melbourne office: one run from a comms room patch panel port to every data outlet and access point.
# Made up (rule F9); written by tools/migrations/2026-09-30-office-floors.mjs. The id is the label on the panel end (SITE-ROOM-RACK-UNIT-PORT). A spare run is terminated but not patched.
site: mel
fictional: "Fictional floor plan: room sizes from the room profiles; layout, trays and cable lengths made up for the demo."
limits:
  copper_link_m: 90
  copper_channel_m: 100
