# Alert rule. Made up for the demo (tools/migrations/2026-09-30-alert-rules.mjs).
id: AR-03
name: Meeting room packet loss
source: datadog
applies_to: { classes: [video-bar, codec] }
condition: { signal: packet-loss, above: 2, unit: "%", for_min: 5 }
priority: 3
when: office-hours
route: { role: network, at: region }
silenced_by: { room_checks: true }
owner_role: sm-infra
demo: true
