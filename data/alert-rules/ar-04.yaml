# Alert rule. Made up for the demo (tools/migrations/2026-09-30-alert-rules.mjs).
id: AR-04
name: Access switch uplink down
source: alertmanager
applies_to: { classes: [network-switch], space_types: [mdf, idf] }
condition: { signal: port-down, for_min: 2 }
priority: 2
when: always
route: { role: network, at: region }
quiet_hours: { from: "22:00", to: "07:00" }
silenced_by: { standing_rules: true }
owner_role: sm-infra
demo: true
