# Alert rule. Made up for the demo (tools/migrations/2026-09-30-alert-rules.mjs).
id: AR-07
name: Wi-Fi access point offline
source: alertmanager
applies_to: { classes: [wireless-access-point] }
condition: { signal: offline, for_min: 10 }
priority: 3
when: office-hours
route: { role: network, at: region }
silenced_by: { standing_rules: true }
owner_role: sm-infra
demo: true
