# Alert rule. Made up for the demo (tools/migrations/2026-09-30-alert-rules.mjs).
id: AR-02
name: Touch controllers offline
source: datadog
applies_to: { classes: [touch-controller] }
condition: { signal: offline, for_min: 15 }
priority: 3
when: office-hours
route: { role: tech, at: office }
quiet_hours: { from: "19:00", to: "07:00" }
silenced_by: { room_checks: true, standing_rules: true }
owner_role: sm-av
demo: true
