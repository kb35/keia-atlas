# Alert rule. Made up for the demo (tools/migrations/2026-09-30-alert-rules.mjs).
id: AR-06
name: Comms room too warm
source: librenms
applies_to: { space_types: [mdf, idf] }
condition: { signal: temperature, above: 27, unit: "°C", for_min: 15 }
priority: 2
when: always
route: { role: tech, at: office }
quiet_hours: { from: "22:00", to: "06:00" }
silenced_by: { room_checks: true }
owner_role: sm-infra
demo: true
