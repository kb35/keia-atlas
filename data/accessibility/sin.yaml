# Accessibility in the Singapore office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: sin
checked_by: Facilities, Singapore office, with the local AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-05-26"
rooms:
  sin-12-01:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-04-03", result: meets }
  sin-12-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-05-10", result: meets }
demo: true
