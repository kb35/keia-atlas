# Accessibility in the Chicago office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: chi
checked_by: Facilities, Chicago office, with the local AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-03-30"
rooms:
  chi-12-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-01-05", result: meets }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
  chi-12-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-07-22", result: meets }
  chi-12-05:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-02-12", result: meets }
  chi-12-08:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-11-08", result: meets }
  chi-13-01:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-04-08", result: meets }
  chi-13-07:
    step_free: { value: false, note: "The lounge is two steps down from the corridor. Huddle room 13.05 is step-free." }
demo: true
