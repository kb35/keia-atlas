# Accessibility in the Tokyo office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: tyo
checked_by: Facilities, Tokyo office, with the local AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-04-08"
rooms:
  tyo-15-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-12-23", result: meets }
  tyo-15-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-06-11", result: below-standard, note: "Weak at the far end of the table. A fix is booked; sit near the screen for now." }
demo: true
