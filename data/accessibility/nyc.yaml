# Accessibility in the New York office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: nyc
checked_by: Facilities, New York office, with the local AV technicians
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-07-09"
rooms:
  nyc-20-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-04-21", result: meets }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
  nyc-20-05:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-11-11", result: meets }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
