# Accessibility in the Copenhagen office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: cph
checked_by: Facilities, Copenhagen office, with the London AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-04-21"
rooms:
  cph-4-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-12-19", result: meets }
  cph-4-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-06-09", result: meets }
  cph-4-07:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-02-06", result: meets }
demo: true
