# Accessibility in the Dublin office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: dub
checked_by: Facilities, Dublin office, with the local AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-06-18"
rooms:
  dub-3-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-03-19", result: meets }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
  dub-3-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-10-09", result: meets }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
  dub-3-05:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-04-25", result: meets }
  dub-3-06:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-11-15", result: meets }
  dub-3-09:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-07-12", result: meets }
  dub-4-01:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-01-06", result: meets }
demo: true
