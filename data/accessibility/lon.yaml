# Accessibility in the London office's rooms (schemas/ext/accessibility.schema.yaml). Demo data: made up.
# Rooms of 8 seats and more have a hearing loop, tested once a year to IEC 60118-4.
site: lon
checked_by: Facilities, London office, with the local AV technician
every_room:
  captions: true
  step_free: { value: true }
  checked: "2026-05-12"
rooms:
  lon-2-01:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-06-15", result: meets }
  lon-2-03:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-07-22", result: meets }
demo: true
