    hearing_loop: { standard: IEC 60118-4, tested: "2025-07-22", result: meets, note: "A new test is due; it is booked with the next visit." }
    assistive_listening: { where: "Receivers and neck loops at the reception desk on this floor" }
  mel-8-04:
    hearing_loop: { standard: IEC 60118-4, tested: "2025-11-13", result: meets }
  mel-8-05:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-05-03", result: meets }
  mel-8-08:
    hearing_loop: { standard: IEC 60118-4, tested: "2026-02-27", result: meets }
