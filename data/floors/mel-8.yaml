notes:
  - "A 37 × 24 m floor plate: a row of spaces along each facade, two 1.6 m corridors, and a middle zone with the core (two stairs, 3 lifts, toilets, riser 1). The comms room sits in the core beside the riser."
  - "Spaces are packed wall to wall along the corridors, each with its door on the corridor: small spaces back to back in the middle zone either side of the core; desks, shared spaces and large spaces along the facades."
  - Trays run in the corridor ceiling void at 3.1 m; a basket branches off to each space's data entry (above its door) and to each access point. Tray sizes are chosen for the cables they carry plus a quarter for growth, at a 40 percent fill.
  - "3 data outlets with nothing plugged in are terminated on panel ports without a patch cord (spare): the comms room's recorded patching has fewer live ports than the floor has outlets."
  - The Wi-Fi standard wants an access point in every space of 12 or more seats (8.03 Heron, 8.04 Curlew, 8.05 Gannet); no space type has one yet, so these are gaps.
