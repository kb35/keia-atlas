notes:
  - "A 42.5 × 24 m floor plate: a row of spaces along each facade, two 1.6 m corridors, and a middle zone with the core (two stairs, 3 lifts, toilets, riser 1). The comms room sits in the core beside the riser, one above the other on every floor."
  - "Spaces are packed wall to wall along the corridors, each with its door on the corridor: small spaces back to back in the middle zone either side of the core; desks, shared spaces and large spaces along the facades."
  - Trays run in the corridor ceiling void at 3.1 m; a basket branches off to each space's data entry (above its door) and to each access point. Tray sizes are chosen for the cables they carry plus a quarter for growth, at a 40 percent fill.
  - The town hall area beside the cafeteria is where people gather, so it has U7 Pro Max access points (one per 100 m²); the rest of the open area has U7 Pro (one per 150 m²).
  - "5 data outlets with nothing plugged in are terminated on panel ports without a patch cord (spare): the comms room's recorded patching has fewer live ports than the floor has outlets."
  - The Wi-Fi standard wants an access point in every space of 12 or more seats (20.04 Heron, 20.05 Curlew, 20.06 Gannet, 20.07 Kestrel); no space type has one yet, so these are gaps.
