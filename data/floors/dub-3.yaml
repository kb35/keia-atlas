notes:
  - "A 44 × 24 m floor plate: a row of spaces along each facade, two 1.6 m corridors, and a middle zone with the core (two stairs, three lifts, toilets, riser 1) and small spaces back to back either side of it. The comms room sits in the core beside the riser, one above the other on every floor."
  - Trays run in the corridor ceiling void at 3.1 m; a basket branches off to each space's data entry (above its door) and to each access point. Tray sizes are chosen for the cables they carry plus a quarter for growth, at a 40 percent fill.
  - The town hall area by reception is where people gather, so it has U7 Pro Max access points (one per 100 m²); the rest of the open area has U7 Pro (one per 150 m²).
