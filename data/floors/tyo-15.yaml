notes:
  - A 46 × 25.4 m floor plate with a central core (two stairs, 3 lifts, toilets, riser 1). The comms room sits in the core beside the riser.
  - Small rooms sit back to back in the middle zone either side of the core; desks, shared rooms and large rooms line the facades.
  - Trays run in the corridor ceiling void at 3.1 m; a basket branches off to each room's data entry (above its door) and to each access point. Tray sizes are chosen for the cables they carry plus a quarter for growth, at a 40 percent fill.
  - "5 data outlets with nothing plugged in are terminated on panel ports without a patch cord (spare): the comms room's recorded patching has fewer live ports than the floor has outlets."
  - The Wi-Fi standard wants an access point in every room of 12 or more seats (15.03 Heron, 15.04 Curlew); no room profile has one yet, so these are gaps.
