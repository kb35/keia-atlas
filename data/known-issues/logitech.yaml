# Demo feed: made up for the known errors demo (decision 0029). Logitech and its products are real; these
# issues, references and versions are not Logitech's. Keia Atlas doesn't track Logitech firmware per unit yet,
# so every unit of an affected model counts as possibly exposed.
id: logitech
maker: Logitech
feed: Logitech Sync release notes (demo)
route: Read with the firmware list for the Logitech models, every morning (demo)
checked: "2026-09-28T06:05"
every: Every morning
support: Logitech business support portal, by the service vendor (Keystone Service) for covered models
demo: true
issues:
  - id: DEMO-LOGI-TAP-0142
    ref: DEMO-LOGI-TAP-0142
    title: A scheduler panel keeps showing the old calendar after the room's calendar resource is renamed
    models: [logitech-tap-scheduler]
    affected: [1.12.x, 1.13.x]
    fixed_in: 1.14.0
    status: fixed
    symptom: After someone renames the room in the calendar, the panel by the door still shows the old room's bookings.
    symptoms: [shows_wrong_bookings]
    signs: [renamed, old bookings, yesterday's meetings]
    workaround: { from: maker, text: "Sign the panel out of the calendar and in again with the resource's new address." }
    published: "2026-07-14"
    source: demo-logitech-known-issues
    demo: true
  - id: DEMO-LOGI-MEETUP-0087
    ref: DEMO-LOGI-MEETUP-0087
    title: The MeetUp 2 microphone can mute itself after a laptop sleeps
    models: [logitech-meetup-2]
    affected: [2.4.x]
    status: open
    symptom: After the laptop in a call goes to sleep and wakes, the MeetUp 2 microphone stays muted until it is unplugged.
    symptoms: [far_end_cannot_hear]
    signs: [muted, sleep, meetup]
    workaround: { from: maker, text: "Unplug the MeetUp 2's USB cable from the laptop and plug it in again." }
    published: "2026-09-02"
    source: demo-logitech-known-issues
    demo: true
