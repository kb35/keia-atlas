# Known issues in Poly VideoOS, as HP Poly lists them in its release notes and HP Support Community posts
# (the same sources as data/firmware/poly-videoos.yaml, checked 28 Sept 2026). The references, titles,
# models and versions are Poly's. Where Poly doesn't say which versions are affected, affected_note says how
# Aigna read it. Workarounds marked "aigna" are Aigna's own; Poly didn't publish one.
# The "checked" time is simulated: Keia Atlas reads the feed with the firmware list (stage 2).
id: poly-videoos
maker: HP Poly
vendor: hp-poly
firmware: poly-videoos
feed: Poly VideoOS release notes and the release posts on the HP Support Community
route: Read with the firmware list for the Studio X and G62, every morning; new or changed issues go to the AV service manager
checked: "2026-09-28T06:00"
every: Every morning
follows:
  models: [poly-tc10]
  source: poly-partner-mode-ag-4-6-0
issues:
  - id: POLY-TC10-RESTART
    title: The TC10 doesn't reconnect to its system after a scheduled restart
    models: [poly-tc10]
    affected: [4.6.1.444241, 4.6.2.460046, 4.7.0-466077, 5.0.0-418922]
    affected_note: Poly lists this as fixed in 5.0.1 and doesn't say which earlier versions have it. Aigna reads it as every version before 5.0.1. The TC10 runs the version of the system it is paired to.
    fixed_in: 5.0.1.470014
    status: fixed
    symptom: After the system's scheduled overnight restart, the touch controller on the table says "Not paired" and nothing works until it is paired again.
    symptoms: [controller_shows_not_paired]
    signs: [not paired, restart, touch panel]
    workaround: { from: aigna, text: "Pair the touch controller again from the system's admin page. It holds until the next scheduled restart." }
    advisory: ADV-001
    published: "2026-08-28"
    source: poly-videoos-5-0-1-post
  - id: POLY-LENS-OFFLINE
    title: Systems show as offline in Poly Lens while they work in the room
    models: [poly-studio-x32, poly-studio-x52, poly-studio-x72, poly-g62]
    affected: [4.6.1.444241, 4.6.2.460046, 4.7.0-466077, 5.0.0-418922]
    affected_note: Poly lists this as fixed in 5.0.1 and doesn't say which earlier versions have it. Aigna reads it as every version before 5.0.1.
    fixed_in: 5.0.1.470014
    status: fixed
    symptom: Poly Lens says the system is offline, but calls work and the room looks fine.
    symptoms: []
    signs: [offline in poly lens, shows offline]
    workaround: { from: aigna, text: "Check the system's own status page or make a test call before sending anyone to the room." }
    published: "2026-08-28"
    source: poly-videoos-5-0-1-post
  - id: PVENG-35985
    ref: PVENG-35985
    title: An external camera reverts to the built-in camera after a reboot
    models: [poly-studio-x52, poly-studio-x32]
    affected: [4.6.1.444241, 4.6.2.460046, 4.7.0-466077]
    affected_note: First listed in the 4.6.1 notes (November 2025) and again in 4.6.2 and 4.7.0; the reference is from the 4.7.0 post.
    status: open
    symptom: After the system restarts, the far end sees the view from the video bar's own camera instead of the external camera.
    symptoms: [no_camera_image]
    signs: [camera, built-in camera, wrong camera, wide view]
    needs:
      text: An external camera (E60 or E70) connected to the X52 or X32
      with_models: [poly-e60, poly-e70]
    workaround: { from: aigna, text: "Select the external camera again in the system's camera settings after any restart, and include it in the room's verification (ADV-002)." }
    advisory: ADV-002
    published: "2025-11"
    source: poly-videoos-4-7-0-post
  - id: PVENG-20443
    ref: PVENG-20443
    title: Wi-Fi problems with Cisco access points
    models: [poly-studio-x32, poly-studio-x52, poly-studio-x72, poly-g62]
    affected: [4.6.2.460046, 4.7.0-466077]
    affected_note: Listed in the 4.6.2 notes and again in 4.7.0; the reference is from the 4.7.0 post.
    status: open
    symptom: A system joined to Wi-Fi through Cisco access points has trouble on the wireless network.
    signs: [wi-fi, wifi, wireless]
    needs:
      text: The system joined to Wi-Fi through Cisco access points
      never: "Aigna's systems are cabled: the configuration keeps Wi-Fi off (poly-x-google-meet), so no room meets this."
    published: "2026-02"
    source: poly-videoos-4-6-2-notes
