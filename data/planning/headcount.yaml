# Headcount for capacity planning: the staff each office holds (who the technicians look after), and the
# planned changes to the AV and IT team by financial year. The team as it is today comes from
# src/lib/demo.mjs at build time; this file only says what changes. Made up.
id: headcount
kind: headcount
name: Staff and planned hires
demo: true

# Staff based at each office. Remote staff are the home offices on record (one each), not listed here.
staff: { nyc: 420, dub: 240, lon: 60, chi: 200, tor: 60, sin: 70, mel: 110, tyo: 120, cph: 100, jnu: 25 }

# Planned changes to the team, by the financial year they take effect. `add` may be negative for a leaver
# not replaced. Roles are the ids in src/lib/demo.mjs.
changes:
  - { year: fy2029, role: tech, region: apac, add: 1, status: proposed, why: "A Sydney technician if the Sydney office opens (see the Sydney scenario), proposed for FY2029. Asia Pacific already has one at each of its three offices." }
