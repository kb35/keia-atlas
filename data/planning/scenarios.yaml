# Scenarios: changes to the plan that someone wants to try before adopting. Each is a list of changes; the
# Planning page works out what each does to spend, work and hours in every financial year, against the plan
# as it stands (the baseline). Adopting a scenario is a live-layer event (who, when, undo), never an edit here.
# Made up. Years are financial years (fy2028 is July 2027 to June 2028).
#
# Changes:
#   cut         Spend `percent` less on planned replacements in `year`; the lowest-scored rooms wait a year.
#   new-office  Open an office of `size` (S, M or L, data/planning/ratios.yaml) in `region` in `year`.
#   early       Replace every unit of device class `class` due after `year` in `year` instead.
#   delay       Move the replacements of a class `group` (network, av) `years` later.
id: scenarios
kind: scenarios
name: Scenarios to try against the plan
demo: true
scenarios:
  - id: cut-15
    name: Cut 15% from FY2028
    owner: claire
    say: Less money next year. The lowest-scored rooms wait until FY2029.
    changes:
      - { op: cut, percent: 15, year: fy2028 }
  - id: sydney-office
    name: Open a Sydney office in FY2029
    owner: tomas
    say: A medium office for Asia Pacific, fitted out in FY2029, with the rooms, units and people that come with it.
    changes:
      - { op: new-office, size: M, region: apac, city: Sydney, year: fy2029 }
  - id: video-bars-early
    name: Refresh every video bar in FY2028
    owner: sofia
    say: Swap the whole video bar fleet in one year, so every room runs one model and one firmware.
    changes:
      - { op: early, class: video-bar, year: fy2028 }
  - id: network-later
    name: Delay the network refresh a year
    owner: declan
    say: Switches and gateways due in any year move a year later, to fit the comms room work.
    changes:
      - { op: delay, group: network, years: 1 }
  - id: vancouver-small
    name: Open a small Vancouver office in FY2030
    owner: tomas
    say: A satellite office for the Americas, the size of Juneau.
    changes:
      - { op: new-office, size: S, region: amer, city: Vancouver, year: fy2030 }
