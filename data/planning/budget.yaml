# The money side of planning: the budget envelope for each financial year, the demo exchange rates that
# turn every project's budget into euros, the cost of an engineering hour, and what a unit of each device
# class costs to buy. Made up, round numbers. A financial year runs July to June and is named by the year
# it ends in: FY2027 is July 2026 to June 2027.
id: budget
kind: budget
name: Budget envelopes and unit prices
demo: true
currency: EUR

# Fixed demo rates to euros, not live.
rates: { EUR: 1, USD: 0.92, GBP: 1.17, CAD: 0.68, SGD: 0.69, AUD: 0.61, JPY: 0.0062, DKK: 0.134 }

# What an hour of the team's time costs, for pricing the work plan.
hour_rate: 95

# The project budget for each financial year. Years with no envelope yet show the plan against nothing.
envelopes:
  - { year: fy2027, amount: 1450000, status: set, note: "Approved June 2026." }
  - { year: fy2028, amount: 1350000, status: proposed, note: "To be submitted on 16 November 2026." }

# Euros per unit to buy and fit, by device class. Used where a model has no price of its own.
unit_price:
  display: 2400
  monitor: 320
  video-bar: 3600
  codec: 6500
  touch-controller: 900
  camera: 1200
  microphone: 450
  amplifier: 800
  loudspeaker: 350
  av-extender: 520
  av-switcher: 1400
  signage-player: 700
  scheduler-panel: 600
  network-switch: 4800
  network-gateway: 260
  adapter: 60
  dock: 280
  printer: 3200
  desk-video-device: 2600
  security-device: 900
  wireless-access-point: 420
