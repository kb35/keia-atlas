# Configuration: PA-240Z ceiling speaker amplifier. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: kramer-pa240z
name: PA-240Z ceiling speaker amplifier
models: [kramer-pa-240z]
mode: Hi-Z 100V line, driving a Galil 6-C ceiling speaker pair
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A half-rack amplifier driving Aigna's 70V/100V ceiling speakers. The output-mode DIP-switches are already at Kramer's Hi-Z/100V default, which
  matches the speaker taps; the embedded web UI is used to join the AV VLAN, tighten the default password, and set EQ/levels for the space.
managed_by: Device web interface
steps: [Rack-mount PA-240Z and wire the ceiling speakers to the Hi-Z OUT terminal block., Set DIP-switch 1 to Hi-Z and DIP-switch 2 to 70V or 100V before
    applying power., Set the rear-panel master volume trimmer to a safe starting level., 'Connect Ethernet, browse to the web pages, and change the default
    Admin/Admin login.', 'Set input mixing, EQ and the master volume/balance for the space from the Speaker Output page.', Confirm the space's audio (from
    the Poly Studio X bar or the switcher's audio out) reaches the speakers at the right level., Firmware is applied by uploading a file on the Device Settings
    web page; there is no automatic-update option to turn off.]
groups:
- name: Output mode (DIP-switches)
  where: Rear panel Hi-Z/Lo-Z and 100V/70V DIP-switches
  settings:
  - {name: Hi-Z/Lo-Z (DIP 1), path: Rear panel > Hi-Z/Lo-Z and 100V/70V DIP-switches > DIP 1, value: Hi-Z (default), action: verify, layer: profile, why: 'Aigna''s
      Galil 6-C ceiling speakers are wired to the 70V/100V transformer taps, which needs Hi-Z mode; Lo-Z is only for a direct 4/8 ohm pair.', source: kramer-pa-120z-pa-240z-user-manual-p}
  - {name: 70V/100V (DIP 2), path: Rear panel > Hi-Z/Lo-Z and 100V/70V DIP-switches > DIP 2, value: 100V (default), action: verify, layer: profile, why: 'Matches
      Kramer''s own default and the higher-voltage tap on the Galil 6-C, which keeps run current low over longer ceiling cable runs.', source: kramer-pa-120z-pa-240z-user-manual-p}
- name: Network
  where: Device Settings web page
  settings:
  - {derive: dhcp-reservation, name: DHCP, path: Device Settings > Ethernet Settings, value: 'On, with a reservation on the AV VLAN', layer: naming-network, why: Aigna's AV devices
      sit on a DHCP-reserved address on the AV VLAN rather than a hand-typed static one., action: verify, source: kramer-pa-120z-pa-240z-user-manual-p}
- name: Security
  where: Security > Authentication page
  settings:
  - {name: Activate Security, value: Enabled (default), layer: profile, why: The web pages already prompt for a login out of the box; Aigna keeps it
      on., action: verify, source: kramer-pa-120z-pa-240z-user-manual-p}
  - {derive: vault-site, name: Web pages user name and password, value: 'From the password vault, per site', per_device: true, layer: profile, why: The default Admin/Admin
      login must be changed before the amplifier goes into service., action: change, source: kramer-pa-120z-pa-240z-user-manual-p}
- name: Audio
  where: Speaker Output web page
  settings:
  - {name: High-Pass Filter, value: 'On', layer: profile, why: 'Cuts frequencies below 70Hz that the Galil 6-C isn''t rated to reproduce, which saves amplifier
      headroom for a background-music/voice room.', action: change, source: kramer-pa-120z-pa-240z-user-manual-p}
  - {name: Bass/Mid/Treble EQ, value: 'Flat (0dB), Kramer''s default', layer: profile, why: Left flat until a space's acoustics are measured; Aigna doesn't
      pre-set an EQ curve blind., action: verify, source: kramer-pa-120z-pa-240z-user-manual-p}
  - {derive: on-site, name: Master Volume, value: Set per space during commissioning, per_device: true, layer: room-type, why: 'No factory default level is stated; it''s
      set to a safe, audible level for each space''s speaker count and ceiling height.', action: change, source: kramer-pa-120z-pa-240z-user-manual-p}
- name: Firmware
  where: Device Settings web page
  settings:
  - {name: Firmware update method, value: 'Manual upload only, no automatic-update toggle exists', layer: profile, why: 'There''s nothing to turn off; firmware
      only changes when an installer manually uploads a file, which already matches Aigna''s Lab-first policy.', action: verify, source: kramer-pa-120z-pa-240z-user-manual-p}
gaps: [The rear-panel master volume trimmer's factory position and the web page's Master Volume slider default are not stated., 'Consumption is given only
    as 265VA (apparent power), so it isn''t possible to size a circuit in watts from the manual alone.', 'No current firmware number is published; settings
    were checked against the manual''s own P/N 2900-300802 Rev 6, which is shared with the smaller PA-120Z.']
