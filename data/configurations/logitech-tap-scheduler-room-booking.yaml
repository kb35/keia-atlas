# Configuration: Logitech Tap Scheduler with Google Calendar through Logitech Room Booking.
# Steps and names are the vendor's; values and reasons are Aigna's (demo).
id: logitech-tap-scheduler-room-booking
name: Tap Scheduler with Logitech Room Booking
models: [logitech-tap-scheduler]
mode: Logitech Room Booking
version: "0.2"
owner: sofia
updated: "2026-09-04"
summary: Candidate configuration from LAB-08. There is no native Google Calendar app on the Tap Scheduler, so it books through Logitech Room Booking, connected to Google Calendar in Logitech Sync.
steps:
  - "In Logitech Sync, connect Google Calendar (once per organisation)."
  - Add the space in Sync and assign its calendar.
  - "On the Tap Scheduler, choose Logitech Room Booking and enter the provisioning code from Sync > Meeting Rooms > Inventory."
groups:
  - name: Logitech Sync
    where: Logitech Sync
    settings:
      - { action: change, name: Calendar connection, value: Google Calendar, layer: profile, why: "Aigna's rooms are Google Calendar resources.", source: logitech-room-booking-setup }
      - { derive: calendar, action: change, name: Room calendar, value: "The space's calendar resource", per_device: true, layer: room-type, why: "The panel shows this space's bookings.", source: logitech-room-booking-setup }
  - name: Device
    where: Tap Scheduler setup
    settings:
      - { action: change, name: Booking provider, value: Logitech Room Booking, layer: profile, why: "No native Google Calendar panel app.", source: logitech-tap-scheduler-compat }
      - { derive: on-site, action: change, name: Provisioning code, path: Sync > Meeting Rooms > Inventory, value: "From Sync, per space", per_device: true, layer: profile, why: "Links this panel to its space in Sync.", source: logitech-room-booking-setup }
      - { action: change, name: Power, value: "PoE, 802.3af Class 3", layer: naming-network, why: "One cable to the door; the switch port must supply it.", source: logitech-tap-scheduler-specs }
