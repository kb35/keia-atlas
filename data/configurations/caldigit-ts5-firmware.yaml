# Configuration: TS5 dock firmware. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: caldigit-ts5-firmware
name: TS5 dock firmware
models: [caldigit-ts5]
mode: Hot desk dock
version: '1.0'
owner: sofia
updated: '2026-09-28'
firmware: 64.1 (Thunderbolt controller)
summary: The TS5 has no admin settings of its own; Aigna only checks it's on the current Thunderbolt firmware, applied from the connected Mac with CalDigit's
  own updater, with macOS briefly set to prompt for new accessories.
managed_by: 'None: no settings'
steps: [Connect the dock's Thunderbolt 5 host port to the desk's Mac and confirm it charges the laptop and shows every downstream display and peripheral.,
  'Before updating, set System Settings > Privacy & Security > Accessories to "Ask for new accessories".', Run the CalDigit Thunderbolt Firmware Updater
    and follow its prompts; keep the dock connected for the 8 to 10 minutes it takes., Revert the Accessories setting afterwards.]
groups:
- name: Firmware
  where: CalDigit Thunderbolt Firmware Updater (run from the connected Mac)
  settings:
  - {name: Thunderbolt firmware, value: Current CalDigit-published version for the TS5, action: verify, layer: profile, why: CalDigit ships firmware through
      its own macOS updater rather than a setting on the dock; Aigna checks it's current instead of setting anything on the dock itself., source: caldigit-ts5-firmware-update-procedure}
  - {name: Privacy & Security > Accessories (on the Mac), value: 'Ask for new accessories, only while updating', action: change, layer: profile, why: macOS
      blocks the updater from re-enumerating the dock's Thunderbolt controller unless this is set before running it; Aigna reverts it once the update
      finishes., source: caldigit-ts5-firmware-update-procedure}
gaps: [CalDigit's manual documents the dock's ports and power delivery but no admin or configuration settings beyond firmware; there is nothing else to
    set on the dock itself., 'No automatic-update option exists for the dock; firmware is only ever applied by running the updater by hand, and CalDigit
    doesn''t publish a fixed update cadence.']
