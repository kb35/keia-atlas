# Configuration: USB-PDI-100 power delivery injector. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: sct-usb-pdi-100
name: USB-PDI-100 power delivery injector
models: [sct-usb-pdi-100]
mode: 'Table-side BYOM box: one USB-C cable to the laptop, HDMI/USB out to the space'
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A passive table-side box with no menus, switches or network connection; it just breaks one locking USB-C cable out into HDMI, room USB and up to
  91W of laptop charging.
managed_by: 'None: no settings'
steps: ['Mount or place the unit at the table, within reach of the locking USB-C cable to the laptop.', Connect the included WPS-USBC-100W power supply
    to the rear Power In USB-C port., Connect the rear HDMI Out to the space's switcher/scaler input., 'Connect the rear USB-A port to the space''s USB system
    (camera/soundbar or hub), using the application guide''s recommended cable.', Hand the front locking USB-C cable to the laptop user.]
groups:
- name: Verification
  where: 'N/A: no interface, physical checks only'
  settings:
  - {name: Power supply, value: 'WPS-USBC-100W, output set automatically to the laptop''s negotiated PD level', action: verify, layer: profile, why: Confirms
      the box can deliver its full 91W to the laptop; there's no wattage switch to set., source: sct-usb-pdi-100-power-delivery-injector-data}
  - {name: USB-C cable orientation, value: Locking connector fully seated at both the box and the laptop, action: verify, layer: profile, why: The locking
      USB-C connector is the only thing holding the whole video/USB/power path together; a half-seated plug drops all three at once., source: sct-usb-pdi-100-single-cable-usb-c}
  - {name: HDMI output, value: '4K@60 4:4:4, HDCP 2.3, passed straight from the laptop''s DisplayPort Alt Mode signal', action: verify, layer: profile,
    why: Nothing to configure; confirms the laptop's own output mode reaches the switcher unmodified., source: sct-usb-pdi-100-single-cable-usb-c}
gaps: [The mounting surface for the unit's included mounting ears is not stated., No current firmware or hardware revision is published; this is a passive
    power/signal breakout with no reported version., Two versions of this product exist (60W USB-PDI and 100W USB-PDI-100); this file follows the current
    100W datasheet.]
