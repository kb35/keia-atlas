# Configuration: UltraSharp 27 (U2724D) secondary monitor. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: dell-u2724d-secondary-monitor
name: UltraSharp 27 (U2724D) secondary monitor
models: [dell-u2724d]
mode: Hot desk, secondary (non-hub) monitor
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: The U2724D has no host power delivery or network pass-through to set up; Aigna only sets its input to auto-switch and leaves DDC/CI on so it
  can sit as the second screen off a U2724DE or U3425WE's DisplayPort-out.
managed_by: Monitor OSD
steps: [Feed the monitor from the primary Thunderbolt hub monitor's DisplayPort-out (MST daisy-chain) rather than a direct laptop connection., Open the
    OSD and set Input Source > Auto Select on., Leave DDC/CI on., Run the desk's verification.]
groups:
- name: Input Source
  where: Monitor OSD
  settings:
  - {name: Auto Select, path: Input Source > Auto Select, value: 'On', action: change, layer: profile, why: Picks up the DisplayPort feed from the primary
      monitor's daisy-chain output without a manual input switch., source: dell-ultrasharp-27-monitor-u2724d-user-s}
- name: Others
  where: Monitor OSD
  settings:
  - {name: DDC/CI, path: Others > DDC/CI, value: On (vendor default), action: verify, layer: profile, why: Dell Display Manager needs DDC/CI on to set brightness
      and input remotely; Aigna just confirms it hasn't been turned off., source: dell-ultrasharp-27-monitor-u2724d-user-s}
gaps: ['This monitor has no USB-C video/power or network port to configure, per the device model''s own gap notes; there is nothing else on the OSD that
    Aigna needs to set.', No published current firmware/controller version for this monitor.]
