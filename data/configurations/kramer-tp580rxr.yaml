# Configuration: TP-580Rxr receiver. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: kramer-tp580rxr
name: TP-580Rxr receiver
models: [kramer-tp-580rxr]
mode: Receiver, paired with an Aigna transmitter's HDBT output (e.g. VP-440H2 or a wall-plate transmitter)
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A compact fan-less HDBaseT receiver with a single range/quality slide switch. The manual gives no factory default for that switch, so it's the
  one thing every install must set deliberately.
managed_by: Front-panel DIP switches
steps: [Mount TP-580Rxr at the display end (ceiling void or rack)., Set the NORMAL/XTRA RANGE slide switch to match the cable run before connecting power.,
  Connect the HDBT IN RJ-45 to the transmitting device's HDBT OUT with a single certified HDBaseT cable., Connect HDMI OUT to the display., Power from its
    own 12V adapter; no PoE is documented for this model., Confirm the LINK LED lights and the display syncs at full resolution.]
groups:
- name: Front panel
  where: Rear panel slide switch
  settings:
  - {name: NORMAL/XTRA RANGE Slide Switch, path: Rear panel > NORMAL/XTRA RANGE slide switch, value: NORMAL (up to 100m at 1080p@60Hz 36bpp), action: change,
    layer: room-type, why: 'The manual states no factory default for this switch, so every install must set it deliberately; NORMAL gives full colour depth
      for Aigna''s typical runs, XTRA trades colour depth for 150m reach on a longer run.', source: kramer-tp-580txr-tp-580rxr-user-manual}
  - {name: RS-232 extension, value: Fixed at 115200 baud; not adjustable, action: verify, layer: profile, why: 'Confirms the connected controller or display
      is also set to 115200, since the extender can''t be changed to match a different rate.', source: kramer-tp-580txr-tp-580rxr-user-manual}
gaps: ['No web interface, IP control or DIP-switches are documented for this model, only the one slide switch (plus the paired transmitter''s own PROG/NORMAL
    firmware switch, out of scope here).', 'No factory-default position is stated for the NORMAL/XTRA RANGE switch, so it is marked ''change'' rather than
    ''verify''; every install should set it explicitly and record which position was used.', No current firmware or hardware revision is published.]
