id: apple-studio-display-2026-firmware
name: Studio Display (2026) firmware
models: [apple-studio-display-2026]
mode: Hot desk monitor, macOS managed
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: The Studio Display has no settings of its own; Aigna only checks its firmware is current, which is applied manually from the connected Mac's
  Software Update rather than from anything on the display.
managed_by: 'None: no settings'
steps: [Connect the display's upstream Thunderbolt 5 port to the desk's Mac., 'On the Mac, open System Settings > General > Software Update and check for
    a display firmware update.', 'Click Update Now if one is offered, then Restart when prompted; don''t unplug the display while it updates.', Run the
    desk's verification.]
groups:
- name: Firmware
  where: macOS System Settings (on the connected Mac)
  settings:
  - {name: Studio Display firmware, path: System Settings > General > Software Update, value: Current Apple-published version, action: verify, layer: profile,
    why: 'The display has no settings of its own; its firmware is pushed from the connected Mac''s own Software Update, so Aigna checks it there rather
      than on the display.', source: apple-studio-display-firmware-updates}
gaps: ['Apple documents no admin settings for the display itself, only the Mac-side Software Update flow and the per-user camera/microphone controls in
    Control Center, which aren''t an IT-managed setting.', Apple's support page doesn't state whether Software Update checks for display firmware automatically
    or only when the Mac's own software update check is run; Aigna treats it as manual., 'No power draw is published for the display (also noted on the
    device model), so there''s no consumption figure to verify against.']
