# Configuration: US1GC30B USB-C to Ethernet adapter. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: startech-us1gc30b
name: US1GC30B USB-C to Ethernet adapter
models: [startech-us1gc30b]
mode: Wired network fallback for a BYOM laptop without a built-in Ethernet port
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A small driverless USB-C to Gigabit Ethernet dongle. There is nothing to configure; it's a room spares-kit item, not an installed fixture.
managed_by: 'None: no settings'
steps: ['Keep the adapter in the room''s spares kit (or table drawer), not permanently wired in.', 'Plug the USB-C end into the laptop and the RJ45 end
    into the room''s guest/AV network port, as needed.']
groups:
- name: Verification
  where: 'N/A: no interface, physical checks only'
  settings:
  - {name: Driver requirement, value: 'None; works natively on Windows, macOS and Linux via the Realtek RTL8153 chipset', action: verify, layer: profile,
    why: Confirms it can be handed to a visitor's laptop without installing anything first., source: startech-usb-c-network-adapter-10-100-1000mbps}
  - {name: Power source, value: 'Bus-powered from the laptop''s USB-C port, about 4.5W', action: verify, layer: profile, why: No separate power supply is
      needed or provided., source: startech-us1gc30b-datasheet-startech-com}
gaps: ['No body dimensions are published separately from the attached 30cm cable, so its size isn''t recorded in the device model.', 'A similar part, US1GC30B2,
    uses a different chipset; this file is specifically for US1GC30B.']
