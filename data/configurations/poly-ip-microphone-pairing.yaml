# Configuration: IP ceiling/table microphone, LLN pairing. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: poly-ip-microphone-pairing
name: IP ceiling/table microphone, LLN pairing
models: [poly-ip-ceiling-microphone, poly-tabletop-microphone]
mode: IP microphone, LLN pairing to Poly Studio G62 or Studio X72
version: '1.0'
owner: sofia
updated: '2026-09-28'
firmware: Poly VideoOS 4.6.0 (host)
summary: Both microphones are IP peripherals that pair to the link-local network (LLN) port of a Poly Studio G62 or Studio X72 system; there is no LLN port
  on Studio X32 or Studio X52, so they can't be used with those. Almost everything is configured on the host's web interface, not the microphone itself.
managed_by: Host system's web interface (Poly Studio G62 or Studio X72)
steps: ['Connect the microphone''s RJ-45 to the host''s LLN port, powering it from a PoE injector, or, for more than one IP peripheral on the same LLN port,
    a Netgear ProAV M4250-9G1F-PoE+ (GSM4210PD) switch (the LLN port itself supplies no power).', Leave automatic pairing on; the microphone appears under
    Connected Devices within a few seconds of being plugged in., 'If a Disconnected status shows, or automatic pairing is off, pair it manually: General
    Settings > Device Management > Available Devices, find it by MAC address, select Pair.', Set Stereo Mode and Autorotation in Audio/Video > Audio > Audio
    Input., 'If the room also has the host''s built-in microphones, enable Auto Mic Switching in Audio/Video > Audio > General Audio Settings.', 'Run the
    room''s verification, including a mute and pickup-range test.']
groups:
- name: Pairing
  where: Host system's web interface > General Settings > Device Management
  settings:
  - {name: Enable New Device Auto-Pairing, path: General Settings > Device Management, value: 'On', action: verify, layer: profile, why: 'This is how Poly
      ships it; a microphone just works when it''s plugged into the LLN port, so Aigna leaves it on.', source: poly-partner-mode-ag-4-6-0}
  - {derive: pair, name: Pair, path: General Settings > Device Management > Available Devices, value: The microphone with this room's MAC address, per_device: true, action: verify,
    layer: profile, why: Only needed as a fallback if auto-pairing is off or fails; matches the pattern used to pair a TC10., source: poly-partner-mode-ag-4-6-0}
- name: Audio input
  where: Host system's web interface > Audio/Video > Audio > Audio Input
  settings:
  - {name: Stereo Mode, path: Audio/Video > Audio > Audio Input, value: Left+Right, action: change, layer: profile, why: 'Sends each microphone element
      to its own channel, which is how Poly documents this mode working for table and ceiling microphones; the documented default isn''t stated.', source: poly-partner-mode-ag-4-6-0}
  - {name: Autorotation, path: Audio/Video > Audio > Audio Input, value: 'On', action: change, layer: profile, why: 'The microphone works out left and right
      from the room speakers itself, so it doesn''t matter which way round it''s placed on the table or ceiling. The documented default isn''t stated.',
    source: poly-partner-mode-ag-4-6-0}
- name: Mixing with built-in microphones
  where: Host system's web interface > Audio/Video > Audio > General Audio Settings
  settings:
  - {name: Enable Auto Mic Switching, path: Audio/Video > Audio > General Audio Settings, value: 'On', action: change, layer: model, why: 'On Studio X72,
      switches between the built-in microphone and the IP microphone automatically; on Studio G62 there''s no built-in mic to switch from, so this only
      matters on X72 rooms. The documented default isn''t stated.', source: poly-partner-mode-ag-4-6-0}
gaps: ['No PoE class, standard or power draw is documented for either microphone; the guide only says a PoE injector or the Netgear AV Line switch is needed
    (see the device models).', 'The Audio Input section lists these as supported on Studio G62, Studio X72 and Poly G7500; the consolidated log package
    section lists only Studio G62 and G7500 for these microphones'' own logs, which isn''t reconciled in the guide.', 'Default values for Stereo Mode, Autorotation
    and Enable Auto Mic Switching aren''t stated.', Poly IP microphones and the analog Poly Studio table (expansion) microphone can't be connected to the
    same Studio X72 system at the same time; a room gets one type or the other., 'Neither microphone has its own admin password or firmware update page;
    both take software updates as a paired device of the host, and factory reset is a physical pinhole/magnet procedure, not a web setting.']
