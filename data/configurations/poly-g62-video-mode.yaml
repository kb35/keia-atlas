# Configuration: Poly Studio G62 in Poly Video Mode (interim, see ADV-003). Setting names are the vendor's;
# values and reasons are Aigna's (demo). Anything not listed stays at the vendor default.
id: poly-g62-video-mode
name: G62 in Poly Video Mode (interim)
models: [poly-g62]
mode: Poly Video Mode
version: "0.4"
owner: sofia
updated: "2026-09-28"
summary: Interim, while ADV-003 is decided. The G62 can't run Google Meet, so large rooms join meetings over SIP.
steps:
  - Patch into the space's AV port and power on; the device takes its reserved address.
  - Leave Provider at Poly Video Mode.
  - Set identity, time, network and SIP below.
  - Pair the touch controller.
  - Check the firmware is the standard and automatic updates are off.
  - Run the space's verification, including a test SIP call.
groups:
  - name: Identity
    where: Device web interface
    settings:
      - { action: change, name: Provider, path: General Settings > Provider, value: Poly Video Mode, layer: model, advisory: ADV-003, why: "The G62 doesn't support Google Meet.", source: poly-partner-mode-ag-4-6-0 }
      - { derive: hostname, action: change, name: Device Name, path: General Settings > System Settings > Device Name, value: "The hostname", per_device: true, layer: naming-network, why: "Matches DNS, device management and monitoring.", source: poly-video-mode-ag-4-4-0 }
      - { derive: room-name, action: change, name: Room Name, path: General Settings > System Settings > Room Name, value: "Room number and name", per_device: true, layer: naming-network, why: "Shown to people at the far end.", source: poly-video-mode-ag-4-4-0 }
      - { derive: vault-site, action: change, name: Admin password, path: Security > Local Accounts, param: sec.auth.admin.password, value: "From the password vault, per site", per_device: true, layer: profile, why: "The default is printed on the device.", source: poly-partner-mode-ag-4-6-0 }
  - name: SIP
    where: Device web interface > Call Configuration > SIP
    settings:
      - { action: change, name: Enable SIP, value: "On", layer: model, why: "How the space joins meetings while it can't use Google Meet.", source: poly-video-mode-ag-4-4-0 }
      - { action: change, name: SIP Server Configuration, value: Specify, layer: model, why: "Point at Aigna's SIP service rather than discovering one.", source: poly-video-mode-ag-4-4-0 }
      - { action: change, name: Transport Protocol, value: TLS, layer: model, why: "Encrypts call signalling.", source: poly-video-mode-ag-4-4-0 }
      - { derive: sip-address, action: change, name: Sign-in Address, value: "hostname@sip.aigna.example", per_device: true, layer: naming-network, why: "One address per space, built from the hostname.", source: poly-video-mode-ag-4-4-0 }
      - { action: change, name: Registrar Server, value: sip.aigna.example, layer: naming-network, why: "Aigna's SIP service.", source: poly-video-mode-ag-4-4-0 }
      - { action: change, name: Proxy Server, value: sip.aigna.example, layer: naming-network, why: "The same service handles calls.", source: poly-video-mode-ag-4-4-0 }
      - { derive: vault-room, action: change, name: User Name and Password, value: "From the password vault, per space", per_device: true, layer: naming-network, why: "Each space registers with its own account.", source: poly-video-mode-ag-4-4-0 }
  - name: H.323
    where: Device web interface > Call Configuration > H.323
    settings:
      - { action: change, name: Enable IP H.323, value: "Off", layer: model, why: "SIP only; one call path to support.", source: poly-video-mode-ag-4-4-0 }
  - name: Updates
    where: Device web interface
    settings:
      - { action: change, name: Enable Automatic Updates, path: General Settings > Device Management, value: "Off", layer: profile, advisory: ADV-001, why: "Version 5 drops Poly Video Mode too.", source: poly-partner-mode-ag-4-6-0 }
      - { action: change, name: Maintenance Hours Begin and End, path: General Settings > Device Management, value: "01:00 to 04:00, local time", layer: profile, why: "Any restart happens when no one is in the space.", source: poly-partner-mode-ag-4-6-0 }
