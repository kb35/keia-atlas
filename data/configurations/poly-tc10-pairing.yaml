# Configuration: Poly TC10 paired to a Studio X or G62. Steps and names are the vendor's; the rest is Aigna's (demo).
id: poly-tc10-pairing
name: TC10 paired to its room system
models: [poly-tc10]
mode: Paired
version: "1.1"
owner: sofia
updated: "2026-03-02"
summary: The TC10 takes its settings, password and software from the system it is paired to. There is almost nothing to set on it directly.
steps:
  - Connect the TC10 to a PoE port on the same subnet as the room system.
  - "In the system's web interface, open General Settings > Device Management > Available Devices."
  - Find the TC10 by its MAC address and select Pair.
  - Check it shows the space's calendar.
groups:
  - name: Pairing
    where: Room system's web interface
    settings:
      - { derive: pair, action: change, name: Pair, path: General Settings > Device Management > Available Devices, value: "The TC10 with this space's MAC address", per_device: true, layer: profile, why: "Pairing by MAC stops a controller pairing with the space next door.", source: poly-partner-mode-ag-4-6-0 }
      - { action: change, name: Network, value: "PoE port on the room system's subnet", layer: naming-network, why: "Pairing only works on the same subnet.", source: poly-partner-mode-ag-4-6-0 }
      - { action: change, name: Admin password, value: "Synced from the room system", layer: profile, why: "Since 4.6.2 the system pushes its admin password to paired devices.", source: poly-videoos-4-6-2-notes }
