# Configuration: WP-20CT wall plate. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: kramer-wp20ct
name: WP-20CT wall plate
models: [kramer-wp-20ct]
mode: Wall-plate auto-switching transmitter, room table plate
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A 1-gang in-wall HDMI/USB-C auto-switcher feeding the room's HDBaseT receiver. Aigna fits the optional 20V supply so the plate can also charge
  a laptop over USB-C; RS-232 is fixed and not user-adjustable.
managed_by: Device web interface
steps: ['Mount WP-20CT in the table''s wall box or grommet, 1-gang.', Wire the HDMI IN and USB-C IN faceplate connectors to the table's cable well., 'Connect
    the HDBT OUT RJ-45 to the room''s receiver (e.g. TP-580Rxr, or VP-440H2''s HDBT IN) with a single certified HDBaseT cable.', 'Fit Aigna''s optional
    20V/6A power supply (PS-2006-O) at the rear terminal block for laptop PD charging; the 12V adapter, or PoE from a compatible receiver, is enough for
    video/USB alone.', Browse to the device's embedded web pages via the USB-C IN port to check firmware and settings., 'Confirm both HDMI and USB-C sources
    auto-switch correctly and, once fitted, that a laptop charges over USB-C.']
groups:
- name: Power
  where: Rear panel terminal block
  settings:
  - {name: 12V/20V Power Supply, path: Rear panel > 12V/20V Power Supply 2-pin terminal block, value: Kramer 20V/6A supply (PS-2006-O), action: change,
    layer: room-type, why: 'The base 12V supply only runs video/USB switching; Aigna fits the 20V supply so the plate can also charge a connected laptop
      over USB-C PD, up to 60W.', source: kramer-wp-20ct-quick-start-guide}
- name: RS-232
  where: Rear panel terminal blocks
  settings:
  - {name: CONTROL RS-232 port, value: '115200 baud, 8 data bits, 1 stop bit, no parity, ASCII commands (fixed)', action: verify, layer: profile, why: Confirms
      a room controller talking to the plate itself uses these fixed settings; they can't be changed on the device., source: kramer-wp-20ct-quick-start-guide}
  - {name: EXTD RS-232 port, value: '300-115200 baud, bidirectional extension to the far end (fixed range, auto)', action: verify, layer: profile, why: 'Confirms
      the extended RS-232 line, for example to a display, doesn''t need a rate set on this plate.', source: kramer-wp-20ct-quick-start-guide}
gaps: ['Only the Quick Start Guide could be opened for this model; Kramer''s full WP-20CT user manual (checked at the vendor CDN, at manualslib, and via
    the ''WP Series combined user manuals'' PDF) could not be reached, so the embedded web pages'' menu names, default IP address, admin password and firmware-update
    procedure are not documented here.', No PoE standard (802.3af/at/bt type or class) is stated for the power the plate can accept over the HDBaseT cable
    from a compatible receiver., No DIP-switches are documented on this model; the Quick Start Guide only mentions the terminal blocks and the USB-C-hosted
    web pages.]
