# Configuration: Poly PoE++ 65W 2.5G injector. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: poly-poe-injector
name: Poly PoE++ 65W 2.5G injector
models: [poly-poe-injector]
mode: Midspan PoE injector for a Poly Studio X32 or V12 bar run from one cable
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A single-port mains-powered PoE++ midspan injector with no user settings; there's nothing to configure beyond cabling and mains power.
managed_by: 'None: no settings'
steps: [Mount or rack the injector near the space's network switch., 'Connect the data-in port to the switch (a standard 2.5Gb/s network port, no PoE required
    from the switch).', Connect the data+power-out port to the Poly Studio X32 or V12 using the included 3.66m CAT6A cable., Connect the included power
    cord to mains.]
groups:
- name: Verification
  where: 'N/A: no interface, physical checks only'
  settings:
  - {name: PoE output, value: 'Up to 65W, 802.3af/at/bt compliant per HP/Poly', action: verify, layer: profile, why: 'Confirms the injector can supply what
      a Studio X32 or V12 draws, with no configuration needed to reach that budget.', source: poly-poe-65w-2-5g-adapter-with}
  - {name: Included CAT6A cable, value: '3.66m, used between the injector and the bar', action: verify, layer: profile, why: 'Confirms the 2.5Gb/s link
      and PoE both run over the cable Poly supplies in the box, rather than a substitute patch cable.', source: poly-poe-65w-2-5g-adapter-with}
  - {name: Mains power cord, value: 'The included cord, seated fully at both ends', action: verify, layer: profile, why: The only power path for the unit;
      there's no PoE pass-through or DC input to configure instead., source: poly-poe-65w-2-5g-adapter-hp}
gaps: ['No datasheet or panel drawing was found for this model, so port labels, faces and any status LEDs are undocumented.', 'No source states the mains
    inlet type (detachable IEC cord or captive lead), only that a power cable is boxed separately.']
