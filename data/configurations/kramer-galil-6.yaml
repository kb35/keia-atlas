# Configuration: Galil 6-C ceiling speaker. Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: kramer-galil-6
name: Galil 6-C ceiling speaker
models: [kramer-galil-6]
mode: Hi-Z 100V line, driven by a Kramer PA-240Z
version: '1.0'
owner: sofia
updated: '2026-09-28'
summary: A passive ceiling speaker with a multi-tap 70V/100V transformer (or 8 ohm direct). There's nothing to configure beyond wiring and the physical
  tap selector behind the grille.
managed_by: Rear-panel tap selector (physical, behind the grille)
steps: ['Cut the ceiling opening to the 224mm cutout diameter and fit the speaker, checking clearance for the 196mm mounting depth above the ceiling.',
  'Wire the 4-pin terminal block to the amplifier''s Hi-Z output (pins 1/2 are +, pins 3/4 are -, so a second pair can loop to the next speaker).', Set
    the tap selector behind the grille to match the amplifier's output mode and the space's desired loudness before fitting the grille., Fit the grille and
    confirm audio reaches the speaker at the expected level.]
groups:
- name: Tap selector
  where: Rear panel tap selector (behind the grille)
  settings:
  - {derive: as-written, name: Transformer tap, path: 'Rear tap selector (Figure 7: Adjust Tap Selector)', value: '100V, 15W (paired with a PA-240Z set to Hi-Z/100V)', per_device: true,
    action: change, layer: room-type, why: 'The manual states no factory-default tap position, so it must be set to match the amplifier''s 100V output and
      the wattage the space actually needs; too high a tap wastes amplifier headroom, too low risks clipping.', source: kramer-galil-6-c-spk-c612-user-manual}
gaps: [No factory-default tap position is stated., Which side of the back can the terminal block sits on isn't shown in the manual's drawings., This is
    the closed-back Galil 6-C; the open-back Galil 6-CO sibling is a different size and not covered here.]
