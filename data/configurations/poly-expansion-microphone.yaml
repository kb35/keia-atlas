# Configuration: Studio Expansion Microphone (analog RJ-11). Setting names, menu paths and defaults are the vendor's (cited per setting);
# the values and reasons are Aigna's (demo). Researched from vendor documents, Sept 2026.
id: poly-expansion-microphone
name: Studio Expansion Microphone (analog RJ-11)
models: [poly-expansion-microphone]
mode: Analog table mic, RJ-11 to Poly Studio X52 or X72
version: '1.0'
owner: sofia
updated: '2026-09-28'
firmware: Poly VideoOS 4.6.0 (host); the microphone itself has no separate software version
summary: An analog table microphone that plugs straight into a Studio X52 or Studio X72's RJ-11 expansion microphone port and is powered from the video
  bar over the same cable. It has no IP address, admin page or firmware of its own; the only settings that matter live on the host's web interface, and
  there's almost nothing to configure beyond letting the host know it's there.
managed_by: Host system's web interface (Poly Studio X52 or X72); no separate admin interface on the microphone
steps: [Plug the included 7.6 m RJ-11 cable into the microphone and into the host system's Expansion Microphone port., The host detects it automatically;
    no pairing step is needed., 'In the host''s web interface, enable Auto Mic Switching in Audio/Video > Audio > General Audio Settings.', 'If Polycom
    Acoustic Fence is used in the space, set the fence up around this microphone in Audio/Video > Audio > General Audio Settings.', 'Run the space''s verification,
    including a walk-around pickup test.']
groups:
- name: Audio behaviour
  where: Host system's web interface > Audio/Video > Audio > General Audio Settings
  settings:
  - {name: Enable Auto Mic Switching, path: Audio/Video > Audio > General Audio Settings, value: 'On', action: change, layer: profile, why: 'Automatically
      switches to whichever of the built-in mic or this table mic is picking up the speaker best, which is the point of placing it away from the video bar.
      The documented default isn''t stated.', source: poly-partner-mode-ag-4-6-0}
  - {name: Enable Acoustic Fence, path: Audio/Video > Audio > General Audio Settings, value: Off (site by site), action: verify, layer: room-type, why: 'Only
      needed in open-plan or glass-walled rooms where Aigna wants to fence out sound from outside the table; most rooms leave it off, which is how it
      ships.', source: poly-partner-mode-ag-4-6-0}
gaps: ['No power draw is stated; the microphone is powered entirely by the host over the RJ-11 cable, so there''s no adapter or PoE setting to check.',
  'The vendor''s own compatibility list for this microphone names Studio X50, X52, X70 and the USB variant; Studio X72 is not named directly, though the
    X72 port table lists the same ''Expansion microphone connection''. Studio X32 has no expansion microphone port at all, so this microphone doesn''t work
    with it.', 'On a Studio X72, this microphone and a Poly IP microphone can''t be connected at the same time; a space uses one or the other.', 'No admin
    password, network or firmware settings apply to the microphone itself; it has no web interface, IP address or independent software version.']
