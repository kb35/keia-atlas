# The internet in and out of the New York office: two providers' circuits, from the building entry to the firewalls. Made up;
# written by tools/migrations/2026-09-30-realistic-floors.mjs. The provider's box is the one at U25 in the MDF.
site: nyc
fictional: "Made up for the demo: the providers, the entry and the lead-in lengths are invented."
entry_points:
  - id: nyc-entry-south
    name: Telecoms entry, south duct (ground floor)
    level_m: 0
    at: [ 22.75, 0 ]
    notes: A duct from the street into the ground floor telecoms room, then up riser 1.
  - id: nyc-entry-north
    name: Telecoms entry, north duct (ground floor)
    level_m: 0
    at: [ 22.75, 24 ]
    notes: A second duct from the other street, for a diverse route into the building.
