    circuit_id: C1-NYC-0040917
    sla: { availability: "99.95%", restore: 4 hours, hours: 24/7 }
    support: { desk: Carrier One service desk, account: C1-ACC-40702, hours: 24/7 }
    contract: { start: "2024-07-01", term_months: 36, renews: "2027-06-30" }
