# Device model: Ubiquiti UniFi Enterprise Firewall (EFG)
# Facts from Ubiquiti's public tech specs page (checked 29 Sept 2026), read twice: the spec table, and
# separately the vendor's labelled front, rear and dimension drawings on the same page. Where the two
# differ it is noted. Anything neither states is left out and listed under gaps.

manufacturer: Ubiquiti
model: UniFi Enterprise Firewall (EFG)
part_numbers:
  - number: EFG
class: network-gateway
summary: "A 1U UniFi cloud gateway and firewall for a site: 12.5 Gbps IPS, 5,000+ clients, 500+ UniFi devices,
  two 2.5 GbE RJ45, two 10G SFP+ and two 25G SFP28 ports, two hot-swappable power supplies, and pairs for
  failover (Shadow Mode). Runs the UniFi Network application."
dimensions_mm:
  width: 442.4
  height: 43.7
  depth: 325
  notes: "Spec table: 442.4 x 43.7 x 325 mm. The vendor dimension drawing gives the same."
weight_kg: 6.5
power:
  inputs:
    - type: ac
      port: power-in-1
      volts: 100–240V AC
      supplied: true
      notes: Hot-swappable 150 W CRPS supply 1.
    - type: ac
      port: power-in-2
      volts: 100–240V AC
      supplied: true
      notes: Hot-swappable 150 W CRPS supply 2.
  consumption_w:
    max: 82
  notes: "Universal AC input, 100–240V AC, 7 A max. Heat: 280 BTU/hr."
mounting:
  - rack
sources:
  - source: unifi-efg-tech-specs
    provides: Ports, capacity, power, size and weight (spec table)
  - source: unifi-efg-panel-drawing
    provides: Port numbers, rows and order; touchscreen, reset button, the two power supplies
  - source: unifi-efg-dimension-drawing
    provides: Size, checked against the spec table
ports:
  - id: lan-1
    label: "1"
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 1
    notes: 2.5 GbE RJ45, the default WAN port on RJ45. Top row.
  - id: lan-2
    label: "2"
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 2
    notes: 2.5 GbE RJ45 (2.5G/1G/100M/10M). Bottom row.
  - id: sfp-plus-1
    label: "3"
    connector: sfp-plus
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 3
    notes: 10G SFP+ (10G/1G). Top row.
  - id: sfp-plus-2
    label: "4"
    connector: sfp-plus
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 4
    notes: 10G SFP+ (10G/1G). Bottom row.
  - id: sfp28-1
    label: "5"
    connector: sfp28
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 5
    notes: 25G SFP28 (25G/10G/1G), the default WAN port on fibre. Top row.
  - id: sfp28-2
    label: "6"
    connector: sfp28
    signals:
      - ethernet
    direction: bidirectional
    face: front
    order: 6
    notes: 25G SFP28 (25G/10G/1G). Bottom row.
  - id: power-in-1
    label: PSU 1
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 1
    notes: AC inlet on hot-swappable 150 W CRPS supply 1.
  - id: power-in-2
    label: PSU 2
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 2
    notes: AC inlet on hot-swappable 150 W CRPS supply 2.
gaps:
  - No typical power draw is given, only the maximum.
  - No end-of-sale or end-of-support dates are published.
  - The drawings show no serial console port; the spec table lists management over Ethernet and Bluetooth.
notes:
  - Up to five WAN ports; by default port 1 (2.5 GbE) and port 5 (25G SFP28).
  - Shadow Mode (VRRP) failover between two units; SSL inspection and URL filtering; 10 million concurrent
    sessions.
  - Three fans and two hot-swappable CRPS supplies at the back.
