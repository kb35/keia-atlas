# Device model: Poly IP Ceiling Microphone
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: IP Ceiling Microphone

part_numbers:
  - number: 875S1AA
    notes: HP/Poly product number
  - number: 2215-85360-001
    notes: Underlying Poly part number for the same product, seen alongside 875S1AA on reseller listings

class: microphone

summary: A PoE-powered, ceiling-mounted microphone array for the Poly G7500 codec, made of an overhead
  electronics interface module and a separate ceiling microphone sphere with adjustable drop height, covering
  rooms up to about 1,200 sq ft with three units.

dimensions_mm:
  width: 101.6
  height: 50.8
  depth: 152.4
  notes: 'These are the electronics interface module''s dimensions: vendor gives ''Dimensions (W x D x
    H) 101.6 x 152.4 x 50.8 mm (electronic interface module)''. The separate ceiling microphone sphere
    is documented only as ''53.3 mm'' (diameter), not W/D/H, and is not represented in this width/height/depth
    triple.'

power:
  inputs:
    - type: poe
      poe:
        role: powered
        standard: proprietary
      notes: 'Multiple vendor/reseller sources confirm the unit is PoE-powered with a single network cable
        carrying both power and data (''PoE Powered ... Single network cable provides both power and data''),
        but no source found states the exact IEEE 802.3 standard/class or wattage draw. Connects at: RJ-45
        (via CAT5E/Ethernet Plenum cable).'

mounting:
  - ceiling

security_support:
  firmware_line: Poly microphone firmware
  ends: { date: "2031-06", demo: true }
  vulnerability_contact: { url: "https://enable.hp.com/potentialsecurityvulnerability-report", source: hp-report-vulnerability }
sources:
  - source: poly-ip-ceiling-microphone-array-875s1aa-productsheet
    provides: Dimensions, weight, power and interfaces
  - source: polycom-ip-ceiling-microphone-for-poly-g7500
    provides: Supporting details
  - source: poly-ip-ceiling-microphone-array-875s1aa-reseller
    provides: Supporting details
  - source: poly-ip-ceiling-microphone-array-setup-sheet
    provides: Port labels, faces and panel layout (steps 6 and 13 show the microphone cable leaving the underside of the enclosure)
  - source: poly-video-mode-administrator-guide-4-4
    provides: Port labels and panel layout (Poly IP Ceiling Microphone Ports figure and table)

ports:
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: proprietary
    notes: 'RJ-45 on the electronics interface module/wall plate; connects to the network/G7500 codec.
      Included cabling: a plenum-rated Ethernet cable (up to ~50 ft per reseller listings) plus a 7 ft
      shielded CAT5E cable between the wall plate and the interface module.'
  - id: mic-1
    connector: xlr
    signals:
      - microphone
    direction: in
    face: bottom
    order: 1
    notes: 6-pin mini-XLR connector (proprietary pinout, not standard 3-pin balanced audio XLR) linking
      the electronics interface module to the ceiling microphone sphere; a 6-pin mini-XLR cable is included
      in the box.

gaps:
  - No device weight; only the 300 g package weight is published.
  - No PoE standard, class or power draw stated.
  - 'The RJ-45 port (lan-1) is drawn on a vertical side wall of the electronics enclosure, but the setup sheet and the Video Mode Administrator Guide 4.4 do not name that side (the enclosure has no defined front or rear), so its face and order are not set.'

notes:
  - 'Two parts: an electronics module (the size given) and a microphone sphere (53.3 mm) joined by a 6-pin
    mini-XLR cable.'
  - A reseller marks it end of life; HP publishes no date.
