# Device model: Cisco Desk Pro G2
# Facts from the vendor's public documentation (one reading, spot-checked against the source).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Cisco

model: Desk Pro G2

part_numbers:
  - number: CS-DESKP-C-K9
    notes: Cisco Desk Pro G2, Carbon Black, Upfront GPL (the requested part number). This is the second-generation
      Desk Pro, not the original.
  - number: CS-DESKP-NR-C-K9
    notes: Desk Pro G2, no radio
  - number: CS-DESKP-C-K9++
    notes: Desk Pro G2, TAA (US Government)
  - number: CS-DESKP-NR-C-K9++
    notes: Desk Pro G2, no radio, TAA
  - number: CS-DESKP-C-UK9
    notes: Desk Pro G2, standalone unit
  - number: CS-DESKP-C-K9=
    notes: Desk Pro G2 spare
  - number: CS-DESKPRO-K9
    notes: 'NOT this product: original (first-generation) Webex Desk Pro, listed for comparison only'

class: desk-video-device

summary: 27-inch 4K touchscreen desk video device with dual cameras, mic array and speakers that doubles
  as a USB-C monitor and dock for a laptop; this record is the second generation (G2).

dimensions_mm:
  width: 630
  height: 500
  depth: 82
  notes: 'Without desk stand. Converted from the vendor''s cm values (63 cm, 50 cm, 8.2 cm). With desk
    stand attached the depth is 186 mm (18.6 cm; 7.3 in). Packaged: 776 x 776 x 196 mm, 17.5 kg.'

weight_kg: 11.9

power:
  inputs:
    - type: dc
      port: power-in
      volts: 20 VDC (external supply input 100-240 VAC)
      supplied: true
      notes: 'External power supply included (''Power supply for Cisco Desk Pro and Desk Pro G2''). Consumption:
        Networked standby 15 W typical; deep sleep 1 W typical (''coming soon''). No maximum stated.'
  consumption_w:
    typical: 62

mounting:
  - table
  - wall
  - vesa

sources:
  - source: cisco-desk-pro-g2-data-sheet-cisco
    provides: Dimensions, weight, power and interfaces
  - source: cisco-desk-pro-g2-data-sheet-pdf
    provides: Dimensions, weight, power and interfaces
  - source: cisco-desk-pro-original-data-sheet-for
    provides: Dimensions, weight, power and interfaces
  - source: cisco-cdw-listing-cisco-webex-desk-pro-g2
    provides: Supporting details
  - source: cisco-desk-pro-g2-get-started-webex-help
    provides: Rear and side connector panel drawings, with faces and left-to-right order

ports:
  - id: usb-c-1
    connector: usb-c
    signals:
      - video
      - audio
      - usb
      - power
    direction: bidirectional
    usb_power_w: 80
    face: rear
    order: 8
    notes: 'Main BYOD USB-C to a laptop: DisplayPort Alt Mode video in up to 3840x2160p60 (needs a Gen
      2 cable), touch forwarding, camera/mic/speaker use, dock for peripherals, laptop charging up to
      80 W.'
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 7
    notes: HDMI 2.0 type A input up to 3840x2160p60; HDMI is also listed as an audio input.
  - id: hdmi-out-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 4
    notes: HDMI 2.0 type A output up to 3840x2160p60; marked 'coming soon' (software) in the datasheet.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 6
    notes: 10/100/1000BASE-T via an internal 2-port switch, giving single-LAN connectivity to the Desk
      Pro G2 and a co-located PC. No PoE input stated. Cisco's rear drawing shows two RJ45 sockets side
      by side (item 4 is network forwarding to the laptop, item 5 is the network connection); this port
      is placed at item 5, the network connection, and the second socket is not modelled as its own port.
  - id: usb-c-2
    connector: usb-c
    signals:
      - usb
      - audio
      - power
    direction: bidirectional
    usb_power_w: 15
    face: right
    notes: Side 'application port' (headset, handset, content camera). USB 3.2 Gen 1x1, 15 W charging
      (5 V 3 A). Datasheet says 'side' without left/right; Cisco's setup article puts the side panel
      on the right side of the device. It is stacked above usb-a-1 in one column, so no order is set.
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
      - audio
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: right
    notes: Side application port, USB 2.0, 7.5 W charging. Datasheet says 'side' without left/right; Cisco's
      setup article puts the side panel on the right side of the device. It is stacked below usb-c-2 in
      one column, so no order is set.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
      - audio
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 5
    notes: Rear application port (headset, handset, content camera). USB 3.2 Gen 2x1, 7.5 W charging.
  - id: usb-c-3
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 1
    notes: Rear PC docking port (mouse, keyboard, memory stick). USB 3.2 Gen 2x1, 7.5 W charging.
  - id: usb-a-3
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 2
    notes: Rear PC docking port 1 of 2. USB 3.2 Gen 2x1, 7.5 W charging. Cisco's drawing shows the USB-C
      and the two USB-A ports of this group side by side (USB-C first) under one callout, without saying
      which USB-A is which, so ranks 2 and 3 for the two USB-A ports are a choice.
  - id: usb-a-4
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 3
    notes: Rear PC docking port 2 of 2. USB 3.2 Gen 2x1, 7.5 W charging. Rank 3 is a choice (see usb-a-3).
  - id: micro-usb-1
    connector: micro-usb
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 10
    notes: Service-only Micro-B USB port (item 10, the maintenance port, on the rear panel).
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: rear
    order: 9
    notes: 20 VDC input from the included external power supply. Connector type not stated.

gaps:
  - No maximum power draw; 62 W typical in a call, 15 W standby.
  - The power socket type is not named.
  - Cisco's rear drawing has a second RJ45 socket (Ethernet forwarding to the laptop) and a factory reset
    pinhole that are not modelled as ports here; lan-1 is placed at the network socket.
  - The two side ports (usb-c-2, usb-a-1) are stacked in one column, so they have a face but no order.
  - The two rear USB-A docking ports (usb-a-3, usb-a-4) are not told apart by Cisco, so their ranks (2 and 3)
    are a choice, not a fact.
  - 'Cisco''s setup article says the side panel is on the right side of the device but does not say whether
    that is seen from the front or the back; it is read as seen from the front.'
  - The full PDF installation guide could not be downloaded (Cisco blocked the request and the file is
    very large), so the web version of the setup article was the document used.

notes:
  - Part CS-DESKP-C-K9 is the second-generation Desk Pro G2; the original is CS-DESKPRO-K9.
  - Charges a laptop at up to 80 W over the main USB-C port.
  - The two side USB ports are on the right side of the device, one above the other.
  - An internal 2-port switch shares the one RJ45 with a computer.
