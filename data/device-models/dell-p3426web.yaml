# Device model: Dell Pro P 34 USB-C Hub Conferencing Monitor (P3426WEB)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Dell

model: Pro P 34 USB-C Hub Conferencing Monitor (P3426WEB)

part_numbers:
  - number: P3426WEBt
    notes: regulatory model number, from user's guide cover page (shared manual also covers P2426HEBt/P2726DEBt)

class: monitor

summary: 34.1-inch curved (3800R) WQHD (3440x1440) IPS conferencing monitor with built-in webcam, microphones,
  speakers, Teams button, USB-C upstream (90W PD), USB-A/USB-C/RJ45 hub ports, and a height/tilt/swivel
  stand with VESA mount.

dimensions_mm:
  width: 815.6
  height: 392.8
  depth: 85.9
  notes: 'Body without stand. With stand: height 423.3-573.3 mm (compressed-extended), width 815.6 mm,
    depth 229.4 mm.'

weight_kg: 7.18

power:
  inputs:
    - type: ac
      volts: 100-240 VAC, 50/60 Hz +/-3 Hz
      supplied: true
      notes: 'Detachable IEC-style power cable; exact connector type not stated. Connects at: power connector
        (bottom panel).'
  consumption_w:
    typical: 27.0
    max: 220

client_os:
  - macos
  - windows

mounting:
  - table
  - wall
  - vesa

sources:
  - source: dell-pro-p-24-27-34-usb-2
    provides: Port labels, faces and panel layout
  - source: dell-pro-p-34-usb-c-hub
    provides: Dimensions, weight, power and interfaces
  - source: dell-pro-p-34-usb-c-hub-2
    provides: Port labels, faces and panel layout

ports:
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: bottom
    order: 1
    notes: Detachable AC power cable; connector type not named.
  - id: hdmi-in-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 2
    notes: HDCP 1.4, supports up to WQHD 3440x1440 100Hz TMDS
  - id: displayport-in-1
    label: DisplayPort
    connector: displayport
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 3
    notes: DP 1.4; P3426WEB has no DisplayPort-out (unlike the P2426HEB/P2726DEB variants in the same
      manual)
  - id: usb-c-1
    label: USB-C upstream
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 90
    face: bottom
    order: 4
    notes: USB-C 5Gbps upstream, DP1.4 Alt Mode, max resolution 3440x1440 @ 100Hz, PD 20V/4.5A (90W)/15V/3A/9V/3A/5V/3A
  - id: usb-b-1
    label: USB Type-B upstream
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 5
    notes: Alternative data-only upstream link enabling the downstream USB connectors when USB-C upstream
      is not used
  - id: usb-a-1
    label: USB Type-A 5Gbps downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 6
    notes: One of 2 main downstream USB-A ports on the bottom panel
  - id: usb-a-2
    label: USB Type-A 5Gbps downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 7
    notes: Second of 2 main downstream USB-A ports.
  - id: lan-1
    label: RJ45
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: bottom
    order: 8
    notes: Requires host USB-C/USB-B upstream connection to pass through to Internet
  - id: usb-c-2
    label: USB-C 5Gbps downstream (quick access)
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: front
    order: 1
    notes: Front-panel quick-access port, supports 5V/3A charging
  - id: usb-a-3
    label: USB Type-A 5Gbps downstream (quick access)
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 10
    face: front
    order: 2
    notes: Front-panel quick-access port, BC1.2 5V/1.5A typical (2A max) charging = 10W

gaps:
  - Linux is not listed in Dell's operating system compatibility section.
  - The mains inlet type is not named.

notes:
  - Dell's marketing text calls the camera 5 MP; its spec table says 4 MP.
  - One user guide covers the P2426HEB, P2726DEB and P3426WEB together.
