# Device model: Brightline PX-2000 XGA Projector
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Brightline
model: PX-2000 XGA Projector
class: display
summary: "Demo data, a made-up model standing in for a 2000-era product. Lamp projector for a
  meeting room ceiling or table: VGA and composite inputs, serial control."
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - ceiling
  - table
lifecycle:
  end_of_support: 2010-06-30
security_support:
  firmware_line: Brightline firmware
  ends: { date: "2010-06", demo: true }
  vulnerability_contact: { url: "https://brightline.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: vga-in-1
    label: VGA in
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 1
  - id: video-in-1
    label: Video in (composite)
    connector: proprietary
    signals:
      - video
    direction: in
    face: rear
    order: 2
  - id: audio-in-1
    label: Audio in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 3
  - id: serial-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 4
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 5
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
