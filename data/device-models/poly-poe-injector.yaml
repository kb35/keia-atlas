# Device model: Poly PoE++ 65W 2.5G Adapter
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: PoE++ 65W 2.5G Adapter

part_numbers:
  - number: B5NH6AA
    notes: HP/Poly product number; sold with regional suffixes e.g. B5NH6AA#ABA. Kit includes injector,
      power cord and 3.66 m CAT6A cable. Marketed for Poly Studio X32 and V12 video bars.

class: adapter

summary: A single-port PoE++ midspan injector, mains powered, that adds up to 65 W of PoE to a 2.5 Gb/s
  Ethernet link so a Poly Studio X32 or V12 bar can run from one network cable.

dimensions_mm:
  width: 90
  height: 28.5
  depth: 51
  notes: 'Vendor gives ''Dimensions (W x D x H): 90 x 51 x 28.5 mm''; recorded as width 90, depth 51,
    height 28.5.'

weight_kg: 0.208

power:
  inputs:
    - type: ac
      port: power-in
      volts: 100-240 VAC
      supplied: true
      notes: 50-60 Hz, 2.0 A maximum input current. Power cord included in the box. DC output onto the
        PoE line is 56 Vdc.
  poe_budget_w: 65

sources:
  - source: poly-poe-65w-2-5g-adapter-with
    provides: Specifications
  - source: poly-poe-65w-2-5g-adapter-hp
    provides: Specifications
  - source: poly-poe-65w-2-5g-adapter-b5nh6aa
    provides: Supporting details

ports:
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: in
    notes: Data-in port from the network switch (standard midspan injector arrangement). No source found
      that shows the printed label or confirms this port separately; included because an injector needs
      a data input.
  - id: lan-2
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: out
    poe:
      role: source
      standard: 802.3bt-type3
    notes: Data plus power output to the powered device (e.g. Studio X32) over the included 3.66 m CAT6A
      cable, 2.5 Gb/s. Vendor states compliance with 802.3af/at/bt without naming a type or class; 65
      W exceeds the 802.3bt Type 3 ceiling, so Type 4 is recorded (derived, not quoted).
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    notes: AC mains input. Box lists a separate power cable, implying a detachable cord, but no source
      names the inlet type (IEC C6/C8/C14), so it is recorded as proprietary rather than guessed.

gaps:
  - No datasheet or panel drawing, so labels are unknown.
  - The mains inlet type and mounting are not stated.
  - No power draw or efficiency stated.
  - 'Which side of the device these ports are on, and their left-right order, are not shown by any manufacturer document: lan-1, lan-2, power-in. The HP product pages, the HP datasheet (March 2025), and the Poly Studio X32 and V12 user guides give no panel drawing or photo with labels, so face and order are not set for any port.'

notes:
  - HP states compliance with 802.3af, at and bt and a 65 W rating, not the 802.3bt type. Type 3 is recorded
    because it covers the class 6 a Studio X32 needs.
  - The data-in port is listed because an inline injector must have one; no source lists both ports.
  - A retailer lists a DC input; HP says 100-240 V AC. HP's figure is used.
