# Device model: Poly IP Table Microphone
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: IP Table Microphone

part_numbers:
  - number: 874R3AA
    notes: HP/Poly product number
  - number: 2200-85250-001
    notes: Underlying Poly/Polycom part number for the same product, seen on reseller listings alongside
      874R3AA

class: microphone

summary: An IP-based (PoE, Ethernet-connected) tabletop microphone array for the Poly G7500 codec, up
  to three of which can be daisy-chained/connected to one G7500 system for extended room pickup.

dimensions_mm:
  width: 119.8
  height: 25.4
  depth: 138
  notes: Source gives '4.7 x 5.4 x 1 in / 119.8 x 138 x 25.4 mm (WxDxH)'; recorded as width=119.8, depth=138,
    height=25.4 mm.

weight_kg: 0.2

power:
  inputs:
    - type: poe
      poe:
        role: powered
        standard: 802.3af
        watts: 15.4
      notes: 'Retailer spec table states ''PoE, 802.1af, 15.4W Max'' - ''802.1af'' is treated as a typo
        for IEEE 802.3af (802.1 is a different IEEE working group entirely; 802.3af is the real PoE standard
        at this wattage). Connects at: RJ-45 LAN.'

mounting:
  - table

sources:
  - source: poly-g7500-ip-table-microphone-874r3aa-b
    provides: Supporting details
  - source: poly-g7500-ip-table-microphone-874r3aa-hp
    provides: Specifications
  - source: poly-g7500-ip-table-microphone-array-reseller
    provides: Supporting details
  - source: poly-ip-table-microphone-data-sheet-part
    provides: Dimensions, weight, power and interfaces
  - source: poly-video-mode-administrator-guide-4-4
    provides: Port labels and panel layout (Poly IP Table Microphone Ports figure, bottom view, and table)

ports:
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3af
      watts: 15.4
    notes: Single RJ-45 port carries both IP audio data (to/from the G7500 codec) and PoE power; a 25
      ft (7.6 m) shielded CAT5E cable is included.

gaps:
  - HP's own page for this part shows only packaging data; size, weight and power come from a retailer
    listing.
  - 'The Video Mode Administrator Guide 4.4 figure (bottom view) draws the LLN port (lan-1) on the outer edge of one arm of the Y-shaped body, next to the micro-USB and pinhole reset ports. The guide does not say which side of the microphone that is and the device has no defined front or rear, so the face and order of lan-1 are not set. The datasheet and reseller pages show no port layout.'

notes:
  - Part 874R3AA (also 2200-85250-001) is the Poly IP Table Microphone, a PoE network microphone made
    for Poly's G-series codecs.
  - The retailer lists "802.1af", read here as 802.3af.
