# Device model: Kramer SWT3-31-HU
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: SWT3-31-HU

part_numbers:
  - number: SWT3-31-HU
    notes: Manual P/N 2900-301609 Rev 13. Manual states HW Rev 02 and higher ship with a 20V PSU instead
      of the earlier 12V PSU.

class: av-switcher

summary: A 3x1 4K60 auto-switcher with one USB-C (DP Alt Mode, PD charging) and two HDMI+USB-B host inputs,
  HDMI out plus loop, and USB 3.2 switching of room peripherals to the active host.

dimensions_mm:
  width: 190
  height: 27
  depth: 116
  notes: Manual gives Net Dimensions (W, D, H) 19cm x 11.6cm x 2.7cm; product page gives 19.00cm x 11.60cm
    x 2.70cm. MegaTOOLS enclosure.

weight_kg: 0.56

power:
  inputs:
    - type: dc
      port: power-in
      volts: 20V DC
      watts: 84
      supplied: true
      notes: Included 20V DC 6A adapter; required for USB-C charging of the source. Consumption 4.4A,
        max power 84W.
    - type: dc
      port: power-in
      volts: 12V DC
      watts: 22
      supplied: false
      notes: Optional 12V adapter, purchased separately; powers the unit without USB-C charging. Spec
        table says 12V DC 2A (22W max); panel table says +12V DC 5A.
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: proprietary
        watts: 7.8
      watts: 7.8
      notes: PoE powering via the LAN port; no USB-C charging in this mode. IEEE standard and class not
        stated.
  consumption_w:
    max: 84

mounting:
  - ceiling
  - rack
  - table

sources:
  - source: kramer-swt3-31-hu-3x1-4k60-usb-c
    provides: Specifications
  - source: kramer-swt3-31-hu-user-manual-p-n
    provides: Port labels, faces and panel layout
  - source: kramer-swt3-31-hu-product-page-kramerav
    provides: Specifications

ports:
  - id: usb-a-1
    label: '1'
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: front
    order: 1
    notes: USB DEVICE port 1 for local USB peripherals (e.g. keyboard/mouse, PTZ camera). Device charging
      max total 2A shared across USB device ports.
  - id: usb-c-1
    label: IN 1 USB-C
    connector: usb-c
    signals:
      - video
      - audio
      - usb
      - ethernet
      - power
    direction: bidirectional
    usb_power_w: 60
    face: front
    order: 2
    notes: 'Input 1: DP Alt Mode AV input, USB 3.2 host link to the switched peripherals, LAN access,
      and USB PD 3.0 charging of the source (60W max, only when powered by the 20V supply).'
  - id: hdmi-in-2
    label: IN 2 HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: front
    order: 3
    notes: HDMI source input 2.
  - id: usb-b-2
    label: IN 2 HOST
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: front
    order: 4
    notes: USB 3.2 host connection paired with HDMI input 2 (e.g. room PC). Numbered 2 after the IN 2
      group label on the panel.
  - id: hdmi-in-3
    label: IN 3 HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: front
    order: 5
    notes: HDMI source input 3.
  - id: usb-b-3
    label: IN 3 HOST
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: front
    order: 6
    notes: USB 3.2 host connection paired with HDMI input 3. Numbered 3 after the IN 3 group label on
      the panel.
  - id: hdmi-out-1
    label: HDMI OUT
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 1
    notes: Main HDMI output.
  - id: hdmi-out-2
    label: HDMI LOOP
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 2
    notes: Loop output mirroring the active input, for a local monitor or daisy chain.
  - id: usb-a-2
    label: '2'
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
    notes: USB DEVICE port 2.
  - id: usb-a-3
    label: '3'
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 4
    notes: USB DEVICE port 3.
  - id: usb-a-4
    label: '4'
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 5
    notes: USB DEVICE port 4.
  - id: ir-1
    label: IR OUT
    connector: 3.5mm
    signals:
      - ir
    direction: out
    face: rear
    order: 6
    notes: IR output to an IR emitter, driven by commands from a LAN-connected controller.
  - id: audio-out-1
    label: AUDIO OUT
    connector: terminal-block
    signals:
      - audio
    direction: out
    face: rear
    order: 7
    notes: 5-pin terminal block (L+ L- G R+ R-), balanced stereo line-level de-embedded audio.
  - id: gpio-1
    label: I/O (S1 S2)
    connector: terminal-block
    signals:
      - gpio
    direction: bidirectional
    face: rear
    order: 8
    notes: Two GPIO channels S1 and S2, configurable as digital in, digital out or analog in. Drawing
      shows S1 S2 G Rx Tx as one 5-pin block shared with RS-232.
  - id: rs232-1
    label: RS-232 (G Rx Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 9
    notes: RS-232 to control a device (e.g. PTZ camera) from an IP-connected controller. Pins G Rx Tx;
      see gpio-1 note on shared block.
  - id: lan-1
    label: LAN PoE
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: proprietary
      watts: 7.8
    face: rear
    order: 10
    notes: LAN connection and PoE power input.
  - id: power-in
    label: 12/20V DC
    connector: terminal-block
    signals:
      - power
    direction: in
    face: rear
    order: 11
    notes: DC input for the included 20V 6A supply or optional 12V supply. Drawing shows a 2-pin +/- plug
      connector rather than a barrel jack.

gaps:
  - The PoE input is given only as 7.8 W, with no standard or class.
  - USB-A charging is given only as 2 A shared.

notes:
  - From hardware revision 02 a 20 V 6 A adapter ships instead of 12 V, which allows 60 W USB-C charging.
  - The manual captions both panel drawings "Front Panel"; the second is the rear, per the connection
    instructions.
  - The optional 12 V adapter is rated 2 A in the spec table and 5 A in the panel table.
  - 'Weight: manual 0.56 kg, product page 0.6 kg.'
