# Device model: Kestrel PTZ Camera HD
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Kestrel
model: PTZ Camera HD
class: camera
summary: Demo data, a made-up model standing in for a 2010-era product. Pan-tilt-zoom camera with an
  HDMI output and serial control.
power:
  inputs:
    - type: dc
      port: power-in
      supplied: true
mounting:
  - table
  - wall
  - ceiling
lifecycle:
  end_of_support: 2019-06-30
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: hdmi-out-1
    label: HDMI out
    connector: hdmi
    signals:
      - video
    direction: out
    face: rear
    order: 1
  - id: control-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 2
  - id: power-in
    label: Power (DC)
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 3
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
