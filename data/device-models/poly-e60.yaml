# Device model: Poly Studio E60
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio E60

part_numbers:
  - number: 9W1A6AA
    notes: HP/Poly product number; sold with regional suffixes e.g. 9W1A6AA#AC3 (Americas)

class: camera

summary: A 4K PTZ conference camera with 12x optical zoom and AI-driven presenter/group framing, connecting
  to a host computer via USB-B and powered by an external 12V adapter or PoE+ injector over its RJ-45
  port.

dimensions_mm:
  width: 200
  height: 165
  depth: 150
  notes: 'Vendor gives ''Product Dimensions (metric): 20 x 15 x 16.5 cm'' as W x D x H; converted to width=200,
    depth=150, height=165 mm. Imperial value given separately as 7.87 x 5.9 x 6.49 in (device alone, matches
    metric).'

weight_kg: 1.79

power:
  inputs:
    - type: dc
      volts: 12V
      notes: 'External power adapter input; vendor states ''AC/DC 12 V'' but no adapter wattage/current
        is published. Connects at: AC/DC power jack.'
    - type: poe
      poe:
        role: powered
        standard: 802.3at
      notes: 'Vendor calls this ''Power over Ethernet (PoE+) injector'' and footnotes it as sold separately
        (a PoE+ injector, not PoE from a normal switch, is implied as the intended source). PoE+ maps
        to IEEE 802.3at but no source found states the exact class or draw wattage. Connects at: RJ-45
        (10/100/1000 Mbps) Ethernet.'

mounting:
  - wall
  - ceiling

security_support:
  firmware_line: Poly camera firmware (updated with its system)
  ends: { date: "2031-06", demo: true }
  vulnerability_contact: { url: "https://enable.hp.com/potentialsecurityvulnerability-report", source: hp-report-vulnerability }
sources:
  - source: poly-studio-e60-smart-camera-4k-mptz
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-e60-user-guide
    provides: Port labels, faces and panel layout
  - source: poly-studio-e60-smart-camera-hp-product
    provides: Specifications
  - source: poly-studio-e60-ceiling-mount-hp-product
    provides: Specifications
  - source: poly-studio-e60-smart-camera-4k-mptz-2
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-e60-user-guide-mirror-of
    provides: Port labels, faces and panel layout

ports:
  - id: usb-b-1
    label: USB-B
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 2
    notes: Connects the camera to a host PC/laptop as a USB video/audio device; USB-B to USB-A cable included.
  - id: lan-1
    label: RJ-45
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3at
    face: rear
    order: 1
    notes: 10/100/1000 Mbps Ethernet interface; can receive PoE+ power via a PoE+ injector (sold separately).
  - id: power-in
    label: AC/DC power jack
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 3
    notes: 12V DC input jack for the external power adapter.

gaps:
  - No PoE class or power draw in watts.

notes:
  - The datasheet describes PoE+ power through a separately sold injector.
