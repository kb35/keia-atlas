# Device model: Lumen SP-100 Signage Player
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Lumen
model: SP-100 Signage Player
class: signage-player
summary: Demo data, a made-up model standing in for a 2014-era product. Small signage player with an
  HDMI output and a network port.
power:
  inputs:
    - type: dc
      port: power-in
      supplied: true
mounting:
  - wall
  - vesa
lifecycle:
  end_of_support: 2021-06-30
security_support:
  firmware_line: Lumen firmware
  ends: { date: "2021-06", demo: true }
  vulnerability_contact: { url: "https://lumen.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: hdmi-out-1
    label: HDMI out
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 1
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 2
  - id: usb-a-1
    label: USB
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
  - id: power-in
    label: Power (DC)
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 4
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
