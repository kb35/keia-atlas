# Device model: Logitech Tap Scheduler
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Logitech

model: Tap Scheduler

part_numbers:
  - number: 952-000091
    notes: Graphite color
  - number: 952-000094
    notes: White color

class: scheduler-panel

summary: A 10.1-inch PoE-powered touchscreen panel mounted outside meeting rooms to show availability
  and let workers reserve rooms.

dimensions_mm:
  width: 246.2
  height: 165
  depth: 28.5
  notes: Device-only figure. With the included surface mount attached, depth becomes 31.4mm (165 x 246.2
    x 31.4mm); with the mullion mount, depth becomes 44.5mm and width 292.6mm (165 x 292.6 x 44.5mm).
    Vendor gives H x W x D; reordered to width/height/depth here (width is the long side, matching vendor
    order already).

weight_kg: 0.7

power:
  inputs:
    - type: poe
      poe:
        role: powered
        standard: 802.3af
        class: 3
      supplied: false
      notes: 'Requires a PoE-enabled network switch or a separate PoE injector; neither the injector nor
        an Ethernet cable is included in the box. Connects at: RJ45 Ethernet.'

mounting:
  - wall
  - vesa

security_support:
  firmware_line: Logitech CollabOS
  ends: { date: "2027-06", demo: true }
  vulnerability_contact: { url: "https://www.logitech.com/en-us/legal/vulnerability-reporting", source: logitech-vulnerability-reporting }
sources:
  - source: logitech-tap-scheduler-datasheet
    provides: Dimensions, weight, power and interfaces
  - source: logitech-specifications-tap-scheduler-logitech-hub
    provides: Specifications
  - source: logitech-tap-scheduler-quick-start-guide
    provides: Mounting drawings (checked for the network port's face; the drawings do not show it)

ports:
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3af
      class: 3
    order: 1
    notes: 10/100 Mbps Ethernet; also the device's sole physical power input via PoE.

gaps:
  - No power draw in watts, only PoE class 3.
  - 'Which side of the device the network port is on is not shown: Logitech''s quick start guide (pages
    7, 9 and 11) draws the Ethernet cable plugging into the mount plate, and the datasheet gives only
    the cable exits (horizontal, vertical or center), so lan-1 has no face. It is the only port, so the
    order of 1 stays.'

notes:
  - Comes with glass, drywall and mullion mounts; also has a 100 x 100 mm VESA pattern.
  - Has a Bluetooth radio that is inactive, reserved for future use.
