# Device model: Poly Studio Expansion Microphone
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio Expansion Microphone

part_numbers:
  - number: 875M6AA
    notes: Current HP/Poly product number for the Studio X50/X52/X70/USB expansion/table microphone
  - number: 2200-69631-001
    notes: Legacy Poly part number for the same physical product, marketed as 'Poly Studio Expansion Microphone';
      identical dimensions/weight/RJ-11 spec confirmed across both listings

class: microphone

summary: A tabletop expansion microphone with three cardioid elements that plugs into a Poly Studio X50/X52/X70/USB
  video bar over a single analog RJ-11 cable to extend room audio pickup.

dimensions_mm:
  width: 143.05
  height: 26.59
  depth: 124.13
  notes: Vendor gives 'Dimensions (W x D x H) 143.05 x 124.13 x 26.59 mm' on one datasheet and '143.05
    x 26.59 x 124.13 mm (WxHxL)' on another (same numbers, different column order); recorded here as width=143.05,
    height=26.59 (the thin dimension), depth=124.13.

weight_kg: 0.08

power:
  inputs:
    - type: from-host
      notes: 'Powered by the host Poly Studio X50/X52/X70/USB bar over the same RJ-11 cable that carries
        audio; no separate power adapter or voltage/current spec is published for the microphone itself.
        Connects at: RJ-11.'

mounting:
  - table

sources:
  - source: poly-studio-x50-x52-x70-usb-table
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-expansion-microphone-data-sheet-2200
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-expansion-microphone-setup-sheet
    provides: Product drawing showing the RJ-11 cable plugged in at the notch between two arms

ports:
  - id: mic-1
    connector: rj11
    signals:
      - microphone
      - power
    direction: out
    notes: Physically an RJ-11 (6P4C) jack, not a telephone line - it carries the microphone's analog
      audio to the host bar and receives power from the host over the same cable. A 7.6 m/25 ft RJ-11
      cable is included. Connector enum has no RJ-11 option, recorded as 'proprietary'.

gaps:
  - No power draw stated; it is powered by the video bar over its cable.
  - 'The setup sheet (1725-69631-003A) draws the RJ-11 cable plugging in at the notch between two arms of the Y-shaped body, and the datasheet shows no port layout. Neither names a face, and the device has no defined front or rear, so the face and order of mic-1 are not set.'

notes:
  - Also sold under the older part number 2200-69631-001, which appears to be the same microphone.
  - Connects with an RJ-11 cable (7.6 m included) to the video bar's expansion microphone port.
