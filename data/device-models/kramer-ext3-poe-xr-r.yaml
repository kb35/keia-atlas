# Device model: Kramer EXT3-POE-XR-R
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: EXT3-POE-XR-R

class: av-extender

summary: A 4K60 4:4:4 HDBaseT 3.0 extended-reach receiver that recovers HDMI video, USB 2.0, Ethernet,
  RS-232 and IR from a paired transmitter (e.g. EXT3-C-XR-T) over a single HDBaseT cable, and can supply
  bidirectional PoE to power that transmitter.

dimensions_mm:
  width: 190
  height: 27
  depth: 113
  notes: Manual's Technical Specifications table gives (W,D,H) 19cm x 11.3cm x 2.7cm; the kramerav.com
    product page separately lists 19.00cm x 11.60cm x 2.70cm for the same axes (11.6 vs 11.3cm depth)
    - used the manual figure as primary.

weight_kg: 0.55

power:
  inputs:
    - type: dc
      port: power-in
      volts: 48V DC
      watts: 53
      supplied: true
      notes: Included external power adapter; source 48V DC 1.36A, unit consumption 48V DC 1.2A, 53W max.
  consumption_w:
    max: 53

mounting:
  - ceiling
  - rack

sources:
  - source: kramer-ext3-poe-xr-r-4k60-4-4
    provides: Specifications
  - source: kramer-ext3-c-xr-t-ext3-poe-xr
    provides: Port labels, faces and panel layout

ports:
  - id: usb-b-1
    label: HOST USB B 2.0
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: front
    order: 1
    notes: When the DIP-switch is set to active host, connects a USB host (e.g. room PC) to communicate
      with USB peripherals on this device or the connected transmitter. Only one side (transmitter or
      receiver) can be the active host at a time.
  - id: hdbaset-1
    label: HDBT IN PoE◄►
    connector: rj45
    signals:
      - video
      - usb
      - ethernet
      - rs232
      - ir
      - hdbaset
      - poe
    direction: in
    poe:
      role: source
      standard: hdbaset-poh
      watts: 19.7
    face: rear
    order: 1
    notes: Connects to the HDBT OUT connector on a paired PoE-accepting transmitter (e.g. EXT3-C-XR-T).
      Bidirectional PoE auto-senses the line and either supplies power to the transmitter or accepts power
      from it/an injector; the 19.7W figure is inferred from the transmitter's matching max PoE-consumption
      spec, since no separate receiver-side PoE-budget figure is published.
  - id: hdmi-out-1
    label: HDMI OUT
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 2
    notes: Connect to an HDMI acceptor (e.g. display).
  - id: usb-a-1
    label: USB DEVICE 1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
    notes: USB signal/charging inactive on this port when no USB host PC is connected. Shares a 2A total
      USB device-charging current budget with usb-a-2 and usb-a-3.
  - id: usb-a-2
    label: USB DEVICE 2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 4
    notes: Charging power stays active even when the USB host PC is disconnected. Shares a 2A total USB
      device-charging current budget with usb-a-1 and usb-a-3.
  - id: usb-a-3
    label: USB DEVICE 3
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 5
    notes: Charging power stays active even when the USB host PC is disconnected. Shares a 2A total USB
      device-charging current budget with usb-a-1 and usb-a-2.
  - id: ir-1
    label: IR
    connector: 3.5mm
    signals:
      - ir
    direction: bidirectional
    face: rear
    order: 6
    notes: Bidirectional IR link extension.
  - id: rs232-1
    label: RS-232
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 7
    notes: 3-pin (G, Rx, Tx) bidirectional RS-232 link extension.
  - id: lan-1
    label: 1G LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 8
    notes: Gigabit LAN connection, Ethernet extension to the transmitter side.
  - id: power-in
    label: 48V DC
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 9
    notes: Locking 2-pin DC power connector (not a plain round barrel jack); +48V DC, for powering the
      unit and providing PoE to the transmitter.

gaps:
  - No hardware revision is published.
  - No PoE budget is published for the power it sends to the transmitter.
  - USB-A charging is given only as 2 A shared between the three ports.

notes:
  - Powers the EXT3-C-XR-T over the HDBaseT cable; the transmitter draws up to 19.7 W that way. Kramer
    calls the port "bidirectional PoE".
  - Size and weight from the manual; the product page says 116 mm deep and 0.6 kg.
