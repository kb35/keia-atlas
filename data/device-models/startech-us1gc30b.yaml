# Device model: StarTech.com USB-C to Gigabit Ethernet Adapter (US1GC30B)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: StarTech.com

model: USB-C to Gigabit Ethernet Adapter (US1GC30B)

part_numbers:
  - number: US1GC30B
    notes: Product ID on StarTech's own datasheet/product page
  - number: UPC 065030862639
    notes: UPC from datasheet 'General' table

class: adapter

summary: Small USB-C to RJ45 Gigabit Ethernet dongle with an attached 30cm cable, USB-bus powered, using
  a Realtek RTL8153 chipset, compatible with Windows, macOS, Linux, ChromeOS, Android and iOS.

weight_kg: 0.025

power:
  inputs:
    - type: from-host
      port: usb-c-1
      notes: Bus powered from the laptop.
  consumption_w:
    max: 4.5

client_os:
  - linux
  - macos
  - windows

sources:
  - source: startech-usb-c-network-adapter-10-100-1000mbps
    provides: Specifications
  - source: startech-us1gc30b-datasheet-startech-com
    provides: Dimensions, weight, power and interfaces
  - source: startech-usb-c-to-gigabit-ethernet-adapter-black
    provides: Specifications

ports:
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    notes: Host connection port (USB 3.2 Gen 1, 5Gbps); this is the port the device is powered through
      (see power.inputs), not a port that delivers power to another device.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    notes: RJ45 Gigabit Ethernet port (10/100/1000 Mbps), on the end of the attached 30cm cable rather
      than the dongle body.

gaps:
  - 'No body size: the 23.5 cm length StarTech gives includes the attached cable.'
  - 'No face or order is set for usb-c-1 and lan-1: this is a small dongle with an attached cable, with the
    RJ45 socket at one end of the body and the USB-C plug on the end of the cable. StarTech''s datasheet
    photo shows this, but the ends cannot be called front or rear, so no face is given.'

notes:
  - StarTech lists macOS, Windows and Linux (plus ChromeOS).
  - Bus powered from the laptop; draws about 4.5 W.
  - A similar part, US1GC30B2, uses a different chipset; this is US1GC30B.
