# Device model: Poly Studio G62
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio G62

part_numbers:
  - number: 99T09AA
    notes: Poly Studio G62 Video Conferencing System (codec only; cameras/mics sold separately). Region
      suffix variants exist. RMN PBJ-STG-62R / PBJ-STG-62N (no-radio)

class: codec

summary: Compact PoE+-powered Android-based video conferencing codec with two HDMI outputs, an HDMI input,
  USB-C (DP Alt Mode) and USB-A ports, 3.5 mm audio in/out, and separate LAN and LLN Ethernet ports for
  Poly IP peripherals.

dimensions_mm:
  width: 247.7
  height: 34.9
  depth: 152.4
  notes: Source gives '(W x D x H) 247.7 x 152.4 x 34.9 mm' (also 9.75 x 6 x 1.38 in), labelled 'Minimum
    dimensions'; re-ordered to W x H x D. Body without optional plate mount.

weight_kg: 0.798

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3at
        class: 4
      volts: 50-57 V
      watts: 30
      supplied: false
      notes: Only power input; no DC jack and no power button. PoE injector not in box (optional Poly
        Studio G62 PoE+ Adapter and Cable Kit A02F9AA). Spec sheet also lists 45 W (class 5) and 60 W
        (class 6) and says compatible with IEEE 802.3at/bt class 4, 5, 6; PoE+ switch must be configured
        to 30 W or more.

mounting:
  - display-mount
  - under-table
  - rack

security_support:
  firmware_line: poly-videoos
  ends: { date: "2032-12", demo: true }
  vulnerability_contact: { url: "https://enable.hp.com/potentialsecurityvulnerability-report", source: hp-report-vulnerability }
sources:
  - source: poly-studio-g62-video-conferencing-system-99t09aa
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-g62-user-guide
    provides: Port labels, faces and panel layout
  - source: poly-studio-g62-video-conferencing-system-datasheet
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-g62-video-conferencing-system-99t09aa-2
    provides: Specifications
  - source: poly-video-mode-administrator-guide-4-4
    provides: Port labels, faces and panel layout

ports:
  - id: audio-out-1
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 1
    notes: 3.5 mm line out; panel shows an output-arrow icon, no text.
  - id: audio-in-1
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 2
    notes: '3.5 mm line in (datasheet: ''1 line in''); user guide says it connects microphones.'
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
    notes: Upper of two vertically stacked USB-A (3.0, 5Gbps) ports; for USB cameras or USB audio DSPs.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 4
    notes: Lower of the two stacked USB-A ports (same horizontal position as usb-a-1).
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 5
    notes: HDMI 2.0 input for content source, HDMI camera, or Device Mode. Audio support assumed from
      content/Device Mode use; datasheet only says 'HDMI-in 2.0'.
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
      - video
    direction: bidirectional
    face: rear
    order: 6
    notes: 5Gbps USB-C for Device Mode, with DisplayPort Alt Mode for video input from a laptop.
  - id: hdmi-out-2
    label: '2'
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 7
    notes: HDMI 2.0 out, secondary monitor; printed monitor icon with '2'.
  - id: hdmi-out-1
    label: '1'
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 8
    notes: HDMI 2.0 out, primary monitor; printed monitor icon with '1'.
  - id: lan-2
    label: LLN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 9
    notes: Link-local network port for Poly IP microphones/cameras. Does not provide PoE; a PoE switch
      or injector is needed for peripherals.
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3at
      class: 4
      watts: 30
    face: rear
    order: 10
    notes: Corporate network (100M/1G/2.5G) and the system's only power input. Printed 'POE+' above and
      'LAN' below.

gaps:
  - No power draw in watts, only the PoE class needed.
  - The mounting plate guide was not reviewed.

notes:
  - Needs PoE+ class 4 (30 W) at minimum; the spec sheet also lists class 5 and 6 as supported.
  - The left RJ45 is labelled LLN, for Poly IP accessories, and gives no PoE.
  - The ports are on one panel, taken as the rear; the guide does not name the face.
  - The two USB-A ports are stacked; order 3 is the top one.
