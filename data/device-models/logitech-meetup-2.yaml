# Device model: Logitech MeetUp 2
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Logitech

model: MeetUp 2

part_numbers:
  - number: 960-001680
    notes: Asia-Pacific
  - number: 960-001681
    notes: Europe, Middle East, Africa, Southeast Asia
  - number: 960-001691
    notes: USA, Canada
  - number: 960-001693
    notes: Argentina, Brazil, Chile, Paraguay, Uruguay
  - number: 960-001690
    notes: All other Latin American countries
  - number: 960-001682
    notes: China
  - number: 960-001683
    notes: Japan
  - number: 960-001711
    notes: India

class: video-bar

summary: All-in-one USB video bar for small rooms with a 4K camera, six-mic array and speaker, used with
  a room PC or a laptop (BYOD), with HDMI in/out and Ethernet.

dimensions_mm:
  width: 469.2
  height: 73.3
  depth: 73
  notes: Device body. External power supply is 114 x 47 x 32.3 mm with a 3 m DC cable. Multi-mount included;
    mounted dimensions not given.

weight_kg: 1.8

power:
  inputs:
    - type: dc
      volts: 19V DC (supply input 100-240V)
      supplied: true
      notes: 'Auto-sensing external power supply, 19V 2.1A output (about 40 W supply rating, not a consumption
        figure), 3 m DC cable. The wiring diagram labels the jack ''PWR''. Connects at: power-in (PWR).'

mounting:
  - wall

security_support:
  firmware_line: Logitech CollabOS
  ends: { date: "2029-06", demo: true }
  vulnerability_contact: { url: "https://www.logitech.com/en-us/legal/vulnerability-reporting", source: logitech-vulnerability-reporting }
sources:
  - source: logitech-meetup-2-datasheet-april-2024
    provides: Dimensions, weight, power and interfaces
  - source: logitech-meetup-2-specifications-logitech-hub
    provides: Specifications
  - source: logitech-vc-wiring-diagrams-meetup-2-p
    provides: Port labels, faces and panel layout
  - source: logitech-meetup-2-active-usb-cable-quick-setup-guide
    provides: Statement that the connection ports are behind the back panel (rear face)

ports:
  - id: hdmi-in-1
    label: HDMI IN
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    notes: Used for laptop content in BYOD HDMI + USB configuration.
  - id: hdmi-out-1
    label: HDMI TV
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    notes: Output to the room display. Label 'HDMI TV' from the Logitech wiring diagrams.
  - id: usb-c-1
    label: USB-C
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    notes: USB 3.1 Type-C to the room PC or laptop. Wiring diagrams show a BYOD mode with DP Alt Mode
      over this port (requires a DP Alt Mode cable), so video is listed. No charging wattage stated.
  - id: lan-1
    label: Ethernet
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    notes: 10/100/1G Ethernet for management (Logitech Sync). No PoE.
  - id: power-in
    label: PWR
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    notes: 'DC input from the external 19V supply. Connector type inferred as barrel; the datasheet only
      says ''DC Cable: 3 m''.'

gaps:
  - The order of the ports along the rear face is not settled. Logitech's wiring diagrams (pages 92 to 94)
    draw the five ports in one column inside the cable compartment, labelled from top to bottom PWR, USB-C,
    HDMI TV, HDMI IN, Ethernet, but the drawing does not show which way that column runs on the back of
    the bar, and no other Logitech document places the ports left to right, so no order is set for
    hdmi-in-1, hdmi-out-1, usb-c-1, lan-1 and power-in.
  - No power draw stated.
  - The DC socket type is not named.

notes:
  - Comes with a multi-function mount and wall fixings; the positions it supports are not listed.
  - Logitech's wiring diagrams show laptop video over USB-C (DisplayPort Alt Mode).
