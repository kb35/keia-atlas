# Device model: Dell UltraSharp 27 Monitor (U2724D)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Dell

model: UltraSharp 27 Monitor (U2724D)

part_numbers:
  - number: U2724Db / U2724Dt
    notes: regulatory model numbers, from user's guide cover page

class: monitor

summary: 27-inch QHD (2560x1440) IPS Black monitor with DP/HDMI video, a data-only USB-C upstream port
  (no host video/power over USB-C), USB-A hub ports, and a height/tilt/swivel/pivot stand with VESA mount.

dimensions_mm:
  width: 612.2
  height: 352.5
  depth: 50.1
  notes: 'Body without stand. With stand: height 385.6-535.6 mm (compressed-extended), width 612.2 mm,
    depth 192.3 mm.'

weight_kg: 4.49

power:
  inputs:
    - type: ac
      volts: 100-240 VAC, 50/60 Hz +/-3 Hz
      supplied: true
      notes: 'Detachable IEC-style power cable; exact connector type not stated. User''s guide electrical-spec
        table states 1.6 A as ''maximum''; Connects at: power connector (bottom panel).'
  consumption_w:
    typical: 23.9
    max: 85

mounting:
  - table
  - wall
  - vesa

sources:
  - source: dell-ultrasharp-27-monitor-u2724d-user-s
    provides: Port labels, faces and panel layout
  - source: dell-ultrasharp-27-monitor-u2724d-datasheet
    provides: Dimensions, weight, power and interfaces
  - source: dell-ultrasharp-27-monitor-u2724d-user-s-2
    provides: Port labels, faces and panel layout

ports:
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: bottom
    order: 1
    notes: Detachable AC power cable; connector type not named in source.
  - id: hdmi-in-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 2
    notes: HDCP 1.4, up to QHD 2560x1440 120Hz TMDS
  - id: displayport-in-1
    label: DisplayPort (in)
    connector: displayport
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 3
    notes: DP 1.4
  - id: displayport-out-1
    label: DisplayPort (out)
    connector: displayport
    signals:
      - video
      - audio
    direction: out
    face: bottom
    order: 4
    notes: DP output for MST daisy-chain
  - id: usb-c-1
    label: USB-C upstream
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 5
    notes: Data only (USB 3.2 Gen2, 10Gbps); explicitly does not carry video input, no power delivery
      to host.
  - id: usb-a-1
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 6
    notes: One of 3 SuperSpeed USB 10Gbps (USB 3.2 Gen2) downstream ports (positions 7,9,10 in source
      diagram); one of the three carries BC1.2 charging (marked with battery icon, exact position not
      distinguished).
  - id: audio-out-1
    label: Audio line-out
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: bottom
    order: 7
    notes: Two-channel only, does not support headphones. Jack size (3.5mm) inferred.
  - id: usb-a-2
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 8
    notes: See usb-a-1 note.
  - id: usb-a-3
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 9
    notes: See usb-a-1 note.
  - id: usb-c-2
    label: USB-C downstream
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 10
    notes: Quick-access downstream port, 5V/3A charging

gaps:
  - Dell's user guide has no operating system compatibility section for this model.
  - The mains inlet type is not named.

notes:
  - No Thunderbolt and no network port; used as the second monitor in the dual option, fed over DisplayPort
    from the U2724DE.
