# Device model: LG 55UH5Q-E (UH5Q-E series, 55 inch)
# Facts from the vendor's public documentation, read twice (the spec table, then separately the manual or leaflet),
# reconciled. Anything the sources don't state, or where they disagree, is under gaps.

manufacturer: LG

model: "55UH5Q-E"

part_numbers:
  - { number: 55UH5Q-E, notes: "Global" }
  - { number: 55UH5Q-E.AUS, notes: "United States" }

class: display

summary: "A 55 inch 4K commercial display rated for 24/7 use, 500 nits, webOS 24, three HDMI inputs, DisplayPort, LAN, RS-232C and IR. The house display for small meeting rooms, huddle rooms and signage."

dimensions_mm:
  width: 1240.1
  height: 711.9
  depth: 29.7
  notes: "Head only, from the owner's manual. Bezel 11.4 mm, even on all sides."

weight_kg: 14.3

power:
  inputs:
    - type: ac
      port: power-in
      volts: "100-240V AC"
      supplied: true
      notes: "Built-in power supply, 1.6 A."
  consumption_w:
    typical: 103
    max: 160
  notes: "LG marks these TBD on the product page; the UH5N-M it replaces is 103 W typical. 72 W with Smart Energy Saving, 0.5 W in DPM standby or off."

mounting:
  - wall
  - vesa

security_support:
  firmware_line: LG webOS Signage
  ends: { date: "2027-08", demo: true }
  vulnerability_contact: { url: "https://lgsecurity.lge.com/reporting", source: lg-product-security }
sources:
  - source: lg-55uh5q-e-product-page
    provides: "Panel, power, webOS version, 24/7 rating (spec table)"
  - source: lg-uh5q-datasheet-43-65
    provides: "Ports, in the order the rear panel diagram numbers them, and power"
  - source: lg-uh5q-owners-manual-43-65
    provides: "Size, head weight, VESA, power supply, and the inputs that cannot wake it from standby, read separately from the datasheet"
  - source: lg-uh5q-us-product-page
    provides: "US part number"

ports:
  - id: lan-1
    label: "LAN IN"
    connector: "rj45"
    signals: [ethernet]
    direction: bidirectional
    face: rear
    order: 1
    notes: "No LAN out. Used for network control, SNMP and fleet management."
  - id: usb-a-1
    label: "USB IN 1"
    connector: "usb-a"
    signals: [usb, power]
    direction: bidirectional
    face: rear
    order: 2
    notes: "USB 2.0, 5 V 0.5 A."
  - id: usb-a-2
    label: "USB IN 2"
    connector: "usb-a"
    signals: [usb, power]
    direction: bidirectional
    face: rear
    order: 3
    notes: "USB 2.0, 5 V 0.5 A."
  - id: hdmi-in-1
    label: "HDMI IN 1"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    order: 4
    notes: "4K 60 Hz, HDCP 2.2 and 1.4."
  - id: hdmi-in-2
    label: "HDMI IN 2 (ARC)"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    order: 5
    notes: "4K 60 Hz with audio return channel, HDCP 2.2 and 1.4."
  - id: hdmi-in-3
    label: "HDMI IN 3"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    order: 6
    notes: "4K 60 Hz, HDCP 2.2 and 1.4. Cannot wake the display from DPM standby."
  - id: displayport-in-1
    label: "DP IN"
    connector: "displayport"
    signals: [video, audio]
    direction: in
    face: rear
    order: 7
    notes: "HDCP 2.2 and 1.3. Cannot wake the display from DPM standby."
  - id: ir-in-1
    label: "IR & LIGHT SENSOR"
    connector: "3.5mm"
    signals: [ir]
    direction: in
    face: rear
    order: 8
    notes: "For the external IR receiver and light sensor."
  - id: audio-out-1
    label: "AUDIO OUT"
    connector: "3.5mm"
    signals: [audio]
    direction: out
    face: rear
    order: 9
  - id: serial-1
    label: "RS-232C IN"
    connector: "3.5mm"
    signals: [rs232]
    direction: in
    face: rear
    order: 10
    notes: "3.5 mm 4-pin jack; a phone-to-RS-232C adapter is in the box. 9600 bps, 8N1."
  - id: serial-2
    label: "RS-232C OUT"
    connector: "3.5mm"
    signals: [rs232]
    direction: out
    face: rear
    order: 11
    notes: "3.5 mm 4-pin jack, for daisy chaining."
  - id: power-in
    label: "Power"
    connector: "not-stated"
    signals: [power]
    direction: in
    face: rear
    notes: "Built-in power supply, 100 to 240 V AC. LG shows a hidden power inlet but does not name its type."

gaps:
  - "LG's product page gives 16.1 kg (marked TBD); the owner's manual gives 14.3 kg, which is used."
  - "Power figures are marked TBD by LG."
  - "The power inlet type is not stated."
  - "No launch date is published; the datasheet is dated July 2025."
  - "Whether the port panel faces down or sideways is not stated."

notes:
  - "VESA 300 x 300 mm, M6 screws, 14 mm deep at most."
  - "500 nits typical, ADS edge-lit panel, 50,000 hour life, IP5X dust rating, partial conformal coating."
  - "webOS 24 (the spec page says webOS 8.0), 16 GB storage, Wi-Fi and Bluetooth, 2 x 10 W speakers."
  - "SNMP 2.0 supported; works with LG Business Cloud (ConnectedCare) and SuperSign."
  - "Operating temperature 0 to 40 degrees C."
