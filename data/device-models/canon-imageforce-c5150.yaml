# Device model: Canon imageFORCE C5150
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Canon

model: imageFORCE C5150

class: printer

summary: An A3 colour multifunction printer in Canon's imageFORCE C5100 series (alongside the C5140/C5160/C5170),
  with Gigabit Ethernet (optional Wi-Fi), standard USB host and device ports, and an optional embedded
  Fiery print-controller upgrade that adds its own network/USB ports.

dimensions_mm:
  width: 620
  height: 937
  depth: 722
  notes: Vendor gives 620 x 722 x 937 mm labeled 'W x D x H' for the main unit; this single figure is
    given once for the whole C5100 series (C5140-C5170), not broken out per model. Mapped to width/depth/height
    accordingly; this is the base main-unit footprint without optional finisher/cassette modules attached.

weight_kg: 105

power:
  inputs:
    - type: ac
      volts: 220-240V
      notes: 'Rated 220-240V, 50/60Hz, 6A (given once for the whole C5100 series, not broken out per model);
        exact inlet connector type (e.g. IEC C13/C14) is not stated by the vendor. Connects at: AC mains
        inlet.'
  consumption_w:
    typical: 1084
    max: 1800

sources:
  - source: canon-imageforce-c5100-series-technical-specifications-datasheet
    provides: Dimensions, weight, power and interfaces
  - source: canon-imageforce-c5150-specifications-canon-europe
    provides: Specifications
  - source: canon-imageforce-c5100-series-spec-sheet-us
    provides: Specifications
  - source: canon-imageforce-c5170-c5150-users-guide-rear-side
    provides: Port labels, faces and panel layout (rear-side connector figure)
  - source: canon-imageforce-c5170-c5150-users-guide-front-side
    provides: Port labels and position of the front USB port

ports:
  - id: lan-1
    label: NETWORK
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    notes: Standard wired Gigabit Ethernet; on the rear side, bottom of a vertical stack of three connectors
      (USB host, USB device, LAN); the figure does not show where along the rear the stack sits, so no order is set. An optional Wireless LAN board (IEEE 802.11a/b/g/n/ac/ax,
      with a separate 5GHz license accessory) is also available but is an internal module/antenna, not
      an external physical connector, so it is not listed as its own port entry.
  - id: usb-host-1
    label: USB 2.0 (Host)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    notes: Vendor lists this only as 'USB 2.0 (Host)' without naming the physical connector shape; not
      confirmed as Type-A by the source text, so left not-stated.
  - id: usb-host-2
    label: USB 3.0 (Host)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    face: rear
    notes: Vendor lists this only as 'USB 3.0 (Host)' without naming the physical connector shape; not
      confirmed as Type-A by the source text, so left not-stated. Top of the vertical stack of three
      rear connectors; the figure does not show where along the rear the stack sits, so no order is set.
  - id: usb-device-1
    label: USB 2.0 (Device)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    face: rear
    notes: Local PC connection for direct (non-network) printing/control; physical connector shape not
      named by the vendor. Middle of the vertical stack of three rear connectors; the figure does not show where
      along the rear the stack sits, so no order is set.

gaps:
  - Canon does not name the USB connector shapes.
  - Size and weight are given once for the whole C5100 series.
  - 'usb-host-1 has no face set: Canon''s user guide calls it the USB port on the front right side, and
    the figure shows it at the front right corner, so it cannot be told whether it faces the front or
    the right side.'
  - The three rear connectors (usb-host-2, usb-device-1, lan-1) are stacked in one column in Canon's
    figure, which does not show where along the rear that column sits, so they have a face but no order.

notes:
  - Uses about 1084 W copying and up to 1800 W (220 to 240 V).
  - An optional Fiery controller adds two more network and two USB 3.0 ports.
