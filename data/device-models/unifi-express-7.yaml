# Device model: Ubiquiti UniFi Express 7 (UX7)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Ubiquiti

model: UniFi Express 7 (UX7)

class: network-gateway

summary: Compact desktop UniFi gateway and WiFi 7 access point with one 10GbE and one 2.5GbE RJ45 port,
  USB-C powered (no PoE in or out), a small status display, and integrated tri-band WiFi 6E/7 radios.

dimensions_mm:
  width: 117
  height: 42.5
  depth: 117
  notes: Square desktop footprint; Ubiquiti gives one figure '117 x 117 x 42.5 mm' without separately
    labeling axes. Interpreted as width x depth x height given the square base and low profile; height
    is unambiguous at 42.5mm either way.

weight_kg: 0.443

power:
  inputs:
    - type: usb-c
      port: power-in
      volts: 5V DC
      watts: 25
      supplied: false
      notes: Powered by an included USB-C power adapter rated 5V/5A (25W); the adapter itself takes 100-240V
        AC mains input. Max. device power consumption is separately stated as 22W.
  consumption_w:
    max: 22

mounting:
  - table

sources:
  - source: unifi-express-7-tech-specs
    provides: Specifications
  - source: unifi-express-7-tech-specs-2
    provides: Specifications, and the port view figure showing the port face left to right (reset, USB-C, 2.5G, 10G)
  - source: unifi-express-7-installation-guide
    provides: Port labels, faces and panel layout
  - source: unifi-ux7-unifi-express-7-datasheet-distributor-hosted
    provides: Supporting details

ports:
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    order: 3
    notes: 10GbE RJ45 port; this is the default WAN port. Right-most of the ports on the port face as drawn
      by Ubiquiti. Not PoE (no PoE mentioned anywhere on the spec
      page).
  - id: lan-2
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    order: 2
    notes: 2.5GbE RJ45 port, between the USB-C power port and the 10G port on the port face; not the default WAN port (LAN by default, though UniFi gateways can usually
      reassign WAN/LAN in software - not confirmed on this page). Not PoE.
  - id: power-in
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    order: 1
    notes: Left-most of the ports on the port face as drawn by Ubiquiti (the small reset button sits further
      left). USB-C receptacle used only for power input (5V DC/5A) from the included adapter; not a data
      port.

gaps:
  - No wall or ceiling mounting stated on the spec page.
  - Ubiquiti's figures show one face with the display and a separate face with all the ports, but they do
    not use the words front or rear, and no drawing shows how the two faces sit against each other, so no
    face is set for lan-1, lan-2 and power-in. The order along the port face is taken directly from
    Ubiquiti's port view.

notes:
  - A router and Wi-Fi 7 access point in one; no PoE in or out.
  - Powered over USB-C (5 V, 5 A); draws up to 22 W.
  - 'Weight: 443 g on the Ubiquiti spec page, 422 g in a distributor copy of its datasheet.'
