# Device model: Ubiquiti UniFi U7 Pro Max (U7-Pro-Max)
# Facts from the vendor's public documentation, read twice (the tech specs page's table, then separately the
# store page and the labelled back-face drawing), reconciled. Anything the sources don't state is under gaps.

manufacturer: Ubiquiti

model: U7 Pro Max

part_numbers:
  - number: U7-Pro-Max

class: wireless-access-point

summary: "Ceiling or wall Wi-Fi 7 access point with 4x4 on 5 GHz, 2x2 on 6 and 2.4 GHz, a dedicated spectral scanning radio, one 2.5 GbE PoE+ port, 25 W maximum draw. The house access point for dense areas: large meeting rooms, town halls and cafeterias."

dimensions_mm:
  width: 206
  height: 206
  depth: 46
  notes: Round. Ubiquiti gives the size as a 206 mm diameter by 46 mm; width and height here are the diameter, depth is how far it stands off the ceiling.

weight_kg: 0.68

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3at
      volts: 44-57V DC
      supplied: false
      notes: Ubiquiti lists PoE+ as the power method and the Help Center maps PoE+ to IEEE 802.3at (25.5 W at the device). No PoE injector in the box.
  consumption_w:
    max: 25

mounting:
  - ceiling
  - wall

sources:
  - source: unifi-u7-pro-max-tech-specs
    provides: Size, weight, power, port, radios, mounting, operating conditions (spec table), and the port's place on the back face (drawing)
  - source: unifi-u7-pro-max-store
    provides: Key features and what is in the box, read separately to check the spec page
  - source: unifi-help-poe-modes
    provides: PoE+ is 802.3at, and this model's draw
  - source: unifi-help-ceiling-mounts
    provides: The Pro mounting system for ceilings, walls, ceiling tiles and junction boxes

ports:
  - id: lan-1
    label: 2.5 GbE PoE+ in
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3at
    face: rear
    order: 1
    notes: The only port, 1 or 2.5 GbE, in a recessed bay on the mounting face beside the reset button. It takes the uplink and the power.

gaps:
  - Ubiquiti publishes one weight (680 g); it does not say whether that includes the Pro mount.
  - Ubiquiti says PoE+ but does not state a PoE class number. Class 4 would follow from 802.3at but is not published, so it is left out.
  - No official announcement or end-of-life dates are published on the vendor pages read, so lifecycle is left out.
  - No ingress (IP) rating is published; it is an indoor access point.
  - Ubiquiti gives no mounting height. The Wi-Fi standard sets the house height from public design guides.

notes:
  - "Radios: 2x2 on 6 GHz, 4x4 on 5 GHz and 2x2 on 2.4 GHz (eight spatial streams); up to 5.8 Gb/s on 6 GHz (320 MHz), 8.6 Gb/s on 5 GHz (240 MHz) and 688 Mb/s on 2.4 GHz (40 MHz); 500 or more clients; rated coverage 160 square metres; a dedicated spectral scanning engine and Zero-Wait DFS."
  - "Wi-Fi 7 on three bands, 8 SSIDs (BSSIDs) per radio; 802.11k, v and r, band steering, PPSK and RADIUS-assigned VLANs are listed features."
  - "Managed in the UniFi Network application, version 8.2.93 or later. MLO needs UniFi Network 8.2.93 or later and access point firmware 7.1.18 or later (Help Center)."
  - "Operating temperature -30 to 50 degrees C, humidity 5 to 95 percent non-condensing."
  - "The store page still calls MLO coming soon; the Help Center article on MLO says it is available, and is the one relied on."
