# Device model: Kramer VP-440H2
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: VP-440H2

part_numbers:
  - number: VP-440H2
    notes: Manual P/N 2900-300644 Rev 5 (current on product page); Rev 2 also reviewed, same panels and
      specs.

class: adapter

summary: A half-rack 4K60 presentation switcher/scaler with three HDMI, one VGA and one HDBaseT input
  (with PoE to the transmitter), a mic input, and simultaneous HDMI and HDBaseT outputs.

dimensions_mm:
  width: 214.6
  height: 43.6
  depth: 163.0
  notes: Manual and product page give Net Dimensions (W, D, H) 21.46cm x 16.30cm x 4.36cm. Half 19in 1U
    enclosure.

weight_kg: 1.5

power:
  inputs:
    - type: dc
      port: power-in
      volts: 48V DC
      supplied: true
      notes: Included 48V power supply connects to a 2-pin 48V DC terminal block. Consumption 850mA (about
        40.8W at 48V, calculated).
  poe_budget_w: 13

mounting:
  - rack

sources:
  - source: kramer-vp-440h2-4k-presentation-switcher-scaler-kramer
    provides: Specifications
  - source: kramer-vp-440h2-user-manual-p-n-2900
    provides: Port labels, faces and panel layout
  - source: kramer-vp-440h2-product-page-kramerav-com
    provides: Specifications

ports:
  - id: mic-1
    label: MIC
    connector: 6.35mm
    signals:
      - microphone
      - audio
    direction: in
    face: front
    order: 1
    notes: 6.3mm microphone jack; adjacent 48V slide switch selects phantom power for condenser mics.
  - id: hdbaset-1
    label: HDBT IN
    connector: rj45
    signals:
      - hdbaset
      - video
      - audio
      - rs232
      - poe
    direction: in
    poe:
      role: source
      standard: proprietary
      watts: 13
    face: rear
    order: 1
    notes: HDBaseT input from a transmitter (e.g. WP-20); can power the transmitter with up to 13W. Lower
      row. Rear panel has two rows of connectors; order is by horizontal position of the connector centre
      across both rows in Figure 2.
  - id: hdmi-in-1
    label: HDMI IN1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 2
    notes: HDMI input 1. Lower row.
  - id: rs232-1
    label: CONTROL
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 3
    notes: 3-pin (G Rx Tx) RS-232 for controlling the unit. Upper row.
  - id: hdmi-in-2
    label: HDMI IN2
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 4
    notes: HDMI input 2. Lower row.
  - id: rs232-2
    label: HDBT IN (G Rx Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 5
    notes: RS-232 tunnelled to/from the device at the HDBT IN transmitter end. Upper row; drawn as the
      left half of a 6-pin block shared with rs232-3.
  - id: rs232-3
    label: HDBT OUT (G Rx Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 6
    notes: RS-232 tunnelled to/from the device at the HDBT OUT receiver end. Upper row; right half of
      the 6-pin block.
  - id: hdmi-in-3
    label: HDMI IN3
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 7
    notes: HDMI input 3. Lower row.
  - id: vga-in-1
    label: PC IN
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 8
    notes: 15-pin HD (VGA) computer graphics input; no VGA/DB15 value in the connector enum. Id uses a
      vga prefix since the naming rule has none. Lower row.
  - id: audio-in-1
    label: AUDIO INPUTS HDMI 1
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 9
    notes: Unbalanced stereo analog audio for HDMI source 1. Upper row.
  - id: audio-in-2
    label: AUDIO INPUTS HDMI 2
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 10
    notes: Unbalanced stereo analog audio for HDMI source 2. Upper row.
  - id: audio-in-3
    label: AUDIO INPUTS HDMI 3
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 11
    notes: Unbalanced stereo analog audio for HDMI source 3. Upper row.
  - id: hdbaset-2
    label: HDBT OUT
    connector: rj45
    signals:
      - hdbaset
      - video
      - audio
      - rs232
    direction: in
    face: rear
    order: 12
    notes: HDBaseT output to a receiver (e.g. TP-580Rxr). No PoE stated on this port. Lower row.
  - id: audio-in-4
    label: AUDIO INPUTS PC
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 13
    notes: Unbalanced stereo analog audio for the PC (VGA) source. Upper row.
  - id: hdmi-out-1
    label: HDMI OUT
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 14
    notes: HDMI output. Lower row.
  - id: audio-out-1
    label: AUDIO OUT
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 15
    notes: Unbalanced stereo audio output. Upper row.
  - id: lan-1
    label: ETHERNET
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 16
    notes: Ethernet for control and web pages. Upper row.
  - id: power-in
    label: 48V DC
    connector: terminal-block
    signals:
      - power
    direction: in
    face: rear
    order: 17
    notes: 2-pin (+ -) 48V DC power terminal block. Lower row.

gaps:
  - No PoE standard or class for the power it sends over HDBaseT (up to 13 W).
  - No consumption figure; power is given as 48 V DC, 850 mA (about 41 W).

notes:
  - The rear has two rows of connectors; order counts left to right by position, so close neighbours may
    be read either way.
  - The four 3.5 mm audio inputs are numbered left to right; their printed labels are source names.
  - The rack adapter is named RK-1 in most places and RK-T2B in one.
