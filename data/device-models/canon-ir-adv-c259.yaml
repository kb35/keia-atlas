# Device model: Canon imageRUNNER ADVANCE DX C259
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Canon

model: imageRUNNER ADVANCE DX C259

part_numbers:
  - number: iR-ADV DX C259i
    notes: Full marketed model designation used throughout Canon's own datasheet and spec pages;

class: printer

summary: A compact A4 colour multifunction printer/copier in Canon's imageRUNNER ADVANCE DX C259/C359
  series, with Gigabit Ethernet (optional Wi-Fi), and standard USB host and device ports for local printing,
  memory-key scanning and device control.

dimensions_mm:
  width: 519
  height: 638
  depth: 658
  notes: Vendor gives 519 x 658 x 638 mm labeled 'W x D x H' for the main unit (iR-ADV DX C359i/C259i
    configuration); mapped to width/depth/height accordingly. This is the base main-unit footprint without
    optional cassette or finisher modules attached.

weight_kg: 48

power:
  inputs:
    - type: ac
      volts: 220-240V
      notes: 'Rated 220-240V, 50/60Hz, 3.9A; exact inlet connector type (e.g. IEC C13/C14) is not stated
        by the vendor. Connects at: AC mains inlet.'
  consumption_w:
    typical: 575.4
    max: 1500

security_support:
  firmware_line: Canon imageRUNNER ADVANCE firmware
  ends: { date: "2027-03", demo: true }
sources:
  - source: canon-imagerunner-advance-dx-c259-c359-series-technical
    provides: Dimensions, weight, power and interfaces
  - source: canon-imagerunner-advance-dx-259i-specifications-canon
    provides: Specifications
  - source: canon-imagerunner-advance-dx-c359i-c259i-users-guide-back-side
    provides: Port labels, faces and panel layout (rear-side connector figure)
  - source: canon-imagerunner-advance-dx-c359i-c259i-users-guide-front-side
    provides: Port labels and position of the front USB port

ports:
  - id: lan-1
    label: NETWORK
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    notes: Standard wired Gigabit Ethernet; on the rear side, bottom of a vertical stack of three connectors
      (USB host, USB device, LAN); the figure does not show where along the rear the stack sits, so no order is set. A separate optional Wireless LAN board (IEEE 802.11 b/g/n)
      is also available but is an internal module, not a physical external connector, so it is not listed
      as its own port entry.
  - id: usb-host-1
    label: USB 2.0 (Host)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    notes: Vendor lists this only as 'USB 2.0 (Host)' without naming the physical connector shape; likely
      a Type-A receptacle (common on this device class) but not confirmed by the source text, so left
      not-stated.
  - id: usb-host-2
    label: USB 3.0 (Host)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    face: rear
    notes: Vendor lists this only as 'USB 3.0 (Host)' without naming the physical connector shape; not
      confirmed as Type-A by the source text, so left not-stated. Used for e.g. USB memory-key scan/print
      or an external hard disk. Top of the vertical stack of three rear connectors; the figure does not show where
      along the rear the stack sits, so no order is set.
  - id: usb-device-1
    label: USB 2.0 (Device)
    connector: not-stated
    signals:
      - usb
    direction: bidirectional
    face: rear
    notes: Local PC connection for direct (non-network) printing/control; physical connector shape not
      named by the vendor. Middle of the vertical stack of three rear connectors; the figure does not show where
      along the rear the stack sits, so no order is set.

gaps:
  - Canon publishes no vulnerability reporting page that could be opened on 30 Sept 2026, so security_support has no vulnerability_contact.
  - Canon does not name the USB connector shapes.
  - 'usb-host-1 has no face set: Canon''s user guide calls it the USB port on the front-right side, and
    the figure shows it at the front right corner, so it cannot be told whether it faces the front or
    the right side.'
  - The three rear connectors (usb-host-2, usb-device-1, lan-1) are stacked in one column in Canon's
    figure, which does not show where along the rear that column sits, so they have a face but no order.

notes:
  - Canon's datasheet lists it as the C259i in the C259 and C359 series.
  - Uses about 575 W copying and up to 1500 W.
  - About 48 kg with toner.
