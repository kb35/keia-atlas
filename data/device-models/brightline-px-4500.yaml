# Device model: Brightline PX-4500 WXGA Projector
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Brightline
model: PX-4500 WXGA Projector
class: display
summary: Demo data, a made-up model standing in for a 2012-era product. Lamp projector with HDMI and
  VGA inputs and network control.
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - ceiling
  - table
lifecycle:
  end_of_support: 2021-06-30
security_support:
  firmware_line: Brightline firmware
  ends: { date: "2021-06", demo: true }
  vulnerability_contact: { url: "https://brightline.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: hdmi-in-1
    label: HDMI in
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 1
  - id: vga-in-1
    label: VGA in
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 2
  - id: audio-in-1
    label: Audio in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 3
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 4
  - id: serial-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 5
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 6
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
