# Device model: CalDigit TS5 Thunderbolt 5 Dock
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: CalDigit

model: TS5 Thunderbolt 5 Dock

part_numbers:
  - number: TBT5-TS5-US-AMZ
    notes: Retail SKU seen at a US retailer (B&H Photo); CalDigit's own product/manual pages do not print
      a distinct model or part number, only the name 'TS5'.

class: dock

summary: Desktop Thunderbolt 5 docking station (upright/tower form factor) with 15 ports, including one
  Thunderbolt 5 host port and three Thunderbolt 5/USB4 downstream ports, delivering up to 140W to a connected
  computer.

dimensions_mm:
  width: 42.0
  height: 141.0
  depth: 113.4
  notes: 'Vendor''s own labelled axes for this upright tower unit: Height 141.0mm (vertical), Width 42.0mm
    (left-right, the narrow front/rear panel width), Length 113.4mm (front-to-back, mapped to ''depth''
    here). Note the front-to-back depth (113.4mm) is larger than the left-right width (42.0mm), unusual
    versus the schema''s usual ''width is the long horizontal side'' convention, because the unit stands
    upright rather than lying flat.'

weight_kg: 0.64

power:
  inputs:
    - type: dc
      volts: 20V
      watts: 240
      supplied: true
      notes: 'External power brick rated 240W; DC input barrel connector rated 20V/12A (=240W). Connects
        at: DC in (barrel connector).'

client_os:
  - macos
  - windows

mounting:
  - freestanding

sources:
  - source: caldigit-thunderbolt-5-dock-ts5-15-ports-140w
    provides: Specifications
  - source: caldigit-ts5-1-0m-thunderbolt-station-5
    provides: Specifications
  - source: caldigit-ts5-thunderbolt-station-5-manual
    provides: Port labels, faces and panel layout

ports:
  - id: audio-out-1
    connector: 3.5mm
    signals:
      - audio
      - microphone
    direction: bidirectional
    face: front
    order: 1
    notes: Front combo audio jack shown with both a microphone-style icon and a headphone icon at one
      physical jack; CalDigit's marketing copy calls this the 'Front Combo Audio In/Out'.
  - id: usb-c-1
    label: USB-C DATA
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: front
    order: 2
    notes: Front USB-C (10Gb/s) data port.
  - id: usb-c-2
    label: 20W
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 20
    face: front
    order: 3
    notes: Front USB-C (10Gb/s) port dedicated to higher-power charging, labelled '20W' on the unit.
  - id: audio-in-1
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 1
    notes: Rear audio input jack.
  - id: audio-out-2
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 2
    notes: Rear audio output jack.
  - id: usb-c-3
    label: USB 3 DATA
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 3
    notes: Rear USB-C (10Gb/s) data port; shares the 'USB 3 DATA' bracket label with the adjacent USB-A
      port.
  - id: usb-a-1
    label: USB 3 DATA
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 4
    notes: Rear USB-A (10Gb/s) port under the shared 'USB 3 DATA' bracket.
  - id: usb-a-2
    label: USB 2
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 7.5
    face: rear
    order: 5
    notes: Rear USB-A (480MB/s) port, labelled 'USB 2' on the unit.
  - id: lan-1
    label: 2.5GbE
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 6
    notes: 2.5 Gigabit Ethernet port.
  - id: usb-c-4
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 15
    face: rear
    order: 7
    notes: Downstream Thunderbolt 5/USB4 port (80Gb/s), first of three (bottom row, left to right).
  - id: usb-c-5
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 15
    face: rear
    order: 8
    notes: Downstream Thunderbolt 5/USB4 port (80Gb/s), second of three.
  - id: usb-c-6
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 15
    face: rear
    order: 9
    notes: Downstream Thunderbolt 5/USB4 port (80Gb/s), third of three.
  - id: usb-c-7
    label: Computer/140W
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 140
    face: rear
    order: 10
    notes: Host/upstream Thunderbolt 5 port (up to 120Gb/s), labelled '[Computer/140W]' on the unit; connects
      to the computer and delivers up to 140W host charging.
  - id: power-in
    label: 'DC in: 20V 12A'
    connector: not-stated
    signals:
      - power
    direction: in
    face: rear
    order: 11
    notes: External 240W power supply barrel connector input.

gaps:
  - Linux is not listed in CalDigit's compatibility statement.
  - The DC socket type is not named.

notes:
  - CalDigit lists macOS and Windows.
  - Charges the laptop at up to 140 W from a 240 W external supply.
  - Unlike the TS5 Plus, it has 2.5 Gb/s Ethernet and no DisplayPort output.
