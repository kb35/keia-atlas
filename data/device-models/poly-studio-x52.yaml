# Device model: Poly Studio X52
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio X52

part_numbers:
  - number: 8D8L1AA
    notes: HP/Poly SKU for Studio X52 bundled with the TC10 touch controller kit (region suffix appended,
      e.g. 8D8L1AA#ABA); physical dimensions/power/ports below are for the video bar hardware itself,
      which is unchanged across bundle SKUs

class: video-bar

summary: All-in-one 4K video bar for medium rooms with a 20MP 95-degree FOV camera, stereo speakers and
  MEMS microphone array, dual HDMI outputs plus one HDMI input, USB-C and USB-A device-mode ports, an
  optional table expansion microphone input, and an external auto-sensing AC power supply (no PoE).

dimensions_mm:
  width: 769.5
  height: 115.2
  depth: 103
  notes: 'Datasheet states both units directly: ''30.3 W x 4.5 H x 4 D (Inches)'' = ''769.5 W x 115.2
    H x 103 D (MM)''; vendor''s own mm figures used as-is (not independently re-converted).'

weight_kg: 2.54

power:
  inputs:
    - type: ac
      port: power-in
      volts: 100-240 V AC (external power supply); auto sensing, 120 V @ 60 Hz or 230 V @ 50/60 Hz
      supplied: true
      notes: External auto-sensing power supply/brick and IEC power cord included in box; no PoE option
        documented for the standalone Studio X52 video bar.
  consumption_w:
    max: 25

mounting:
  - display-mount
  - wall
  - vesa
  - table

sources:
  - source: poly-studio-x52-all-in-one-video
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-x52-com-kit-de-controladores
    provides: Specifications
  - source: poly-partner-mode-user-guide-4-1
    provides: Port labels, faces and panel layout
  - source: poly-video-mode-administrator-guide-4-4
    provides: Port labels, faces and panel layout

ports:
  - id: mic-1
    connector: proprietary
    signals:
      - microphone
    direction: in
    face: rear
    order: 1
    notes: Poly Table Expansion Microphone connection (optional accessory mic input).
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 2
    notes: One of two USB-A (5Gbps signaling) ports.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
    notes: Second of two USB-A ports; both shown under one reference number in the panel diagram so exact
      left/right order within the pair is not distinguishable.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 4
    notes: 10/100/1G Ethernet, Auto-MDIX. No PoE documented for this port.
  - id: power-in
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 5
    notes: Connector type inferred as a barrel/coaxial DC jack from the panel icon; not explicitly named
      in the sources reviewed. Powered from the included external AC adapter.
  - id: hdmi-out-2
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 6
    notes: HDMI 2.0, secondary monitor output.
  - id: hdmi-out-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 7
    notes: HDMI 2.0, primary monitor output.
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 8
    notes: HDMI 2.0, video and audio, for content sharing and Device Mode.
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 9
    notes: USB-C, 5Gbps signaling, for Device Mode.

gaps:
  - No DC voltage or current stated at the power port, only the adapter rating.
  - No USB charging output stated.
  - The left-right order of the two USB-A ports is not shown.

notes:
  - Draws about 8 W idle and 25 W heavily loaded.
  - Part number 8D8L1AA is the X52 sold with a TC10 touch controller, not the bare video bar.
  - The power socket is drawn as a round DC jack; its type is not named in text.
