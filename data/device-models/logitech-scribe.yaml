# Device model: Logitech Scribe
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Logitech

model: Scribe

part_numbers:
  - number: 960-001332
    notes: 'Logitech Scribe kit: camera, share button, power injector, dongle transceiver, 2x 5 m Cat5e
      cables, install kit'
  - number: 994-000147
    notes: Extended Warranty for Logitech Scribe (not hardware)

class: camera

summary: Wall-mounted AI whiteboard camera on an arm above the whiteboard, linked over Cat5e through an
  inline power injector to a USB dongle that plugs into the room PC.

dimensions_mm:
  width: 119
  height: 149
  depth: 593
  notes: 'Camera unit only, vendor order Height x Width x Depth. The 593 mm depth is the arm''s reach
    out from the wall, so the ''width = long side'' convention does not fit this shape; kept as the vendor
    labels it. The Logitech Hub spec page gives depth 573 mm (22.56 in), conflicting with the datasheet''s
    593 mm (23.4 in). Kit parts: Power Injector 91 x 60 x 36 mm (H x W x D; Hub page: 91 x 60.2 x 36.3
    mm); Dongle Transceiver 23 x 31 x 84 mm with 500 mm cable; Share Button 12.7 mm high, 71.8 mm diameter,
    108 g.'

weight_kg: 1.1

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: proprietary
      supplied: true
      notes: Powered over its category cable by Logitech's Power Injector, included in the kit.

mounting:
  - wall

sources:
  - source: logitech-scribe-datasheet-education-may-2021
    provides: Dimensions, weight, power and interfaces
  - source: logitech-scribe-setup-guide
    provides: Port labels, faces and panel layout
  - source: logitech-specifications-scribe-whiteboard-camera-logitech-hub
    provides: Specifications
  - source: logitech-vc-wiring-diagrams-meetup-2-p
    provides: Port labels, faces and panel layout
  - source: logitech-scribe-accessories-datasheet
    provides: Dimensions, weight, power and interfaces

ports:
  - id: lan-1
    connector: rj45
    signals:
      - video
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: proprietary
    face: rear
    order: 1
    notes: On the camera. Category cable port carrying the proprietary camera link (not standard Ethernet)
      plus power from the injector. Cable routes up, down or through the wall. The Scribe setup guide
      (pages 4 and 10) shows the port inside the cable well on the wall-side end of the arm, which is
      hidden against the wall bracket once mounted, so it is on the rear face. It is the only port on
      that face, so the order of 1 is trivially right.

gaps:
  - No power draw for the camera or its power injector.

notes:
  - 'Kit parts not modelled as separate devices: a Power Injector (IN and OUT category cable ports, mains
    in through an IEC C8 cord adapter) and a Dongle Transceiver (category cable in, USB-A to the room
    computer).'
  - The camera link is Logitech's own USB and power over category cable, not standard PoE.
  - 'Depth: datasheet 593 mm, Logitech''s spec page 573 mm.'
