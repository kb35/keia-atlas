# Device model: Dell Pro P 27 USB-C Hub Conferencing Monitor (P2726DEB)
# Facts from the vendor's public documentation (one reading, spot-checked against the source).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Dell

model: Pro P 27 USB-C Hub Conferencing Monitor (P2726DEB)

part_numbers:
  - number: P2726DEB
    notes: Marketing model. Regulatory model P2726DEBt.
  - number: 210-BVTQ
    notes: Dell US store SKU seen in a dell.com URL; not verified on the page itself
  - number: 210-BVHR
    notes: Dell UK store SKU seen in a dell.com URL; not verified on the page itself

class: monitor

summary: 27-inch QHD (2560x1440, 100 Hz) IPS monitor with a pop-up 2K webcam, dual mics, 2x5 W speakers,
  Teams controls and a USB-C hub with 90 W charging, Ethernet and DP out.

dimensions_mm:
  width: 612.34
  height: 392.58
  depth: 60.11
  notes: 'Without stand. With stand: height 417.78 mm (compressed) to 567.78 mm (extended), width 612.34
    mm, depth 192.28 mm. Stand alone: 272.80 mm wide, 192.28 mm deep. Weight: With stand assembly 7.13
    kg; stand assembly 1.58 kg; with packaging 9.90 kg. Mounting: Height-adjustable stand (tilt, swivel,
    pivot) supplied; VESA 100 x 100 for a wall-mount kit.'

weight_kg: 5.16

power:
  inputs:
    - type: ac
      port: power-in
      volts: 100-240 VAC 50/60 Hz
      supplied: true
      notes: 'Built-in supply; input current 2.5 A typical. Power cable included. Consumption: Max is
        at maximum brightness and contrast with maximum load on all USB ports. Standby 0.5 W, off 0.3
        W, networked standby 1.0 W, Energy Star Pon 19.1 W.'
  consumption_w:
    typical: 20.9
    max: 205

client_os:
  - macos
  - windows

mounting:
  - table
  - vesa

sources:
  - source: dell-pro-p-24-27-34-usb
    provides: Port labels, faces and panel layout
  - source: dell-pro-p-27-inch-qhd-usb
    provides: Specifications

ports:
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: bottom
    order: 1
    notes: Bottom panel callout 2. AC power cord inlet (internal supply); connector type not stated.
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 2
    notes: Bottom panel callout 3. HDMI 2.1 (HDCP 1.4) per Dell spec page.
  - id: displayport-in-1
    connector: displayport
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 3
    notes: Bottom panel callout 4. Standard DisplayPort 1.4 input; recorded as 'proprietary' only because
      the connector enum has no DisplayPort value.
  - id: usb-c-1
    connector: usb-c
    signals:
      - video
      - audio
      - usb
      - power
    direction: bidirectional
    usb_power_w: 90
    face: bottom
    order: 4
    notes: 'Bottom panel callout 5. USB-C 5Gbps upstream (Video + Data): DP 1.4 Alt Mode up to 2560x1440
      at 100 Hz, Power Delivery 20 V/4.5 A (90 W) to the laptop.'
  - id: displayport-out-1
    connector: displayport
    signals:
      - video
      - audio
    direction: out
    face: bottom
    order: 5
    notes: Bottom panel callout 6. DisplayPort output for MST daisy-chain; ships with a rubber plug. Recorded
      as 'proprietary' only because the enum has no DisplayPort value.
  - id: usb-b-1
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 6
    notes: Bottom panel callout 7. USB Type-B upstream to the computer; enables downstream ports and RJ45.
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 7
    notes: Bottom panel callout 8. USB Type-A 5Gbps downstream.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 8
    notes: Bottom panel callout 9. USB Type-A 5Gbps downstream.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: bottom
    order: 9
    notes: Bottom panel callout 10. Gigabit Ethernet through the monitor's USB hub; works only once a
      USB upstream cable (USB-C or Type-B) is connected.
  - id: usb-c-2
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 15
    face: front
    order: 1
    notes: Front view callout 13, quick-access USB-C 5Gbps downstream, 5 V/3 A. Order is among front ports
      only.
  - id: usb-a-3
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 10
    face: front
    order: 2
    notes: Front view callout 14, quick-access USB Type-A 5Gbps downstream, BC1.2 charging 5 V/1.5 A typical
      (2 A max), stated as 10 W.

gaps:
  - The mains inlet type is not named.

notes:
  - Dell names part P2726DEB the "Dell Pro P 27 USB-C Hub Conferencing Monitor".
  - The user guide is Dell's own copy (dl.dell.com), Rev. A00, March 2026.
  - 'Webcam: 2560 x 1440 at 30 fps per the user guide.'
