# Device model: Dell UltraSharp 27 Thunderbolt Hub Monitor (U2724DE)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Dell

model: UltraSharp 27 Thunderbolt Hub Monitor (U2724DE)

part_numbers:
  - number: U2724DEt
    notes: regulatory model number, from user's guide cover page
  - number: 210-BKSJ
    notes: US Dell.com order/SKU code; order codes vary by country

class: monitor

summary: 27-inch QHD (2560x1440) IPS Black Thunderbolt 4 hub monitor with USB-C/Thunderbolt 90W power
  delivery, USB-C/USB-A/RJ45 hub ports, height/tilt/swivel/pivot stand and VESA mount.

dimensions_mm:
  width: 612.2
  height: 352.5
  depth: 50.1
  notes: 'Body without stand. With stand: height 385.6-535.6 mm (compressed-extended), width 612.2 mm,
    depth 192.3 mm.'

weight_kg: 5.23

power:
  inputs:
    - type: ac
      volts: 100-240 VAC, 50/60 Hz +/-3 Hz
      supplied: true
      notes: 'Detachable IEC-style power cable; exact connector type not stated in source. Connects at:
        power connector (bottom panel).'
  consumption_w:
    typical: 24.4
    max: 225

mounting:
  - table
  - wall
  - vesa

sources:
  - source: dell-ultrasharp-27-thunderbolt-hub-monitor-u2724de
    provides: Port labels, faces and panel layout
  - source: dell-ultrasharp-27-thunderbolt-hub-monitor-u2724de-2
    provides: Dimensions, weight, power and interfaces
  - source: dell-ultrasharp-27-thunderbolt-hub-monitor-u2724de-3
    provides: Port labels, faces and panel layout
  - source: dell-ultrasharp-27-monitor-u2724d-outline-dimensions
    provides: Front view, for the drawing

ports:
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: bottom
    order: 1
    notes: Detachable AC power cable; connector type not named in source.
  - id: hdmi-in-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 2
    notes: HDCP 1.4, up to QHD 2560x1440 120Hz TMDS
  - id: displayport-in-1
    label: DisplayPort (in)
    connector: displayport
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 3
    notes: DP 1.4
  - id: displayport-out-1
    label: DisplayPort (out)
    connector: displayport
    signals:
      - video
      - audio
    direction: out
    face: bottom
    order: 4
    notes: DP output for MST daisy-chain
  - id: usb-c-1
    label: Thunderbolt 4 downstream
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 5
    notes: Thunderbolt 4 downstream, video-out only for daisy chain, 15 W PD
  - id: usb-c-2
    label: Thunderbolt 4 upstream
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 90
    face: bottom
    order: 6
    notes: Thunderbolt 4 / DP1.4 Alt Mode host upstream, PD up to 90W (20V/4.5A)
  - id: usb-c-3
    label: USB-C upstream
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 7
    notes: Data only upstream (USB 3.2 Gen2, 10Gbps), no video, no power delivery
  - id: usb-a-1
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 8
    notes: One of 4 SuperSpeed USB 10Gbps (USB 3.2 Gen2) downstream ports on the bottom panel (positions
      9,10,12,14 in source diagram); one of the four carries BC1.2 charging (marked with battery icon
      in source, exact position not distinguished).
  - id: usb-a-2
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 9
    notes: See usb-a-1 note.
  - id: usb-a-3
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 10
    notes: See usb-a-1 note.
  - id: audio-out-1
    label: Audio line-out
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: bottom
    order: 11
    notes: Two-channel only, does not support headphones. Connector size (3.5mm) inferred from 'line-out
      port' description;
  - id: usb-a-4
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 12
    notes: See usb-a-1 note.
  - id: lan-1
    label: RJ45 connector (2.5G)
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: bottom
    order: 13
    notes: 2.5GbE; requires host USB-C/Thunderbolt upstream connection to pass through
  - id: usb-c-4
    label: USB-C downstream
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 14
    notes: Quick-access downstream port, 5V/3A charging

gaps:
  - Dell's user guide has no operating system compatibility section for this model.
  - The mains inlet type is not named.

notes:
  - Its Thunderbolt 4 upstream port gives the laptop picture, network and charging over one cable, and
    can daisy-chain a second monitor over DisplayPort.
