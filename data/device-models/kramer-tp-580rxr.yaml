# Device model: Kramer TP-580Rxr
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: TP-580Rxr

class: av-extender

summary: A compact, fan-less HDBaseT receiver that extends 4K60 4:2:0 HDMI (HDCP 2.2) video plus bidirectional
  RS-232 and IR over extended-reach twisted-pair cable, for dropped-ceiling or rack mounting.

dimensions_mm:
  width: 120.0
  height: 24.4
  depth: 71.5
  notes: Vendor gives 'PRODUCT DIMENSIONS' as W, D, H = 12.00cm x 7.15cm x 2.44cm, converted from cm to
    mm here; reordered to width x height x depth per output convention.

weight_kg: 0.2

power:
  inputs:
    - type: dc
      port: power-in
      volts: 12V
      watts: 24
      notes: 12V DC, 2A rated power source (external power supply included).
  consumption_w:
    typical: 6

mounting:
  - ceiling
  - rack

sources:
  - source: kramer-tp-580rxr-4k60-4-2-0-hdmi
    provides: Specifications
  - source: kramer-tp-580rxr-datasheet
    provides: Dimensions, weight, power and interfaces; rear and front panel photo
  - source: kramer-tp-580txr-tp-580rxr-user-manual
    provides: Port labels, faces and panel layout
  - source: kramer-tp-580rxr-product-page-de
    provides: Specifications

ports:
  - id: hdbaset-1
    label: HDBT
    connector: rj45
    signals:
      - video
      - audio
      - hdbaset
      - rs232
      - ir
    direction: in
    face: rear
    order: 1
    notes: RJ-45 female HDBaseT input, extends HDMI video/audio plus the unit's RS-232 and IR signals
      from the transmitter end; not stated to carry or receive PoE.
  - id: hdmi-out-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 2
    notes: HDMI 2.0, HDCP 2.2 compliant output to the display.
  - id: ir-1
    label: IR
    connector: 3.5mm
    signals:
      - ir
    direction: bidirectional
    face: rear
    order: 4
    notes: For IR link extension; bidirectional per the datasheet's 'Bidirectional Infrared Extension'
      feature.
  - id: rs232-1
    label: RS-232
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 3
    notes: 9-pin D-sub; used both for extended (pass-through) RS-232 and for local device control/firmware
      upgrade via the K-Upload tool; bidirectional per the datasheet's 'Bidirectional RS-232 Extension'
      feature.
  - id: power-in
    label: Power
    connector: not-stated
    signals:
      - power
    direction: in
    face: rear
    order: 5
    notes: DC power input for the included 12V/2A power supply; the datasheet states the power source
      rating but not the physical connector type (e.g. barrel jack).

gaps:
  - The user manual (P/N 2900-300088 Rev 2, Figure 2) is for the earlier 1080p TP-580Rxr HDMI Line Receiver
    in the same enclosure, so the rear panel order is read from it and checked against the small rear
    panel photo in the 4K60 datasheet, which shows the same connector order.
  - No ports on the front face; the front has only the four status LEDs (IN, OUT, LINK, ON).

notes:
  - No PoE; powered by its 12 V adapter (500 mA).
  - Three fit in 1U with the RK-3T rack adapter.
