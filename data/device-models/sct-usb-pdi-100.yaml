# Device model: Sound Control Technologies USB-PDI-100
# Facts from the vendor's public documentation (one reading, spot-checked against the source).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Sound Control Technologies

model: USB-PDI-100

part_numbers:
  - number: USB-PDI-100
    notes: Current model on the SCT product page ('USB-PDI-100 Single-Cable USB-C Adapter'); unit printed
      'USB-PDI 100W'. Ships with WPS-USBC-100W supply.
  - number: WPS-USBC-100W
    notes: Included USB-C power supply, 100-240 VAC in, 5-20 VDC out, 5 A max, 65 x 25 x 140 mm (W x H
      x D), 325 g
  - number: USB-PDI
    notes: 'Earlier version per the 12/2/2024 datasheet: 60 W to laptop, WPS-USBC-65W supply, module 74
      x 20 x 104 mm, 118 g. Not the values used here.'

class: adapter

summary: Table-side box that turns one locking USB-C cable to a BYOM laptop into HDMI out, USB pass-through
  to the room's USB devices and up to 91 W of laptop charging.

dimensions_mm:
  width: 97
  height: 36
  depth: 104
  notes: Module only, from the 06/22/2026 USB-PDI-100 datasheet (H 36 x W 97 x D 104 mm; 1.43 x 3.81 x
    4.11 in). Vendor's depth is longer than width; kept as the vendor labels it since the connector faces
    are the 97 mm sides. Mounting ears not included in size. Earlier USB-PDI (2024) was H 20 x W 74 x
    D 104 mm.

weight_kg: 0.163

power:
  inputs:
    - type: usb-c
      volts: 20V
      watts: 100
      supplied: true
      notes: 'Powered by the included WPS-USBC-100W USB-C supply (input 100-240 VAC 50-60 Hz 1.6 A max;
        output 5/9/12/15/20 VDC, 5 A max). Watts = 20 V x 5 A input rating. Connects at: usb-c-2 (Power
        In).'
  consumption_w:
    typical: 2.2

sources:
  - source: sct-usb-pdi-100-power-delivery-injector-data
    provides: Dimensions, weight, power and interfaces
  - source: sct-usb-pdi-100-single-cable-usb-c
    provides: Specifications
  - source: sct-usb-pdi-100-application-guide-sct
    provides: Port labels, faces and panel layout
  - source: sct-usb-pdi-100w-back-panel-photo-sct
    provides: Supporting details
  - source: sct-usb-pdi-100w-front-panel-photo-sct
    provides: Supporting details
  - source: sct-usb-pdi-power-delivery-injector-product-specification
    provides: Dimensions, weight, power and interfaces

ports:
  - id: usb-c-1
    label: Power + Data
    connector: usb-c
    signals:
      - video
      - audio
      - usb
      - power
    direction: bidirectional
    usb_power_w: 91
    face: front
    order: 1
    notes: 'Full-function locking USB-C to the BYOM laptop: receives DisplayPort 1.4a Alt Mode video,
      passes USB 3.1 Gen 2 video/audio, and supplies up to 91 W PD to the laptop. Label from the product-page
      front photo of the 100W unit (the 2024 datasheet photo says ''Full Function USB Type-C'').'
  - id: usb-c-2
    label: Power In
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    face: rear
    order: 1
    notes: Locking USB-C power input from the included WPS-USBC-100W supply, 20 V @ 5 A max.
  - id: usb-a-1
    label: Data
    connector: usb-a
    signals:
      - video
      - audio
      - usb
    direction: bidirectional
    face: rear
    order: 2
    notes: USB-A port for the room USB system (for example a USB camera/soundbar or a room hub); the application
      guide shows USB-A to Micro-B or USB-A to USB-C cables here. Passes USB video and two-way audio to
      the laptop. Blue (USB 3.x) receptacle in the photo.
  - id: hdmi-out-1
    label: HDMI Out
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 3
    notes: HDMI out of the laptop's DisplayPort Alt Mode video, up to 4K@60 4:4:4, HDCP 2.3 (HDCP from
      the 2024 datasheet). Audio on HDMI not explicitly stated.

gaps:
  - The mounting surface for the included ears is not stated.
  - The USB-A data port speed is not stated in the current datasheet.

notes:
  - 'Two versions exist: the current 100 W model (up to 91 W to the laptop) and an earlier 60 W USB-PDI.
    This file follows the 100 W datasheet.'
  - The name SCT-USB-100 in the house kit list does not appear in any SCT document.
  - The current datasheet could only be read through a summary; its download was blocked.
