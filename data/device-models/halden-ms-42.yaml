# Device model: Halden MS-42 VGA Matrix Switcher
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Halden
model: MS-42 VGA Matrix Switcher
class: av-switcher
summary: Demo data, a made-up model standing in for a 2008-era product. Four VGA inputs to two
  outputs with line audio, controlled over serial or the network.
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - rack
  - table
lifecycle:
  end_of_support: 2016-06-30
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: vga-in-1
    label: VGA in 1
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 1
  - id: vga-in-2
    label: VGA in 2
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 2
  - id: vga-in-3
    label: VGA in 3
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 3
  - id: vga-in-4
    label: VGA in 4
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 4
  - id: vga-out-1
    label: VGA out 1
    connector: vga
    signals:
      - video
    direction: out
    face: rear
    order: 5
  - id: vga-out-2
    label: VGA out 2
    connector: vga
    signals:
      - video
    direction: out
    face: rear
    order: 6
  - id: audio-in-1
    label: Audio in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 7
  - id: audio-out-1
    label: Audio out
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 8
  - id: serial-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 9
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 10
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 11
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
