# Device model: Kramer TP-583RXR
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: TP-583RXR

class: av-extender

summary: An extended-reach HDBaseT receiver that takes 4K60 4:4:4 HDR video, RS-232 and IR from a matching
  transmitter such as TP-583TXR and outputs HDMI plus the control signals.

dimensions_mm:
  width: 120
  height: 24
  depth: 72
  notes: Manual gives (W, D, H) 12cm x 7.2cm x 2.4cm per device; kramerav.com product page gives 12.00cm
    x 7.15cm x 2.44cm (W, D, H). Same enclosure as TP-583TXR.

weight_kg: 0.2

power:
  inputs:
    - type: dc
      port: power-in
      volts: 12V DC
      watts: 24
      supplied: true
      notes: External power adapter and power cord included; adapter rated 12V DC, 2A. No PoE or PoH stated
        for this model.
  consumption_w:
    typical: 7.2

mounting:
  - ceiling
  - rack
  - table

sources:
  - source: kramer-tp-583rxr-4k-hdr-hdmi-receiver-with
    provides: Specifications
  - source: kramer-tp-583txr-tp-583t-tp-583rxr-tp
    provides: Port labels, faces and panel layout
  - source: kramer-tp-583rxr-product-page-kramerav-com
    provides: Specifications

ports:
  - id: hdbaset-1
    label: LINE
    connector: rj45
    signals:
      - hdbaset
      - video
      - audio
      - rs232
      - ir
    direction: in
    face: rear
    order: 1
    notes: HDBaseT input from a transmitter (e.g. TP-583Txr/T, TP-580Txr/T). Carries HDMI video/audio,
      RS-232 and IR. No PoH stated.
  - id: hdmi-out-1
    label: HDMI OUT
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 2
    notes: Connect to an HDMI acceptor.
  - id: rs232-1
    label: RS-232 (G Rx Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 3
    notes: 3-pin terminal block; connects to the serially controlled device (e.g. display).
  - id: ir-1
    label: IR
    connector: 3.5mm
    signals:
      - ir
    direction: bidirectional
    face: rear
    order: 4
    notes: Connect to an external IR emitter or sensor; IR extension is bidirectional.
  - id: power-in
    label: 12V DC
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 5
    notes: 12V DC input from the included adapter.

gaps:
  - No PoE mentioned; adapter powered.

notes:
  - 'Weight: the manual gives 0.2 kg net; the product page about 0.3 kg.'
  - The manual also covers the shorter-reach TP-583R; this is the extended-reach XR model.
