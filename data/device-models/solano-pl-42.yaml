# Device model: Solano PL-42 Plasma Display
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Solano
model: PL-42 Plasma Display
class: display
summary: Demo data, a made-up model standing in for a 2004-era product. Forty-two inch plasma screen
  with VGA and component inputs.
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - wall
  - freestanding
lifecycle:
  end_of_support: 2013-06-30
security_support:
  firmware_line: Solano firmware
  ends: { date: "2013-06", demo: true }
  vulnerability_contact: { url: "https://solano.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: vga-in-1
    label: VGA in
    connector: vga
    signals:
      - video
    direction: in
    face: rear
    order: 1
  - id: component-in-1
    label: Component in
    connector: proprietary
    signals:
      - video
    direction: in
    face: rear
    order: 2
  - id: audio-in-1
    label: Audio in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 3
  - id: serial-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 4
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 5
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
