# Device model: Poly TC10
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: TC10

part_numbers:
  - number: 875K5AA
    notes: Black. Region suffix variants exist (e.g. 875K5AA#ABA)
  - number: 875J5AA
    notes: White variant, listed as an accessory in the HP spec sheet; not separately extracted

class: touch-controller

summary: 10.1-inch PoE-powered touch panel that works as a room controller paired with a Poly video system
  or as a standalone room scheduler, with a single RJ-45 for power and data and included wall and table
  mounts.

dimensions_mm:
  width: 260
  height: 64
  depth: 184
  notes: 'HP spec sheet, labelled width x depth x height: 260 x 184 x 64 mm, as it sits on a table.'

weight_kg: 1.27

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3at
        class: 0
      notes: Printed as "IEEE 802.3at class 0"; class 0 is the unclassified default.

mounting:
  - wall
  - table

sources:
  - source: poly-tc10-touch-controller-black-875k5aa-hp
    provides: Dimensions, weight, power and interfaces
  - source: poly-tc10-touch-controller-black-hp-datasheet
    provides: Dimensions, weight, power and interfaces
  - source: poly-tc10-user-guide-6-4-0
    provides: Port labels, faces and panel layout
  - source: poly-tc10-admin-guide-6-5-0
    provides: Port labels, faces and panel layout

ports:
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3at
      class: 0
    face: bottom
    order: 1
    notes: The only connector. Sits in the recess on the underside, next to the factory-restore pinhole,
      per the bottom-view drawing.

gaps:
  - No power draw in watts.

notes:
  - HP prints the PoE requirement as "802.3at class 0"; class 0 is the unclassified default.
  - HP gives 1.27 kg for the device but 300 g for the package, which cannot both be right. 1.27 kg may
    include the wall kit and table stand, both in the box.
  - Also mounts on glass with a separate kit. A white version is part 875J5AA.
