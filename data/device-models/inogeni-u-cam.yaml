# Device model: INOGENI U-CAM
# Facts from the vendor's public documentation (one reading, spot-checked against the source).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: INOGENI

model: U-CAM

part_numbers:
  - number: U-CAM
    notes: Model name printed on the case and in all INOGENI documents. No separate alphanumeric part
      number is given by INOGENI; UPC 040232609015 (sales sheet). Reseller SKU 'IGUCAM1' (Adorama) not
      confirmed by INOGENI.

class: adapter

summary: Small metal box that converts a USB camera's video and audio to HDMI (up to 4K30) for codecs,
  matrices and displays, with a USB 2.0 loop-out and IP/RS-232 control.

dimensions_mm:
  width: 70
  height: 23
  depth: 83
  notes: Vendor gives W x L x H = 70 x 83 x 23 mm; L taken as depth (the connector ends are on the 70
    mm faces). The longest horizontal side (83 mm) is therefore depth, not width, following the vendor's
    axes.

weight_kg: 0.136

power:
  inputs:
    - type: dc
      port: power-in
      volts: 12V DC
      supplied: true
      notes: External supply 100-240 VAC 50/60 Hz to 12V/1.2A DC with AUS, EUR, UK and US plug adapters
        included.
  consumption_w:
    max: 14.4

sources:
  - source: inogeni-u-cam-user-guide-v1-9
    provides: Port labels, faces and panel layout
  - source: inogeni-u-cam-sales-sheet-2025-01
    provides: Dimensions, weight, power and interfaces
  - source: inogeni-u-cam-product-page
    provides: Specifications

ports:
  - id: usb-a-1
    label: USB 3.0 1
    connector: usb-a
    signals:
      - video
      - audio
      - usb
    direction: bidirectional
    order: 1
    notes: 'Input end panel (callouts 1-4). USB input #1 (blue USB 3.0 Type-A in the drawing). Camera
      video is captured from this input. USB bus power up to 1.2 A shared between the two inputs.'
  - id: usb-a-2
    label: USB 3.0 2
    connector: usb-a
    signals:
      - audio
      - video
      - usb
    direction: bidirectional
    order: 2
    notes: 'Input end panel (callouts 1-4). USB input #2 (blue USB 3.0 Type-A in the drawing). Used for
      audio when camera and audio device are separate. Shares 1.2 A USB power with input #1.'
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    order: 3
    notes: Input end panel (callouts 1-4). IP control, 100 Mbps half-duplex, autonegotiation not supported,
      DHCP or static.
  - id: usb-b-1
    label: USB 2.0 AUX
    connector: usb-b
    signals:
      - video
      - audio
      - usb
    direction: bidirectional
    order: 4
    notes: 'Input end panel (callouts 1-4). USB 2.0 Type-B output to a host: UVC up to 1080p30 MJPEG,
      UAC audio I/O, PTZ control, and CDC-NCM control. Label text on the case is partly legible (''USB
      2.0 AUX'').'
  - id: hdmi-out-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    order: 1
    notes: Output end panel (callouts 5-7), opposite the input end. Up to 3840x2160p23.98-30, 1080p50/60,
      720p50/60, embedded audio from the USB source. Product page calls it HDMI 1.4.
  - id: rs232-1
    label: TX GND RX
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    order: 2
    notes: 'Output end panel (callouts 5-7), opposite the input end. Green pluggable terminal block for
      RS-232 control: 9600 baud, 8 data bits, 1 stop bit, no parity, no flow control.'
  - id: power-in
    label: 12VDC
    connector: dc-barrel
    signals:
      - power
    direction: in
    order: 3
    notes: Output end panel (callouts 5-7), opposite the input end. +12V DC input from the included 100-240
      VAC to 12V/1.2A supply. Barrel jack as drawn.

gaps:
  - The two ends are not called front or rear. Inputs (USB, LAN, USB-B) are on one end; HDMI, RS-232 and
    power on the other.
  - No mounting options stated.
  - 'Which face of the device each port is on is not shown: usb-a-1, usb-a-2, lan-1, usb-b-1, hdmi-out-1,
    rs232-1 and power-in have no face. The user guide (v1.9, page 3, Device Interfaces) draws the two
    end panels side by side and never calls either end front or rear, left or right, so no face is set.
    The order along each end was checked against that figure and matches.'

notes:
  - INOGENI sells one U-CAM; there is no U-CAM Pro.
  - 'Weight: user guide 136 g, sales sheet 140 g.'
  - The RS-232 block is drawn with 3 pins; the pinout lists 4 (the fourth is 5 V for INOGENI's remote).
