# Device model: Kestrel VC-300 Room Codec
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Kestrel
model: VC-300 Room Codec
class: codec
summary: "Demo data, a made-up model standing in for a 2002-era product. Standard-definition room
  video system on an IP network: analogue camera and display connections, one line input and output,
  and a serial port for control."
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - table
  - rack
lifecycle:
  end_of_support: 2012-06-30
security_support:
  firmware_line: Kestrel firmware
  ends: { date: "2012-06", demo: true }
  vulnerability_contact: { url: "https://kestrel.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: camera-in-1
    label: Camera (S-video)
    connector: proprietary
    signals:
      - video
    direction: in
    face: rear
    order: 1
  - id: video-out-1
    label: Video out (composite)
    connector: proprietary
    signals:
      - video
    direction: out
    face: rear
    order: 2
  - id: vga-out-1
    label: VGA out
    connector: vga
    signals:
      - video
    direction: out
    face: rear
    order: 3
  - id: audio-in-1
    label: Audio in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 4
  - id: audio-out-1
    label: Audio out
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 5
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 6
  - id: serial-1
    label: Control (RS-232)
    connector: db9
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 7
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 8
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
