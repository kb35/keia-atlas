# Device model: Halden TP-7 Touch Panel
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Halden
model: TP-7 Touch Panel
class: touch-controller
summary: Demo data, a made-up model standing in for a 2010-era product. Seven-inch wall or table
  touch panel that runs a room control program, powered over Ethernet.
power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3af
        class: 3
mounting:
  - table
  - wall
lifecycle:
  end_of_support: 2018-06-30
security_support:
  firmware_line: Halden firmware
  ends: { date: "2018-06", demo: true }
  vulnerability_contact: { url: "https://halden.example/security", demo: true }
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: lan-1
    label: LAN (PoE)
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3af
      class: 3
    face: rear
    order: 1
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
