# Device model: Dell UltraSharp 34 Curved Thunderbolt Hub Monitor (U3425WE)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Dell

model: UltraSharp 34 Curved Thunderbolt Hub Monitor (U3425WE)

part_numbers:
  - number: U3425WEb
    notes: regulatory model number, from user's guide cover page

class: monitor

summary: 34.1-inch curved (1900R) UWQHD (3440x1440) IPS Thunderbolt 4 hub monitor with 90W upstream power
  delivery, a 15W Thunderbolt daisy-chain downstream port, USB-C/USB-A hub ports, 2.5GbE RJ45, and a height/tilt/swivel
  stand with VESA mount.

dimensions_mm:
  width: 813.5
  height: 359.2
  depth: 105.1
  notes: 'Body without stand. With stand: height 392.8-542.8 mm (compressed-extended), width 813.5 mm,
    depth 240.4 mm.'

weight_kg: 7.78

power:
  inputs:
    - type: ac
      volts: 100-240 VAC, 50/60 Hz +/-3 Hz
      supplied: true
      notes: 'Detachable IEC-style power cable; exact connector type not stated. Connects at: power connector
        (bottom panel).'
  consumption_w:
    typical: 31.5
    max: 250

client_os:
  - macos
  - windows

mounting:
  - table
  - wall
  - vesa

sources:
  - source: dell-ultrasharp-34-curved-thunderbolt-hub-monitor
    provides: Port labels, faces and panel layout
  - source: dell-ultrasharp-34-curved-thunderbolt-hub-monitor-2
    provides: Dimensions, weight, power and interfaces
  - source: dell-ultrasharp-34-curved-thunderbolt-hub-monitor-3
    provides: Port labels, faces and panel layout

ports:
  - id: power-in
    connector: not-stated
    signals:
      - power
    direction: in
    face: bottom
    order: 1
    notes: Detachable AC power cable; connector type not named.
  - id: hdmi-in-1
    label: HDMI
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 2
    notes: HDCP 1.4 & 2.2, up to WQHD 3440x1440 100Hz TMDS
  - id: displayport-in-1
    label: DisplayPort
    connector: displayport
    signals:
      - video
      - audio
    direction: in
    face: bottom
    order: 3
    notes: DP 1.4, HBR3
  - id: usb-c-1
    label: Thunderbolt 4 downstream (daisy chain)
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 4
    notes: For daisy-chaining to a second monitor/Thunderbolt device; PD up to 15W typical; video-out
      only, source says 'USB ports' list places this port on the rear (distinct from the general 'Bottom
      view' diagram heading).
  - id: usb-c-2
    label: Thunderbolt 4 upstream
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 90
    face: bottom
    order: 5
    notes: Host upstream, DP1.4 Alt Mode, PD up to 90W (20V/4.5A/15V/3A/9V/3A/5V/3A)
  - id: usb-c-3
    label: USB-C upstream (data only)
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: bottom
    order: 6
    notes: SuperSpeed USB 10Gbps (USB 3.2 Gen2), data only, no video/power
  - id: usb-a-1
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    usb_power_w: 4.5
    face: bottom
    order: 7
    notes: One of 4 rear-mounted SuperSpeed USB-A downstream ports; standard max power 4.5W per USB spec
      table.
  - id: usb-a-2
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    usb_power_w: 4.5
    face: bottom
    order: 8
    notes: See usb-a-1 note.
  - id: usb-a-3
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    usb_power_w: 4.5
    face: bottom
    order: 9
    notes: See usb-a-1 note.
  - id: usb-a-4
    label: USB-A downstream
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    usb_power_w: 4.5
    face: bottom
    order: 10
    notes: See usb-a-1 note.
  - id: audio-out-1
    label: Audio line-out
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: bottom
    order: 11
    notes: Does not support headphones. Jack size (3.5mm) inferred.
  - id: lan-1
    label: RJ45
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: bottom
    order: 12
    notes: Supports Ethernet 10/100/1000/2500 Mbps (2.5GbE); requires host USB-C/Thunderbolt connection
      to pass through
  - id: usb-a-5
    label: USB-A downstream (BC1.2)
    connector: usb-a
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 10
    face: bottom
    order: 13
    notes: Quick-access port with battery icon; up to 2A fast-charging if device is BC1.2 compatible (~10W
      at 5V)
  - id: usb-c-4
    label: USB-C downstream
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 14
    notes: Quick-access downstream port, one of 2 identical ports at this position, 15W charging, no video.
  - id: usb-c-5
    label: USB-C downstream
    connector: usb-c
    signals:
      - usb
      - power
    direction: bidirectional
    usb_power_w: 15
    face: bottom
    order: 15
    notes: See usb-c-4 note; second of the 2 identical quick-access USB-C downstream ports.

gaps:
  - Linux is not listed in Dell's operating system compatibility section.
  - The mains inlet type is not named.

notes:
  - Dell lists Windows 10 and later, and macOS 12 and 13.
