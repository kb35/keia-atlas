# Device model: Lumen MFP-4200 Multifunction Printer
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Lumen
model: MFP-4200 Multifunction Printer
class: printer
summary: Demo data, a made-up model standing in for a 2013-era product. Floor-standing printer,
  copier and scanner on the network.
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - freestanding
lifecycle:
  end_of_support: 2022-06-30
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
  - id: lan-1
    label: LAN
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 1
  - id: usb-b-1
    label: USB
    connector: usb-b
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 2
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 3
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
