# Device model: Kramer PA-240Z
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: PA-240Z

part_numbers:
  - number: PA-240Z
    notes: Manual P/N 2900-300802 Rev 6, shared with the PA-120Z (120W) sibling.

class: amplifier

summary: A half-rack Class D power amplifier giving 1x240W into a 70V/100V line or 2x120W into 4/8 ohm,
  with per-output mix/EQ/HPF processing, balanced line out, and RS-232/IP control.

dimensions_mm:
  width: 214.6
  height: 43.6
  depth: 163.0
  notes: Product page gives 21.46cm x 16.30cm x 4.36cm (W, D, H); manual Rev 6 rounds to 21.5cm x 16.3cm
    x 4.4cm. 1/2 19in 1U enclosure.

weight_kg: 0.9

power:
  inputs:
    - type: ac
      port: power-in
      volts: 85-265V AC
      supplied: true
      notes: Internal universal supply via fused AC inlet with power switch; power cord included. Consumption
        stated as 265VA (apparent power, not watts). Full power at 120V to 230V.

mounting:
  - rack

sources:
  - source: kramer-pa-240z-power-amplifier-1x240w-70v-100v
    provides: Specifications
  - source: kramer-pa-120z-pa-240z-user-manual-p
    provides: Port labels, faces and panel layout
  - source: kramer-pa-120z-pa-240z-quick-start-guide
    provides: Port labels, faces and panel layout
  - source: kramer-pa-240z-product-page-kramerav-com
    provides: Specifications

ports:
  - id: audio-in-1
    label: AUDIO IN 1
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 1
    notes: Unbalanced stereo audio input.
  - id: audio-in-2
    label: AUDIO IN 2 (L+ L- G R+ R-)
    connector: terminal-block
    signals:
      - audio
    direction: in
    face: rear
    order: 2
    notes: 5-pin balanced stereo line-level input, up to +4dBu/10kOhm.
  - id: audio-out-1
    label: LINE OUT (L+ L- G R+ R-)
    connector: terminal-block
    signals:
      - audio
    direction: out
    face: rear
    order: 3
    notes: 5-pin balanced stereo line-level output (e.g. to powered speakers).
  - id: lan-1
    label: ETHERNET
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 4
    notes: LAN for IP control and embedded web pages. Under the REMOTE group label.
  - id: rs232-1
    label: RS-232 (G Rx Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 5
    notes: 3-pin RS-232 control port. Under the REMOTE group label.
  - id: speaker-out-1
    label: LO-Z OUT (L+ L- R+ R-) / HI-Z OUT (Hi-Z, COM)
    connector: terminal-block
    signals:
      - speaker-level
    direction: out
    face: rear
    order: 6
    notes: '4-pin large terminal block. Lo-Z: stereo 2x120W into 4/8 ohm (L+ L-, R+ R-). Hi-Z: mono 1x240W
      70V/100V using Hi-Z and COM pins. Mode set by adjacent DIP switches.'
  - id: power-in
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 7
    notes: Fused AC mains inlet; separate POWER rocker switch to its right. Connector type inferred from
      the 3-pin inlet in the drawing; manual says only 'AC connector'.

gaps:
  - Consumption is given only as 265 VA.
  - The mains inlet type is read from the drawing, not named in text.

notes:
  - Kramer describes EQ, filters and input mixing rather than a full DSP.
  - Half-rack width, 1U; two fit side by side with the RK-1 adapter.
