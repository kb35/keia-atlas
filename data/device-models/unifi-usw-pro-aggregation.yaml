gaps:
  - No typical power draw is given, only the maximum.
  - No end-of-sale or end-of-support dates are published.
  - The drawings show no serial console port; the spec table lists management over Ethernet and AR and does
    not say either way.
  - Whether two can be paired for redundancy (MC-LAG or stacking) is not stated on the spec page.
notes:
  - SFP+ 1 to 28 sit in 14 columns, odd numbers on top; SFP28 29 to 32 in two columns at the right, then the
    reset button.
  - Needs UniFi Network 6.1.25 or later. Four fans at the back.
