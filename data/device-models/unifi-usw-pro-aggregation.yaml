# Device model: Ubiquiti UniFi Switch Pro Aggregation (USW-Pro-Aggregation)
# Facts from Ubiquiti's public tech specs page (checked 29 Sept 2026), read twice: the spec table, and
# separately the vendor's labelled front, rear and dimension drawings on the same page. Where the two
# differ it is noted. Anything neither states is left out and listed under gaps.

manufacturer: Ubiquiti
model: UniFi Switch Pro Aggregation
part_numbers:
  - number: USW-Pro-Aggregation
    notes: The vendor store calls it Switch Hi-Capacity Aggregation.
class: network-switch
summary: A 1U Layer 3 aggregation switch with 28 10G SFP+ ports and four 25G SFP28 ports, a 1.3-inch
  touchscreen, and no PoE.
dimensions_mm:
  width: 442
  height: 44
  depth: 325
  notes: "Spec table: 442 x 325 x 44 mm. The vendor dimension drawing gives the same."
weight_kg: 4.6
power:
  inputs:
    - type: ac
      port: power-in
      volts: 100–240V AC
      supplied: true
      notes: Internal AC/DC supply, 100 W.
    - type: dc
      port: rps-in
      supplied: false
      notes: DC power backup from a UniFi RPS, bought separately.
  consumption_w:
    max: 100
  notes: "Heat: 341 BTU/hr. Switching capacity 760 Gbps."
mounting:
  - rack
security_support:
  firmware_line: UniFi device firmware
  ends: { date: "2029-09", demo: true }
  vulnerability_contact: { url: "https://www.ui.com/support/security-rewards/about/", source: ubiquiti-security-rewards }
sources:
  - source: unifi-usw-pro-aggregation-tech-specs
    provides: Ports, power, size and weight (spec table)
  - source: unifi-usw-pro-aggregation-panel-drawing
    provides: Port numbers, rows, faces and order; touchscreen, reset button, AC inlet and RPS input
  - source: unifi-usw-pro-aggregation-dimension-drawing
    provides: Size, checked against the spec table
