# Device model: Cisco Catalyst 9200L-48P-4G (C9200L-48P-4G)
# The switch the UniFi pilot at Dublin's comms room 4.21 replaced. It is an outgoing model: two units are waiting to
# be collected, so it is here for the records, not as a choice. Facts from Cisco's Catalyst 9200 Series data sheet
# (the rack equipment record cisco-c9200l-48p-4g cites the same page). Anything the data sheet does not state for
# this model is left out and listed under gaps.

manufacturer: Cisco
model: Catalyst 9200L-48P-4G
part_numbers:
  - number: C9200L-48P-4G
class: network-switch
summary: "A 1U, 48-port Layer 3 access switch with PoE+ on every port (740 W with one supply) and four 1G uplink
  ports. A shallower chassis than the Catalyst 9300, common in floor comms rooms."
dimensions_mm:
  width: 445
  height: 44
  depth: 288
  notes: "Chassis only; 329 mm with the fans and front panel."
weight_kg: 4.8
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
      notes: "Default supply PWR-C5-1KWAC (1000 W); a second identical supply raises the PoE budget to 1440 W."
  poe_budget_w: 740
mounting:
  - rack
sources:
  - source: cisco-catalyst-9200-data-sheet
    provides: Ports, PoE budget, size, weight and power supply
