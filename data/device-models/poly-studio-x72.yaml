# Device model: Poly Studio X72
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio X72

part_numbers:
  - number: A4LZ8AA
    notes: Region/warranty suffix appended (e.g. A4LZ8AA#ABA)

class: video-bar

summary: All-in-one 4K PoE-free video bar for large rooms with dual 20MP cameras (70 degree and 120 degree
  FOV), two-way stereo speakers and a microphone array, dual HDMI outputs plus one HDMI input, USB-C/USB-A
  device-mode ports, 3.5mm line in/out, an expansion microphone input, and an external auto-sensing AC
  power supply.

dimensions_mm:
  width: 840.18
  height: 117.93
  depth: 135.4
  notes: 'HP spec sheet, labelled width x depth x height: 840.18 x 135.4 x 117.93 mm.'

weight_kg: 3.3

power:
  inputs:
    - type: dc
      port: power-in
      volts: 12V DC
      watts: 60
      supplied: true
      notes: External 60 W adapter, 100-240 V AC input. No PoE.

mounting:
  - wall
  - vesa
  - table

sources:
  - source: poly-studio-x72-all-in-one-video
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-x72-user-guide
    provides: Port labels, faces and panel layout
  - source: poly-productsheet-poly-studio-x72-all-in-one
    provides: Specifications
  - source: poly-studio-x72-with-wall-mount-quick
    provides: Port labels, faces and panel layout
  - source: poly-video-mode-administrator-guide-4-4
    provides: Port labels, faces and panel layout

ports:
  - id: hdmi-out-2
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 1
    notes: HDMI 2.0, secondary monitor output, 4K@30Hz.
  - id: hdmi-out-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 2
    notes: HDMI 2.0, primary monitor output, 4K@30Hz.
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 3
    notes: HDMI 1.4, video and audio, 4K@30Hz; for content sharing/Device Mode, or an additional HDMI
      people camera.
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 4
    notes: One of two USB-A (5Gbps signaling) ports.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 5
    notes: Second of two USB-A ports; both shown under one reference number in the panel diagram so exact
      left/right order within the pair is not distinguishable.
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 6
    notes: USB-C, 5Gbps signaling, for Device Mode only; can also drive a third display via a sold-separately
      USB adapter.
  - id: audio-in-1
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 7
    notes: 3.5 mm line-level audio input.
  - id: audio-out-1
    connector: 3.5mm
    signals:
      - audio
    direction: out
    face: rear
    order: 8
    notes: 3.5 mm line-level audio output.
  - id: mic-1
    connector: proprietary
    signals:
      - microphone
    direction: in
    face: rear
    order: 9
    notes: Expansion (table) microphone connection; datasheet lists this as '1 line in (optional microphone)'.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 10
    notes: 10/100/1G Ethernet, Auto-MDIX, main system network connection. No PoE documented for this port.
  - id: lan-2
    connector: rj45
    signals:
      - ethernet
    direction: bidirectional
    face: rear
    order: 11
    notes: Link-local network (LLN) connection for IP-based Poly peripherals (e.g. additional cameras/mics);
      per the user guide this was 'supported in a future Poly VideoOS release' as of this document's printing,
      i.e. present in hardware but may not be functional on all firmware versions.
  - id: power-in
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 12
    notes: Labeled 'Power cord port' in the user guide; connector type inferred as a barrel DC jack from
      the panel icon since the device is powered via an external AC adapter, not stated explicitly in
      text.

gaps:
  - No power draw in watts; the datasheet gives heat output (65 BTU/h, about 19 W) and the adapter rating.
  - No USB charging output stated.
  - The left-right order of the two USB-A ports is not shown.

notes:
  - The second RJ45 (for Poly IP accessories) was marked for a future software release when the user guide
    was written.
  - Mounting accessories are sold under the older Studio X70 names.
  - The datasheet came from a reseller-hosted copy of the HP document.
