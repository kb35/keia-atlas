gaps:
  - Which IEEE 802.3bt type the PoE++ ports (25 to 32, 41 to 48) follow is not stated; the vendor gives 64 W a
    port.
  - No per-port PoE class is given, only the per-port maximum and the 720 W total.
  - No typical power draw is given, only the maximum.
  - No end-of-sale or end-of-support dates are published.
  - The drawings show no serial console port; the spec table lists management over Ethernet and AR (the
    touchscreen) and does not say either way.
notes:
  - "Ports are in three blocks of 16 across the front, odd numbers on the top row: 1 to 24 are Gigabit PoE+,
    25 to 32 Gigabit PoE++, 33 to 40 2.5 GbE PoE+, 41 to 48 2.5 GbE PoE++, then SFP+ 49 to 52."
  - "Etherlighting: the RJ45 ports light up to show port location, speed or link, and native VLAN or network."
  - Needs UniFi Network 8.0.24 or later. Four fans at the back.
