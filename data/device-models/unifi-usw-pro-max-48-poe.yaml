# Device model: Ubiquiti UniFi Switch Pro Max 48 PoE (USW-Pro-Max-48-PoE)
# Facts from Ubiquiti's public tech specs page (checked 29 Sept 2026), read twice: the spec table, and
# separately the vendor's labelled front, rear and dimension drawings on the same page. Where the two
# differ it is noted. Anything neither states is left out and listed under gaps.

manufacturer: Ubiquiti
model: UniFi Switch Pro Max 48 PoE
part_numbers:
  - number: USW-Pro-Max-48-PoE
class: network-switch
summary: "A 1U, 48-port Layer 3 access switch: 32 Gigabit and 16 2.5 GbE RJ45 ports, all with PoE (32 PoE+, 16
  PoE++), four 10G SFP+ uplinks, 720 W of PoE, a 1.3-inch touchscreen and Etherlighting port lights."
dimensions_mm:
  width: 442.4
  height: 44
  depth: 400
  notes: "Spec table: 442.4 x 400 x 44 mm. The vendor dimension drawing gives 442.4 x 399.6 x 43.7 mm."
weight_kg: 6.2
power:
  inputs:
    - type: ac
      port: power-in
      volts: 100–240V AC
      supplied: true
      notes: Internal AC/DC supply, 870 W.
    - type: dc
      port: rps-in
      supplied: false
      notes: DC power backup from a UniFi RPS, bought separately.
  consumption_w:
    max: 820
  poe_budget_w: 720
  notes: "Maximum consumption is 100 W without PoE output and 820 W with it. Heat: 341.2 BTU/hr without PoE output."
mounting:
  - rack
security_support:
  firmware_line: UniFi device firmware
  ends: { date: "2031-06", demo: true }
  vulnerability_contact: { url: "https://www.ui.com/support/security-rewards/about/", source: ubiquiti-security-rewards }
sources:
  - source: unifi-usw-pro-max-48-poe-tech-specs
    provides: Ports, PoE, power, size and weight (spec table)
  - source: unifi-usw-pro-max-48-poe-panel-drawing
    provides: Port numbers, rows, faces and order; touchscreen, reset button, AC inlet and RPS input
  - source: unifi-usw-pro-max-48-poe-dimension-drawing
    provides: Size, checked against the spec table
