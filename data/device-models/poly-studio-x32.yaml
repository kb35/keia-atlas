# Device model: Poly Studio X32
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio X32

part_numbers:
  - number: A3SV5AA
    notes: 'Region/warranty suffix appended, e.g. A3SV5AA#ABA (US); other suffixes seen: #ABG, #UUF per
      datasheet UPC list'

class: video-bar

summary: All-in-one 4K PoE++ video bar for small rooms with a built-in camera, speakers and microphone
  array, dual HDMI outputs, one HDMI input, USB-C/USB-A, and an Ethernet/PoE++ port; mounts via included
  display clamp or optional wall/VESA/table accessories.

dimensions_mm:
  width: 576.8
  height: 74.8
  depth: 66.1
  notes: 'HP spec sheet, labelled width x depth x height: 576.8 x 66.1 x 74.8 mm.'

weight_kg: 1.14

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3bt-type3
        class: 6
      notes: PoE only; the user guide asks for PoE++ (65 W). Datasheet states class 6.

mounting:
  - display-mount
  - wall
  - vesa
  - table

security_support:
  firmware_line: poly-videoos
  ends: { date: "2032-12", demo: true }
  vulnerability_contact: { url: "https://enable.hp.com/potentialsecurityvulnerability-report", source: hp-report-vulnerability }
sources:
  - source: poly-studio-x32-all-in-one-video
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-x32-user-guide
    provides: Port labels, faces and panel layout
  - source: poly-studio-x32-a3sv5aa-spec-sheet
    provides: Specifications

ports:
  - id: usb-a-1
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 1
    notes: One of two USB Type-A ports for accessories, 5Gbps signaling rate.
  - id: usb-a-2
    connector: usb-a
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 2
    notes: Second of two USB Type-A ports for accessories; panel diagram shows both under a single reference
      number so exact left/right order between the pair is not distinguishable from the source.
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 3
    notes: For Poly Device Mode (USB passthrough to a connected PC); 5Gbps signaling rate per datasheet.
  - id: lan-1
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3bt-type3
      class: 6
    face: rear
    order: 4
    notes: 10/100/1000 Mbps Ethernet, also carries PoE++ system power.
  - id: hdmi-out-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 5
    notes: HDMI 2.0, primary display output.
  - id: hdmi-out-2
    connector: hdmi
    signals:
      - video
      - audio
    direction: out
    face: rear
    order: 6
    notes: HDMI 2.0, secondary display output.
  - id: hdmi-in-1
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 7
    notes: HDMI 1.4, video and audio, for Device Mode and content sharing.

gaps:
  - No power draw in watts; the datasheet gives only heat output (55 BTU/h, about 16 W).
  - The left-right order of the two USB-A ports is not shown; they share one callout in the panel drawing.

notes:
  - Runs on PoE only. The user guide asks for PoE++ (65 W); in huddle room builds a Poly PoE++ injector supplies
    it.
  - The datasheet came from a reseller-hosted copy of the HP document; hp.com would not load.
