# Device model: Apple Studio Display (2026)
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Apple

model: Studio Display (2026)

part_numbers:
  - number: A3350
    notes: Model identifier seen only on third-party site EveryMac.com; not found on Apple's own tech-specs
      pages, so unconfirmed against the vendor.

class: monitor

summary: Apple's 27-inch 5K Retina desktop monitor refreshed in 2026 with Thunderbolt 5 host/downstream
  ports, offered with a choice of tilt-only stand, tilt-and-height stand, or a VESA mount adapter.

dimensions_mm:
  width: 623
  height: 362
  depth: 31
  notes: 'Figures are for the ''VESA Mount Adapter'' variant (display body plus thin VESA bracket, no
    stand), converted from Apple''s cm figures (cm x 10, exact). Apple also gives two stand variants:
    with tilt-adjustable stand 623 x 478 x 168 mm; with tilt-and-height-adjustable stand, width 623mm,
    depth 207mm, height adjustable 479-583mm (bottom to top position). Source gave Height/Width/Depth
    already labelled as such.'

weight_kg: 5.4

power:
  inputs:
    - type: ac
      volts: 100-240V AC
      notes: Built-in power supply.

client_os:
  - macos

mounting:
  - table
  - vesa

sources:
  - source: apple-studio-display-2026-tech-specs
    provides: Specifications
  - source: apple-studio-display-technical-specifications
    provides: Specifications, and the back-view photo showing the port positions and the upstream Thunderbolt marker

ports:
  - id: usb-c-1
    connector: usb-c
    signals:
      - usb
      - video
      - power
    direction: bidirectional
    usb_power_w: 96
    face: rear
    order: 4
    notes: Upstream/host Thunderbolt 5 port (up to 120Gb/s); delivers up to 96W host charging to the connected
      Mac. Rightmost port in Apple's back-view photo, the one marked with a dot, which Apple's spec text
      ties to the upstream port.
  - id: usb-c-2
    connector: usb-c
    signals:
      - usb
      - video
    direction: bidirectional
    face: rear
    order: 3
    notes: Downstream Thunderbolt 5 port, for accessories or daisy-chaining additional displays; charging
      wattage to downstream devices not stated.
  - id: usb-c-3
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 1
    notes: USB-C port, up to 10Gb/s, for peripherals/storage/networking; power delivery wattage not stated.
      Apple's photo shows two plain USB-C ports at the left of the four; it does not say which is which,
      so this one is ranked first and usb-c-4 second by choice.
  - id: usb-c-4
    connector: usb-c
    signals:
      - usb
    direction: bidirectional
    face: rear
    order: 2
    notes: Second USB-C port, up to 10Gb/s (same spec text as usb-c-3, Apple does not distinguish the
      two individually). Second of the two plain USB-C ports from the left in Apple's back-view photo.

gaps:
  - No power draw published.
  - Apple documents no power socket, only the mains voltage.
  - Apple's back-view photo does not say which of the two plain USB-C ports is usb-c-3 and which is usb-c-4,
    since Apple gives them the same description; their ranks (1 and 2) are a choice, not a fact.
  - Apple's photo shows the port order but no labels, so the downstream Thunderbolt 5 port (usb-c-2, third
    from the left) is placed because it is the only Thunderbolt 5 port that is not marked as upstream.

notes:
  - Apple lists compatibility with Mac and iPad only.
  - The upstream Thunderbolt 5 port charges the laptop at up to 96 W.
  - 'No network port: a wired connection needs an adapter or dock.'
  - Size is the display with the VESA mount adapter; the stand versions are taller and deeper.
