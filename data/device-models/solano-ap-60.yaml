# Device model: Solano AP-60 Amplifier
# DEMO DATA. A made-up model that stands in for an older product, so the work plan can show a record back to 2000.
# Not a real product: nothing here comes from a vendor.

manufacturer: Solano
model: AP-60 Amplifier
class: amplifier
summary: Demo data, a made-up model standing in for a 2008-era product. Two-channel installation
  amplifier for ceiling or wall loudspeakers.
power:
  inputs:
    - type: ac
      port: power-in
      supplied: true
mounting:
  - rack
  - table
lifecycle:
  end_of_support: 2017-06-30
sources:
  - source: demo-legacy-catalogue
    provides: "Made-up model for the demo: connectors and era, no vendor figures"
ports:
