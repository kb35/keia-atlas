    label: Line in
    connector: 3.5mm
    signals:
      - audio
    direction: in
    face: rear
    order: 1
  - id: speaker-out-1
    label: Speaker out 1
    connector: terminal-block
    signals:
      - speaker-level
    direction: out
    face: rear
    order: 2
  - id: speaker-out-2
    label: Speaker out 2
    connector: terminal-block
    signals:
      - speaker-level
    direction: out
    face: rear
    order: 3
  - id: power-in
    label: Power
    connector: iec-c14
    signals:
      - power
    direction: in
    face: rear
    order: 4
gaps:
  - "Size, weight and power draw are not recorded: this is a stand-in, not a real product."
