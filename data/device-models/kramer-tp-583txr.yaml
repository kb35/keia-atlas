# Device model: Kramer TP-583TXR
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: TP-583TXR

class: av-extender

summary: A 4K60 4:4:4 HDR HDMI transmitter that extends HDMI, RS-232 and IR over a single HDBaseT (extended-reach)
  cable to a matching receiver such as TP-583RXR, up to 100m at 4K60.

dimensions_mm:
  width: 120
  height: 24
  depth: 72
  notes: User manual gives (W,D,H) 12cm x 7.2cm x 2.4cm; the kramerav.com product page gives 12.00cm x
    7.15cm x 2.44cm for the same axes - essentially identical, minor rounding difference only.

weight_kg: 0.2

power:
  inputs:
    - type: dc
      port: power-in
      volts: 12V DC
      watts: 24
      supplied: true
      notes: Included external power adapter; source 12V DC 2A. Unit consumption stated as 400mA typical
        (manual) / 480mA (in the combined TP-583T/R spec table).
  consumption_w:
    typical: 4.8

mounting:
  - ceiling
  - rack

sources:
  - source: kramer-tp-583txr-4k-hdr-hdmi-transmitter-with
    provides: Specifications
  - source: kramer-tp-583txr-tp-583t-tp-583rxr-tp
    provides: Port labels, faces and panel layout
  - source: kramer-tp-583txr-product-page-kramerav-com
    provides: Specifications

ports:
  - id: hdmi-in-1
    label: HDMI IN
    connector: hdmi
    signals:
      - video
      - audio
    direction: in
    face: rear
    order: 2
    notes: Connect to an HDMI source.
  - id: hdbaset-1
    label: LINE
    connector: rj45
    signals:
      - video
      - rs232
      - ir
      - hdbaset
    direction: out
    face: rear
    order: 1
    notes: Connects to the LINE RJ-45 HDBT connector on a receiver (e.g. TP-583RXR, TP-580RXR/R). No PoE
      stated for this model (external 12V adapter powers the unit).
  - id: rs232-1
    label: RS-232 (G, Rx, Tx)
    connector: terminal-block
    signals:
      - rs232
    direction: bidirectional
    face: rear
    order: 3
    notes: 3-pin terminal block; connects to a controller device to serially control a remote device connected
      to the receiver.
  - id: ir-1
    label: IR
    connector: 3.5mm
    signals:
      - ir
    direction: bidirectional
    face: rear
    order: 4
    notes: Connect to an external infrared emitter/sensor.
  - id: power-in
    label: 12V DC
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    order: 5
    notes: 12V DC connector for powering the unit.

gaps:
  - No PoE mentioned; adapter powered.

notes:
  - 'Weight: the manual gives 0.2 kg net; the product page about 0.3 kg.'
  - The manual gives 400 mA in one table and 480 mA in another (the second covers the non-XR model).
