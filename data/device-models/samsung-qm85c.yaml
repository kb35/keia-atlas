# Device model: Samsung QM85C (Crystal UHD Signage QMC, 85 inch)
# Facts from the vendor's public documentation, read twice (the spec table, then separately the manual or leaflet),
# reconciled. Anything the sources don't state, or where they disagree, is under gaps.

manufacturer: Samsung

model: "QM85C"

part_numbers:
  - { number: LH85QMCEBGCXEN, notes: "UK, Ireland and Germany" }
  - { number: LH85QMCEBGCXGO, notes: "United States" }

class: display

summary: "An 85 inch 4K commercial display rated for 24/7 use, 500 nits, Tizen 7.0, three HDMI inputs, DisplayPort, LAN, RS-232C and IR. The house display for large meeting rooms."

dimensions_mm:
  width: 1904.3
  height: 1085.3
  depth: 28.5
  notes: "Set without stand. Bezel 13.9 mm, even on all sides."

weight_kg: 41.9

power:
  inputs:
    - type: ac
      port: power-in
      volts: "100-240V AC"
      supplied: true
      notes: "The manual and leaflet say 100 to 240 V AC; the UK product page says 220 to 240 V AC. Check the rating plate for 110 V sites."
  consumption_w:
    typical: 237
    max: 330
  notes: "Typical and maximum from the leaflet; the EU fiche gives 231 W on-mode (SDR) and 0.5 W standby."

mounting:
  - wall
  - vesa

lifecycle:
  announced: "2023-06-13"

security_support:
  firmware_line: Samsung Tizen for signage
  ends: { date: "2028-12", demo: true }
  vulnerability_contact: { url: "https://security.samsungtv.com/", source: samsung-display-security }
sources:
  - source: samsung-qm85c-product-page
    provides: "Size, weight, VESA, power supply, panel, ports and 24/7 rating (spec table)"
  - source: samsung-qxc-leaflet
    provides: "Typical and maximum power, ports and panel figures, read separately to check the product page"
  - source: samsung-qmc-user-manual
    provides: "Rear panel ports, their labels and RS232C wiring"
  - source: samsung-qm85c-product-fiche
    provides: "On-mode and standby power"
  - source: samsung-qmc-quick-setup-guide
    provides: "What is in the box, EMC class A"
  - source: samsung-qmc-us-product-pages
    provides: "US part number"
  - source: samsung-qxc-launch-2023
    provides: "Announcement date and Tizen 7.0"

ports:
  - id: hdmi-in-1
    label: "HDMI IN 1"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    notes: "HDMI 2.0, HDCP 2.2."
  - id: hdmi-in-2
    label: "HDMI IN 2"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    notes: "HDMI 2.0, HDCP 2.2."
  - id: hdmi-in-3
    label: "HDMI IN 3 (ARC)"
    connector: "hdmi"
    signals: [video, audio]
    direction: in
    face: rear
    notes: "HDMI 2.0, HDCP 2.2, with audio return channel."
  - id: displayport-in-1
    label: "DP IN"
    connector: "displayport"
    signals: [video, audio]
    direction: in
    face: rear
    notes: "DisplayPort 1.2."
  - id: usb-a-1
    label: "USB 1"
    connector: "usb-a"
    signals: [usb, power]
    direction: bidirectional
    face: rear
    notes: "USB 2.0, 0.5 A."
  - id: usb-a-2
    label: "USB 2"
    connector: "usb-a"
    signals: [usb, power]
    direction: bidirectional
    face: rear
    notes: "USB 2.0, 1.0 A."
  - id: lan-1
    label: "RJ45"
    connector: "rj45"
    signals: [ethernet]
    direction: bidirectional
    face: rear
    notes: "10/100 Mb/s. Used for MDC control, SNMP and fleet management."
  - id: serial-1
    label: "RS232C IN"
    connector: "3.5mm"
    signals: [rs232]
    direction: in
    face: rear
    notes: "3.5 mm stereo jack, not DB9; the RS232C adapter in the box converts it to DB9. 9600 bps, 8N1."
  - id: serial-2
    label: "RS232C OUT"
    connector: "3.5mm"
    signals: [rs232]
    direction: out
    face: rear
    notes: "3.5 mm stereo jack, for daisy chaining MDC to another display."
  - id: ir-in-1
    label: "IR IN"
    connector: "not-stated"
    signals: [ir]
    direction: in
    face: rear
    notes: "For the external IR receiver cable; drawn as a round mini jack, size not stated."
  - id: audio-out-1
    label: "AUDIO OUT"
    connector: "3.5mm"
    signals: [audio]
    direction: out
    face: rear
  - id: power-in
    label: "Power"
    connector: "not-stated"
    signals: [power]
    direction: in
    face: rear
    notes: "Internal power supply, 100 to 240 V AC. The inlet type is not stated."

gaps:
  - "The power inlet type (C14 or C8) is not stated in any source read."
  - "The ports are drawn as one strip on the rear; their facing and order are not stated, so no order is recorded."
  - "The IR jack size is not stated."
  - "Sources disagree on the supply voltage (100 to 240 V against 220 to 240 V) and the energy class (G against not applicable); both are noted rather than chosen."
  - "The manual gives no factory defaults for the settings the configuration uses."

notes:
  - "VESA 600 x 400 mm, M8 screws, 12 to 14 mm deep."
  - "500 nits typical, 4,000:1, 25 percent haze, VA panel, 10 ms."
  - "Tizen 7.0, quad-core 1.7 GHz, 16 GB storage, Wi-Fi 5 and Bluetooth 5.0, 2 x 10 W speakers."
  - "EMC class A (the 65 inch is class B), per the quick setup guide."
  - "Operating conditions 0 to 40 degrees C, 10 to 80 percent humidity."
