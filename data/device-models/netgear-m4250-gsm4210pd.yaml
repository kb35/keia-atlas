gaps:
  - No per-port PoE class, only the 110 W total budget.
  - The DC socket type is not named.

notes:
  - The Hardware Installation Guide puts the Ethernet, SFP and console ports on the front of this desktop model and the USB, OOB and DC ports on the back. The datasheet's remark that the panel is reversible applies to the rackmount models.
  - The Hardware Installation Guide text names this model 'GSM4212PD' where it means GSM4210PD; the figures and model name are for M4250-9G1F-PoE+.
  - Draws up to 132.25 W at full PoE load, 9.88 W without PoE.
  - Fanless. Powered by an external 130 W adapter.
  - The Hardware Installation Guide back panel figure confirms the USB-A storage port on this model.
  - Usually configured by the network team rather than the AV team.
