class: network-switch

summary: Fanless desktop managed AV-over-IP switch with eight Gigabit PoE+ ports (110 W budget), one extra
  Gigabit port and one SFP, powered by an external adapter.

dimensions_mm:
  width: 210
  height: 40
  depth: 140
  notes: Switch only. Power adapter is 169 x 72 x 35.5 mm (W x D x H), 0.55 kg. The Hardware-at-a-Glance
    table writes the size as 210 x 40 x 140 mm (same values, different order).

weight_kg: 0.965

power:
  inputs:
    - type: dc
      port: power-in
      watts: 130
      supplied: true
      notes: 'External power adapter rated 130 W, fed by a standard AC power cord (C13). Adapter output
        voltage not stated. Consumption: Other figures for this model: 9.88 W all ports used with no PoE;
        6.4 W standby with no connections. No ''typical'' figure given.'
