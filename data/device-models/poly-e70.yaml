# Device model: Poly Studio E70
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Poly

model: Studio E70

part_numbers:
  - number: 842F8AA
    notes: HP/Poly product number

class: camera

summary: A dual-lens 4K smart conference camera (wide + narrow) with Poly DirectorAI framing and an electronic
  privacy shutter, connecting via USB-C or RJ-45 and powered by an external 12V adapter or PoE.

dimensions_mm:
  width: 321
  height: 89.1
  depth: 102
  notes: Datasheet, labelled width x depth x height (12.63 x 4.02 x 3.51 in). HP's dimension drawing can
    be read with height and depth the other way round (101.9 and 89.1 mm).

weight_kg: 0.907

power:
  inputs:
    - type: poe
      port: lan-1
      poe:
        role: powered
        standard: 802.3at
        class: 4
        watts: 30
      notes: 'User guide: a network port powering the camera must supply 30 W PoE+ class 4. HP''s spec
        page says 802.3af class 3 instead.'
    - type: dc
      port: power-in
      volts: 12V DC
      watts: 60
      supplied: true
      notes: External 60 W adapter on a 4.5 mm barrel.

mounting:
  - wall
  - vesa

security_support:
  firmware_line: Poly camera firmware (updated with its system)
  ends: { date: "2031-06", demo: true }
  vulnerability_contact: { url: "https://enable.hp.com/potentialsecurityvulnerability-report", source: hp-report-vulnerability }
sources:
  - source: poly-studio-e70-smart-camera-datasheet-hp
    provides: Dimensions, weight, power and interfaces
  - source: poly-studio-e70-smart-camera-hp-product
    provides: Specifications
  - source: poly-studio-e70-product-dimensions-engineering-drawing
    provides: Supporting details
  - source: poly-studio-e70-vesa-mount-875k7aa-hp
    provides: Specifications
  - source: poly-studio-e70-smart-camera-datasheet-hp-2
    provides: Dimensions, weight, power and interfaces
  - source: poly-video-mode-user-guide-g7500-studio
    provides: Port labels, faces and panel layout

ports:
  - id: usb-c-1
    label: USB Type-C
    connector: usb-c
    signals:
      - usb
      - video
    direction: bidirectional
    face: rear
    notes: USB-C port with 5Gbps signaling rate, used to connect the camera to a host computer or Poly
      system; USB Type-A to USB Type-C cable is included.
  - id: lan-1
    label: RJ-45
    connector: rj45
    signals:
      - ethernet
      - poe
    direction: bidirectional
    poe:
      role: powered
      standard: 802.3at
      class: 4
      watts: 30
    face: rear
    notes: Ethernet port; can receive PoE (802.3af, Class 3, 15.4W per HP spec page).
  - id: power-in
    label: Power adapter port
    connector: dc-barrel
    signals:
      - power
    direction: in
    face: rear
    notes: 4.5mm barrel power input for the external 12VDC/5A power adapter.

gaps:
  - No power draw in watts, only the adapter rating.
  - The left-right order of the rear ports is not shown.

notes:
  - The user guide requires 30 W PoE+ class 4 when powered from a network port. HP's spec page says 802.3af
    class 3 (15.4 W), and the datasheet text says "802.3af, Class 4", which is not a valid pairing.
