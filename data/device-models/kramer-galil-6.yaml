# Device model: Kramer Galil 6-C
# Facts from the vendor's public documentation (two independent readings, reconciled).
# Anything the sources don't state is left out and listed under gaps.

manufacturer: Kramer

model: Galil 6-C

part_numbers:
  - number: Galil 6-C
    notes: Closed-back variant; manual title 'Galil 6-C (SPK-C612)'. Sold as a pair. Manual P/N 2900-300368
      Rev 2.
  - number: SPK-C612
    notes: Earlier/alternate model name for Galil 6-C, per manual title.
  - number: Galil 6-CO (SPK-C613)
    notes: Open-back sibling, NOT the variant recorded here;

class: loudspeaker

summary: A 6.5-inch two-way closed-back ceiling loudspeaker with a multi-tap 70V/100V transformer or 8
  ohm direct mode, sold in pairs with a ceiling mounting kit.

dimensions_mm:
  width: 251
  height: 196
  depth: 251
  notes: 'Round speaker: width and depth are the external (bezel) diameter 25.1cm; height is the stated
    mounting depth 19.6cm (installation clearance above the ceiling, not a measured body height). Cutout
    diameter 22.4cm.'

weight_kg: 2.85

mounting:
  - ceiling

sources:
  - source: kramer-galil-6-c-6-5-inch-2
    provides: Specifications
  - source: kramer-galil-6-c-spk-c612-user-manual
    provides: Port labels, faces and panel layout
  - source: kramer-galil-6-co-6-5-inch-2
    provides: Specifications
  - source: kramer-galil-6-co-spk-c613-user-manual
    provides: Port labels, faces and panel layout

ports:
  - id: speaker-in-1
    connector: terminal-block
    signals:
      - speaker-level
    direction: in
    face: rear
    order: 1
    notes: Removable 4-pin terminal block plugged into the terminal cup on the back can. Pins 1 and 2
      are internally joined (+), pins 3 and 4 (-), so a second pair can loop to the next speaker in parallel
      or daisy chain.

gaps:
  - No body height; the depth given is the mounting depth.

notes:
  - The house kit list says only "Galil 6". This is the closed-back Galil 6-C (sold in pairs); the open-back
    Galil 6-CO is 1.55 kg, 230 mm across, 75 mm deep.
  - 'Passive: driven by the amplifier, with 8 ohm and 70 V / 100 V taps and a loop-through terminal.'
