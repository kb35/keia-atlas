# Switch ports at the Dublin office: its VLANs and prefixes, the kit that acts as one, the addresses, and every
# switch interface with what it is connected to. Made up for the demo; written by tools/migrations/2026-09-30-switch-ports.mjs,
# in NetBox's names (docs/connectors/netbox-ports.md). In a live setup NetBox and the switch platform's connector (UniFi,
# Meraki or Netgear) fill it; here it is recorded. The record is the plan; `seen` is what the switch reports where it
# differs (a drift finding). Each cable trace is checked against the patch cords, the runs and the room wiring by
# tools/crossrefs-switchports.mjs.
site: dub
vlan_group: dub
read_at: "2026-09-30T06:00:00Z"
source: { system: keia, synced_at: "2026-09-30T06:00:00Z" }
# The VLAN group: every VLAN in the plan, its role, its prefix (IPAM), the gateway, and where addresses come from.
vlans:
  - { vid: 10, role: management, prefix: 10.20.10.0/24, gateway: 10.20.10.1, reserved: 10.20.10.20-10.20.10.219, pool: 10.20.10.220-10.20.10.254 }
  - { vid: 20, role: corporate, prefix: 10.20.20.0/22, gateway: 10.20.20.1, reserved: 10.20.20.20-10.20.20.219, pool: 10.20.21.1-10.20.23.254 }
  - { vid: 30, role: room-systems, prefix: 10.20.30.0/24, gateway: 10.20.30.1, reserved: 10.20.30.20-10.20.30.219, pool: 10.20.30.220-10.20.30.254 }
  - { vid: 31, role: displays-and-signage, prefix: 10.20.31.0/24, gateway: 10.20.31.1, reserved: 10.20.31.20-10.20.31.219, pool: 10.20.31.220-10.20.31.254 }
  - { vid: 40, role: av, prefix: 169.254.0.0/16, note: "Link-local in each room, on the in-room switch only; not routed" }
  - { vid: 50, role: building, prefix: 10.20.50.0/24, gateway: 10.20.50.1, reserved: 10.20.50.20-10.20.50.219, pool: 10.20.50.220-10.20.50.254 }
