  - { vid: 20, role: corporate, prefix: 10.80.20.0/22, gateway: 10.80.20.1, reserved: 10.80.20.20-10.80.20.219, pool: 10.80.21.1-10.80.23.254 }
  - { vid: 30, role: room-systems, prefix: 10.80.30.0/24, gateway: 10.80.30.1, reserved: 10.80.30.20-10.80.30.219, pool: 10.80.30.220-10.80.30.254 }
  - { vid: 31, role: displays-and-signage, prefix: 10.80.31.0/24, gateway: 10.80.31.1, reserved: 10.80.31.20-10.80.31.219, pool: 10.80.31.220-10.80.31.254 }
  - { vid: 40, role: av, prefix: 169.254.0.0/16, note: "Link-local in each room, on the in-room switch only; not routed" }
  - { vid: 50, role: building, prefix: 10.80.50.0/24, gateway: 10.80.50.1, reserved: 10.80.50.20-10.80.50.219, pool: 10.80.50.220-10.80.50.254 }
