# Kit that acts as one (NetBox: virtual chassis; an HA pair and a cluster are the same idea). A change to one member is a change to the group.
groups:
  - { id: tyo-1519-core, kind: virtual-chassis, name: "Core switches, one virtual chassis (StackWise Virtual)", members: [tyo-1519-cs01, tyo-1519-cs02] }
  - { id: tyo-1519-fw, kind: ha-pair, name: "Firewalls A and B, an active and passive pair", members: [AG-001603, AG-001604] }
