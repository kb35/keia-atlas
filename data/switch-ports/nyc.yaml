# Switch ports at the New York office: its VLANs and prefixes, the kit that acts as one, the addresses, and every
# switch interface with what it is connected to. Made up for the demo; written by tools/migrations/2026-09-30-switch-ports.mjs,
# in NetBox's names (docs/connectors/netbox-ports.md). In a live setup NetBox and the switch platform's connector (UniFi,
# Meraki or Netgear) fill it; here it is recorded. The record is the plan; `seen` is what the switch reports where it
# differs (a drift finding). Each cable trace is checked against the patch cords, the runs and the room wiring by
# tools/crossrefs-switchports.mjs.
site: nyc
vlan_group: nyc
read_at: "2026-09-30T06:00:00Z"
source: { system: keia, synced_at: "2026-09-30T06:00:00Z" }
# The VLAN group: every VLAN in the plan, its role, its prefix (IPAM), the gateway, and where addresses come from.
vlans:
  - { vid: 10, role: management, prefix: 10.10.10.0/24, gateway: 10.10.10.1, reserved: 10.10.10.20-10.10.10.219, pool: 10.10.10.220-10.10.10.254 }
  - { vid: 20, role: corporate, prefix: 10.10.20.0/22, gateway: 10.10.20.1, reserved: 10.10.20.20-10.10.20.219, pool: 10.10.21.1-10.10.23.254 }
  - { vid: 30, role: room-systems, prefix: 10.10.30.0/24, gateway: 10.10.30.1, reserved: 10.10.30.20-10.10.30.219, pool: 10.10.30.220-10.10.30.254 }
  - { vid: 31, role: displays-and-signage, prefix: 10.10.31.0/24, gateway: 10.10.31.1, reserved: 10.10.31.20-10.10.31.219, pool: 10.10.31.220-10.10.31.254 }
  - { vid: 40, role: av, prefix: 169.254.0.0/16, note: "Link-local in each room, on the in-room switch only; not routed" }
  - { vid: 50, role: building, prefix: 10.10.50.0/24, gateway: 10.10.50.1, reserved: 10.10.50.20-10.10.50.219, pool: 10.10.50.220-10.10.50.254 }
  - { vid: 60, role: security, prefix: 10.10.60.0/24, gateway: 10.10.60.1, reserved: 10.10.60.20-10.10.60.219, pool: 10.10.60.220-10.10.60.254 }
  - { vid: 70, role: printers, prefix: 10.10.70.0/24, gateway: 10.10.70.1, reserved: 10.10.70.20-10.10.70.219, pool: 10.10.70.220-10.10.70.254 }
  - { vid: 90, role: guest, prefix: 10.10.90.0/23, gateway: 10.10.90.1, pool: 10.10.90.20-10.10.91.254 }
# Kit that acts as one (NetBox: virtual chassis; an HA pair and a cluster are the same idea). A change to one member is a change to the group.
