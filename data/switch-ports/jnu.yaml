  - { vid: 20, role: corporate, prefix: 10.100.20.0/22, gateway: 10.100.20.1, reserved: 10.100.20.20-10.100.20.219, pool: 10.100.21.1-10.100.23.254 }
  - { vid: 30, role: room-systems, prefix: 10.100.30.0/24, gateway: 10.100.30.1, reserved: 10.100.30.20-10.100.30.219, pool: 10.100.30.220-10.100.30.254 }
