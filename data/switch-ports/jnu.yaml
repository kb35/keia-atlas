  - { vid: 40, role: av, prefix: 169.254.0.0/16, note: "Link-local in each room, on the in-room switch only; not routed" }
  - { vid: 50, role: building, prefix: 10.100.50.0/24, gateway: 10.100.50.1, reserved: 10.100.50.20-10.100.50.219, pool: 10.100.50.220-10.100.50.254 }
