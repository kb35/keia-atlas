# Kit that acts as one (NetBox: virtual chassis; an HA pair and a cluster are the same idea). A change to one member is a change to the group.
groups:
  - { id: jnu-208-core, kind: virtual-chassis, name: "Core switches, one virtual chassis (StackWise Virtual)", members: [jnu-208-cs01, jnu-208-cs02] }
  - { id: jnu-208-fw, kind: ha-pair, name: "Firewalls A and B, an active and passive pair", members: [AG-001209, AG-001210] }
