# Northlight AV's standard terms: the words a quote and a statement of work take unless the opportunity changes them.
# Made up for the demo.
kind: terms
provider: northlight
demo: true
validity_days: 30
lead_time_days: 20
payment:
  - { when: On acceptance, pct: 40 }
  - { when: When the kit is on site, pct: 50 }
  - { when: When the client accepts the handover, pct: 10 }
warranty: Workmanship for 12 months from handover; equipment under each manufacturer's own warranty, handled by Northlight.
tax: Prices are in US dollars and exclude sales tax.
assumptions:
  - Work happens in normal hours, Monday to Friday, 08:00 to 17:00, with access to each room for a full day.
  - Walls and ceilings take the mounts named in the design without extra fixings or making good.
  - Existing cable containment can be reused; new containment is quoted separately.
exclusions:
  - Building works, electrical works and new cable containment.
  - Network changes beyond reserving addresses and patching the ports the design names.
  - Meeting platform licences, which the client buys and assigns.
  - Removing and disposing of the old kit, unless an option says so.
client_responsibilities:
  - Reserve an address and a switch port for every networked unit before the install day; the client's floor plans, addresses and switch ports never leave its Keia, so its team fills them in on the job.
  - Buy and assign a meeting platform licence for each room system.
  - Give access to every room on the booked days, and a named person to accept each room.
change_control:
  - Any change to the scope is a new version of the quote, with the difference from the last one shown line by line.
  - Once accepted, a change reaches the client's Keia as a reviewed change to the project, never as an edit.
