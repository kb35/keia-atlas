# Northlight AV's labour: roles with their rates, and how long each task type takes. The task types are the ones
# Keia Atlas's projects use (install, configure, commission; data/refresh-policy), plus project management. Configure
# time is worked out from each model's setup guide in data/configurations/: a base time, plus a time for each setting
# the guide sets or checks. Made up for the demo: every rate is fictional, in US dollars an hour.
kind: labour
provider: northlight
currency: USD
demo: true
roles:
  - { id: installer, name: Installer, cost: 52, sell: 95 }
  - { id: engineer, name: AV engineer, cost: 68, sell: 135 }
  - { id: commissioning, name: Commissioning engineer, cost: 64, sell: 125 }
  - { id: pm, name: Project manager, cost: 70, sell: 130 }
tasks:
  install:
    role: installer
    default_minutes: 40
    minutes_by_class:
      display: 120
      monitor: 30
      video-bar: 90
      codec: 60
      touch-controller: 30
      scheduler-panel: 60
      camera: 60
      microphone: 30
      av-extender: 45
      adapter: 20
      signage-player: 40
  configure:
    role: engineer
    base_minutes: 15
    per_setting_minutes: 2
  commission:
    role: commissioning
    base_minutes: 60
    per_unit_minutes: 10
  manage:
    role: pm
    share_pct: 12
crew:
  installers: 2
  hours_per_day: 7.5
