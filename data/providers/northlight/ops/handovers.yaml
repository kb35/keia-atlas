# Handover packs for finished jobs. Most of a pack is not written here: Keia assembles the as-built (units, serials,
# ports and VLANs), the room test results, and the setup guides and manufacturer documents from the record
# (src/lib/provider-ops.mjs, handoverPack). What only Northlight knows is kept here: the warranty terms it bought the
# kit under, the training it gave, and when the pack went over the engagement and who accepted it on the client's
# side. Warranty terms are Northlight's own records, made up for the demo.

area: ops
provider: northlight
kind: handovers
demo: true
warranty:
  - { manufacturer: Poly, months: 36, from: handover }
  - { manufacturer: Kramer, months: 84, from: handover }
  - { manufacturer: Dell, months: 36, from: handover }
  - { manufacturer: Logitech, months: 24, from: handover }
  - { manufacturer: Samsung, months: 36, from: handover }
  - { manufacturer: LG, months: 36, from: handover }
packs:
  - id: HO-NL-2240
    job: NL-2240
    handed_over: "2026-09-11"
    sent: "2026-09-11T15:20"
    accepted: { by: marcus, at: "2026-09-12T10:05" }
    training:
      - on: "2026-09-11"
        for: "The Juneau office's hosts, and Nathan Cho, who covers Juneau"
        what: "Joining a call from the touch controller, sharing a laptop at the table, and what to do when a room will not join"
      - on: "2026-09-11"
        for: "Aigna's service desk, by call"
        what: "Where the room guides live, and which faults go to Northlight under the snag period"
    notes:
      - "The display in Heron has no model in Aigna's record yet; Northlight's delivery note lists it."
