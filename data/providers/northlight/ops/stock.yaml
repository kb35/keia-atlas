provider: northlight
kind: stock
demo: true
counted: "2026-09-25"
locations:
  - { id: warehouse, name: Chicago warehouse, kind: warehouse }
  - { id: van-1, name: Van 1, kind: van, crew: East crew, based: Boston }
  - { id: van-2, name: Van 2, kind: van, crew: West crew, based: Seattle }
