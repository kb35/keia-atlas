# Northlight AV's stock: its warehouse and two vans (docs/service-providers.md: a provider's own records, never shared).
# Kit is listed by model from the shared device library (data/device-models/); parts the library does not hold (cable,
# mounts, a 43 in display) are listed by a part id. Serialised kit carries one line per serial number, with where it is
# and the job it is reserved for; counted parts carry how many are at each place and the reservations by job.
# Reorder points and distributors are Northlight's own. Serials and figures are made up for the demo.

