# Northlight AV's jobs: its own work orders, each tied to the client's record through the engagement (the client's job
# or project in `ref`). A job's bill of materials is either listed here, or read from the client's record: `from:
# build-sheet` takes every position the project has not finished in the job's spaces, with its model from the build
# sheet (Aigna's installs and space types). Where the record leaves a model open, `picks` says what Northlight fits.
# Once the sales side's accepted quote exists, its bill of materials feeds these reservations instead (docs/rules/gaps.md).
# Tasks the bill of materials cannot show (a survey, a camera reframed) are listed in `tasks`. Made up for the demo.

area: ops
provider: northlight
kind: jobs
demo: true
jobs:
  - id: NL-2280
    title: Site survey before the 12.09 refit
    client: aigna
    engagement: aigna-northlight
    ref: SURV-0412
    site: chi
    spaces: [chi-12-09]
    days: ["2026-09-29"]
    tasks: [survey]
  - id: NL-2301
    title: Swap the lecture theatre microphones
    client: fenwater
    engagement: fenwater-northlight
    ref: FW-INC-2201
    site: fw-cam
    where: Lecture theatre
    days: ["2026-09-30"]
    tasks: [ceiling-mics, cabling]
    bom:
