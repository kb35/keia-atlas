# based, and the days on site that are not a booked visit (a resident team, a project's crew). Crews and rotas are the
# provider's own and never flow to a client (src/lib/engagements.mjs RECORD_KINDS). Sam Okafor is also in the demo's
# View as (src/lib/demo.mjs); the others live only in Northlight's own Keia. Everyone here is made up.
#
# Certification kinds (src/lib/provider-ops.mjs CERTS): cts, cts-d, cts-i (AVIXA), dante-2, dante-3 (Audinate),
# wah (working at height training), ipaf (mobile elevating work platforms), site-card (a construction site safety card:
# CSCS in the UK, OSHA 30 in the US), first-aid.

