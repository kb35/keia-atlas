    expected: "2026-08-12"
    deliver_to: warehouse
    status: received
    received: "2026-08-12"
    lines:
      - { model: dell-u2724de, qty: 6, serials: [DEMO-NL-10601, DEMO-NL-10602, DEMO-NL-10603, DEMO-NL-10604, DEMO-NL-10605, DEMO-NL-10606] }
    notes: "Stock for the Juneau flex desks (change request CR-1); Cascade shipped six of the eight, so two are still to find."
