# Northlight AV's distributors and purchase orders. The distributors are made up; lead times are working days from
# the day an order is sent. An open order names the job it is for, so when it arrives its serials go to stock and are
# reserved for that job at once. Draft orders are not kept here: Keia works them out from next week's shortfalls
# (src/lib/provider-ops.mjs, draftOrders) and a person sends them. Accounting and the distributors' own portals
# connect; this is the record of what was ordered, for which job, and what came in.

area: ops
provider: northlight
kind: orders
demo: true
distributors:
  - { id: harbor, name: Harbor AV Supply, lead_days: 3, carries: "Poly, Logitech and Kramer" }
  - { id: cascade, name: Cascade Pro Distribution, lead_days: 2, carries: "Displays and monitors" }
  - { id: meridian, name: Meridian Cable and Mount, lead_days: 1, carries: "Cable, mounts and parts" }
orders:
  - id: PO-2026-0417
    distributor: harbor
    job: NL-2301
    raised: "2026-09-22"
    by: sam
    expected: "2026-09-29"
    deliver_to: van-1
    status: sent
    lines:
      - { model: poly-ip-ceiling-microphone, qty: 2, serials: [DEMO-NL-20881, DEMO-NL-20882] }
    notes: "Serials from Harbor's advance shipping notice."
  - id: PO-2026-0409
    distributor: meridian
    job: NL-2305
    raised: "2026-09-15"
    by: sam
    expected: "2026-09-16"
    deliver_to: warehouse
    status: received
    received: "2026-09-16"
    lines:
      - { part: hdmi-2m, qty: 12 }
