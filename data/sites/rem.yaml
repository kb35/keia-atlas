# Site: Remote EMEA
# The home offices of people who work from home in Europe, the Middle East and Africa, near the
# Dublin, London and Copenhagen offices (decision 0025). Made-up company; the towns are real places,
# named only to give each home office its country, plugs and time zone.

company: Aigna
code: REM
name: Remote EMEA
meaning: Until September 2026 the remote site was one group called Willow, after the tree that bends without breaking. It is now three remote sites, one per region, with a room for each home office.
kind: remote
role: remote
region: emea
sources:
  - source: keia-atlas-house-standard
    provides: The remote and home space type and its kits
notes:
  - Each home office uses its country's plug. Spare kits ship from the Dublin IT store.
  - Home offices near Dublin, London and Copenhagen, including across the bridge in Sweden.
