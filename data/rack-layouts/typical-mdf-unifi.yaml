# Typical rack for the UniFi build of the main comms room (MDF), the house standard from 29 Sept 2026 (decision 0028).
# No MDF is built to it yet, so this is the layout the room profile shows: the Dublin office's MDF rack (dub-3-21) with
# its network kit swapped for the UniFi standard in the same units. The equipment is real; the placement is the demo's.
# The patch panels, fibre, UPS, power strips and out-of-band kit stay as they are: UniFi has no fit for them here.
