# Space type: Welcome lounge
# Keia Atlas house standard, not from a published guideline (see docs/decisions/0009-house-standard.md). No public
# guidance covers an executive briefing centre's rooms, so every size, count and choice here is a house choice.
# Keia part (profile to verification_model): which classes of device belong here.
# Keia Atlas part: build options, the models each option names, and the outlets.

schema: composite-profile

profile:
  name: Welcome lounge
  space_type: welcome-lounge
  version: "1.0"
  last_updated: "2026-09-30"
  owner: Keia Atlas maintainers
  capacity: "10-24 people"
  purpose: >-
    Where visitors to an executive briefing centre arrive: lounge seating and coffee, a welcome
    screen with the day's guests and agenda, a second screen for a host's laptop, and the
    day's briefings on a panel at the door.

sources:
  - file: docs/decisions/0009-house-standard.md
    provides: 'Keia Atlas house standard: why this space type and its kit'
  - file: data/device-classes/display.yaml
    provides: Healthy state for the display class
  - file: data/device-classes/signage-player.yaml
    provides: Healthy state for the signage player class
  - file: data/device-classes/av-extender.yaml
    provides: Healthy state for the AV extender class
  - file: data/device-classes/scheduler-panel.yaml
    provides: Healthy state for the scheduler panel class

equipment_categories:
  - category: display
    description: A welcome screen and a lounge screen
    object_profile: data/device-classes/display.yaml
    quantity: "2"
  - category: digital_signage
    description: Signage player for the welcome screen
    object_profile: data/device-classes/signage-player.yaml
    quantity: "1"
  - category: signal_extension
    description: A laptop wall plate and its receiver at the lounge screen
    object_profile: data/device-classes/av-extender.yaml
    quantity: "2"
  - category: scheduling_panel
    description: Panel at the door showing the day's briefings
    object_profile: data/device-classes/scheduler-panel.yaml
    quantity: "1"

verification_model:
  platforms_to_check:
    - platform: keia_atlas
      check: every required device in the chosen option is recorded in the space and wired
        as the option says
    - platform: inventory
      check: every device has an active record in this space
    - platform: dhcp_dns
      check: every networked device has an address reservation and DNS records
    - platform: device_management
      check: the signage player shows its schedule and the displays are on standard firmware

keia_atlas:
  standard: house
  category: welcome
  bookable: false
  capacity:
    min: 10
    max: 24
  area:
    sq_ft:
      min: 646
      max: 969
    m2:
      min: 60
      max: 90
  geometry:
    # The room shell for a floor-level 3D model; basis says where each value comes from.
    width_m: 6.4
    depth_m: 12
    ceiling_m: 2.6
    display_wall: back
    door: { wall: left, from_m: 4.2, to_m: 6 }
    data_entry: { via: ceiling, wall: left, at: above the door }
    containment: [display-track, wall-riser, ceiling-basket, skirting]
    basis:
      size: chosen
      ceiling: house-default
      door: house-default
      data_entry: house-default
      containment: house-default
    notes:
      - 6.4 × 12 m (76.8 m²), the depth of a facade row, with a wide door opposite the lifts (house choice).
  options:
    - id: signage
      name: Welcome screen and lounge screen
      standard: house
      since: "2026-06-15"
      summary: "An 85 in welcome screen on a BrightSign player, a 65 in lounge screen with a laptop wall plate over HDBaseT, and a panel at the door with the day's briefings. Lighting scenes come from the building's lighting control; nothing here records."
      equipment:
        - key: display
          class: display
          model: samsung-qm85c
          role: Welcome screen
          quantity: 1
          requirement: required
          location: display-wall
          sizes_in: [85]
        - key: lounge-display
          class: display
          model: samsung-qm65c
          role: Lounge screen for a host's laptop
          quantity: 1
          requirement: required
          location: display-wall
          sizes_in: [65]
        - key: signage-player
          class: signage-player
          model: brightsign-xt1145
          quantity: 1
          requirement: required
          location: behind-display
          notes: PoE powered; shows the day's guests and agenda
        - key: wall-plate
          class: av-extender
          model: kramer-wp-20ct
          role: Wall plate where a host plugs in a laptop (HDMI or USB-C); sends to the lounge screen over HDBaseT
          quantity: 1
          requirement: required
          location: tbd
          notes: Needs its own power supply to run and to charge laptops
        - key: wall-plate-rx
          class: av-extender
          model: kramer-tp-580rxr
          role: HDBaseT receiver at the lounge screen
          quantity: 1
          requirement: required
          location: behind-display
        - key: scheduler-panel
          class: scheduler-panel
          model: logitech-tap-scheduler
          role: The day's briefings, at the door
          quantity: 1
          requirement: required
          location: room-entrance
      infrastructure:
        - service: power
          provided_by: it
          quantity: 6
          location: behind-display
          serves: [welcome screen, spare, spare, lounge screen, HDBaseT receiver, spare]
        - service: data
          provided_by: it
          quantity: 6
          location: behind-display
          serves: [welcome screen, signage player, spare, lounge screen, spare, spare]
        - service: power
          provided_by: it
          quantity: 1
          location: tbd
          serves: [wall plate]
        - service: power
          provided_by: facilities
          quantity: 4
          location: wall
          notes: For visitors' devices at the lounge seating. A house recommendation; facilities decide.
        - service: data
          provided_by: it
          quantity: 1
          location: room-entrance
          serves: [scheduler panel]
      wiring:
        - from: signage-player.hdmi-out-1
          to: display.hdmi-in-1
          cable: hdmi
        - from: wall-plate.hdbaset-1
          to: wall-plate-rx.hdbaset-1
          cable: cat6a
        - from: wall-plate-rx.hdmi-out-1
          to: lounge-display.hdmi-in-1
          cable: hdmi
        - from: wall-plate.usb-c-1
          to: laptop
          cable: usb-c
        - from: display.lan-1
          to: outlet:data/behind-display#1
          cable: cat6
        - from: signage-player.lan-1
          to: outlet:data/behind-display#2
          cable: cat6
          notes: PoE+ powers the player
        - from: lounge-display.lan-1
          to: outlet:data/behind-display#4
          cable: cat6
        - from: display.power-in
          to: outlet:power/behind-display#1
          cable: power
        - from: lounge-display.power-in
          to: outlet:power/behind-display#4
          cable: power
        - from: wall-plate-rx.power-in
          to: outlet:power/behind-display#5
          cable: power
        - from: wall-plate.power-in
          to: outlet:power/tbd#1
          cable: power
        - from: scheduler-panel.lan-1
          to: outlet:data/room-entrance#1
          cable: cat6
  notes:
    - 'Keia Atlas house standard: no public guidance covers an executive briefing centre, so the size and kit are house choices.'
    - 'Nothing here senses people: no camera, microphone or video device, so no privacy record is needed.'
    - 'Lighting control: a welcome scene comes from the building''s lighting control. No device class covers lighting control, so it is not listed as kit (a gap to fill).'
    - 'Recording and streaming: none; the lounge only shows content.'
