  notes:
    - In the enhanced builds the amplifier sits in the data closet and the integrator sets
      speaker, microphone and camera counts.
    - The enhanced builds leave out the whiteboard camera kit.
    - Two 98 in displays fill the 4.6 m display wall; a wider pair, or an LED wall, needs a design review first.
    - 'Size and capacity: Microsoft''s large room, 15 x 32 ft for 12 to 16 people.'
    - 'Display size: AVIXA DISCAS basic decision making, text at 3 percent of the image height
      (house assumption), so the image is at least a sixth of the distance to the farthest seat.
      That seat is about 7.2 m from the display here, so the display is at least 97 in. So every
      build uses 98 in displays, or an LED wall in the enhanced single build.'
    - 'Kit class: the Poly Studio X72, which Poly makes for large rooms with pickup to 25 ft (7.6
      m), plus an expansion microphone; the enhanced builds split the microphones and speakers out,
      as Microsoft advises for larger rooms.'
