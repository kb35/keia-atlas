# Demo playbook. Aigna's own way of working; not taken from any real company.
id: decommission
name: Move out and decommission
kind: decommission
version: "1.0"
intensity: medium
weeks: { min: 6, max: 16 }
summary: "Close a room, a floor or a whole site: decide what happens to every device, take them out cleanly, and leave the records and monitoring telling the truth."
when: "Use when a site is given up, a floor is handed back or rooms are stripped for a rebuild. For one failed unit, use the RMA playbook."
changes:
  - { date: "2026-09-29", change: "First version." }
phases:
  - phase: plan
    weeks: "1 to 2"
    steps:
      - { title: "Confirm the move-out date and what is being closed", role: pm, output: Scope and date }
      - { title: "List every device, circuit and contract in the rooms", role: delivery, output: Device list }
      - { title: "Check for leased units, and for anything under vendor support", role: pm }
      - { title: "Give notice to the landlord, the circuit provider and the vendors", role: pm, long_lead: true }
    gate: { by: [programme], checks: [Date and scope agreed, Notices given] }
  - phase: design
    weeks: "1 to 2"
    steps:
      - { title: "Decide for each device: redeploy, keep as a spare, return or dispose of", role: sm-av, output: Disposition list }
      - { title: "Plan the order of removal, so calls and the network last as long as they are needed", role: delivery, output: Removal plan }
      - { title: "Plan the network shutdown and the removal of the comms room", role: network }
      - { title: "Book the couriers and the disposal company", role: pm }
    gate: { by: [sm-av, sm-infra], checks: [Every device has a decision, Removal plan approved] }
  - phase: integrate
    weeks: "2 to 6"
    steps:
      - { title: "Retire each unit in the asset register with the date and the reason", role: delivery, step: provision }
      - { title: "Take the rooms out of booking, device management and monitoring", role: delivery, step: provision }
      - { title: "Release the addresses and switch ports the rooms held", role: network, step: provision }
      - { title: "Remove the devices and cabling, and label each unit as redeploy, return or dispose", role: tech, step: install }
      - { title: "Send redeployed units to the store or their new site, and returns to their owners", role: tech, step: install }
      - { title: "Take down the comms room last", role: network, step: install }
      - { title: "Reset every unit that leaves to its factory settings", role: tech, step: configure }
      - { title: "Check no device still reports in monitoring or device management", role: network, step: commission }
      - { title: "Walk each room and check it is empty and clean", role: tech, step: commission }
    gate: { by: [delivery], checks: [Every unit removed and reset, Nothing still reporting, Rooms empty] }
  - phase: handover
    weeks: "1 to 2"
    steps:
      - { title: "Collect the disposal certificates and the returns receipts", role: pm, output: Disposal records }
      - { title: "Update the spares count and the refresh plan for the units that move", role: pm }
      - { title: "Cancel the circuit, the licences and the support contracts", role: pm }
      - { title: "Hand the keys and the rooms back", role: pm }
    gate: { by: [head], checks: [Records match what is left, Contracts cancelled] }
  - phase: closed
    weeks: "-"
    steps:
      - { title: "Feed what was learned back into this playbook", role: pm }
    gate: { by: [programme], checks: [Lessons captured] }
