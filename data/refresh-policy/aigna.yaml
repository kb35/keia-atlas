# Refresh policy for Aigna (a made-up company).
# Years in service are Keia Atlas's house policy, chosen for this example, not vendor figures.
# Task hours are the example estimates from Keia's Operations Framework, capacity planning section.

name: Aigna refresh policy
standard: house
horizon:
  history_from: 2000
  from: 2026
  to: 2031

tasks:
  - task: provision
    stage: deploy
    low: 0.5
    high: 0.5
    networked_only: true
    notes: Create the device's records in the systems that track it.
  - task: configure
    stage: deploy
    low: 1
    high: 3
    networked_only: true
    notes: Set it up to the configuration profile for the model.
  - task: install
    stage: deploy
    low: 1
    high: 2
    notes: Mount, cable and power it.
  - task: commission
    stage: deploy
    low: 0.5
    high: 1
    notes: Check it against the space type before handing the space back.
  - task: decommission
    stage: retire
    low: 0.5
    high: 0.5
    notes: Remove the old unit and clean up its records.

classes:
  - { class: display, years: 7 }
  - { class: monitor, years: 6 }
  - { class: video-bar, years: 5 }
  - { class: codec, years: 5 }
  - { class: touch-controller, years: 5 }
  - { class: camera, years: 5 }
  - { class: microphone, years: 7 }
  - { class: amplifier, years: 8 }
  - { class: loudspeaker, years: 10 }
  - { class: av-extender, years: 7 }
  - { class: av-switcher, years: 7 }
  - { class: adapter, years: 5 }
  - { class: network-switch, years: 7 }
  - { class: network-gateway, years: 5 }
  - { class: wireless-access-point, years: 5 }
  - { class: scheduler-panel, years: 5 }
  - { class: desk-video-device, years: 5 }
  - { class: dock, years: 4 }
  - { class: signage-player, years: 5 }
  - { class: printer, years: 6 }
  - { class: security-device, years: 7 }

sources:
  - source: keia-operations-framework
    provides: Lifecycle stages, tasks and the example hours per device
  - source: keia-atlas-house-standard
    provides: Years in service for each device class

notes:
  - Years count from the install date. Devices still being installed count from the year they go in.
  - Meeting devices run software that stops getting updates, so they are replaced sooner than screens and speakers.
