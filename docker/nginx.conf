# nginx config for Keia Atlas. Replaces the image's default server block.
#
# The site is built with base "/keia-atlas" and trailingSlash "always", and the
# Dockerfile places dist/ at /usr/share/nginx/html/keia-atlas/. So:
#   /                      -> redirects to /keia-atlas/
#   /keia-atlas/           -> dist/index.html
#   /keia-atlas/rooms/x/   -> dist/rooms/x/index.html
#   /keia-atlas/rooms/x    -> redirects to /keia-atlas/rooms/x/ (nginx does this for folders)
#   anything else          -> 404 page

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they work behind any host name or port mapping.
    absolute_redirect off;
    server_tokens off;

    # Compress text formats (text/html is always compressed once gzip is on).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        text/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf;

    # Basic hardening headers. Repeated in each location below because nginx
    # drops server-level add_header lines wherever a location sets its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /keia-atlas/404.html;

    # Bare address goes to the site.
    location = / {
        return 302 /keia-atlas/;
    }

    # Hashed build files (names change whenever the content does): cache for a year.
    location /keia-atlas/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The 404 page itself: served for missing URLs, never directly.
    location = /keia-atlas/404.html {
        internal;
    }

    # Everything else under the base path: pages, data files, favicon. Not hashed,
    # so the browser must re-check each time (cheap, thanks to ETag/Last-Modified).
    location /keia-atlas/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
