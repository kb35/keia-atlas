# gitleaks settings. Start from the built-in rules and add only what is needed.
title = "Keia Atlas gitleaks config"

[extend]
useDefault = true

# The validator's own tests contain deliberately fake "secret" fields to prove the
# validator rejects them. They are made up, so gitleaks may skip that folder.
[allowlist]
description = "Fake secrets used by the validator's tests"
paths = ['''tests/fixtures/secrets/''']
