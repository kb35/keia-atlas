name: Bug
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. **A security problem? Do not open an issue**: report it privately (see SECURITY.md).
        Please use made-up or demo data only. No real hostnames, serials, addresses, people or screenshots of real offices.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw. Paste any error message as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: The page address or data file, and the steps, so someone else can see it too.
      placeholder: |
        1. Open /rooms/dub-3-09/
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version in package.json, or the commit you are on (git rev-parse --short HEAD).
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you ran it
      description: The live demo, npm run dev, the container, or your own host; and the browser and system if it is a page problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: This report contains no secrets and no real data about people, offices or networks.
          required: true
