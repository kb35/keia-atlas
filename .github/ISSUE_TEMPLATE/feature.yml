name: Feature
description: Something Keia Atlas should do that it does not do yet.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        The roadmap is ordered by what real teams need, so the most useful thing you can say is the problem you have and how you work today.
        Check the [roadmap](https://github.com/kb35/keia-atlas/blob/main/ROADMAP.md) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in the way today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work today
      description: The tools, spreadsheets or steps you use now, described by what they do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea, if you have one. A sketch is welcome.
  - type: dropdown
    id: module
    attributes:
      label: Which part
      options:
        - Locations and spaces
        - Assets and devices
        - Services
        - Support
        - Projects
        - Vendors and partners
        - Knowledge
        - Connectors
        - Running it (install, hosting, security)
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: This request contains no secrets and no real data about people, offices or networks.
          required: true
