name: Connector request
description: Ask for Keia Atlas to read from a tool you already run.
labels: ["connector"]
body:
  - type: markdown
    attributes:
      value: |
        Connectors start read only: Atlas reads from the tool and never changes it. See [docs/connectors/](https://github.com/kb35/keia-atlas/blob/main/docs/connectors/README.md) for how they work.
        Never paste credentials, tokens, tenant names or real records here.
  - type: input
    id: tool
    attributes:
      label: The tool
      description: Its name, and what it does in one line.
      placeholder: "Example: a meeting-room fleet management platform"
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Which part of Atlas it feeds
      options:
        - Assets and devices (inventory, discovery)
        - Services (health, status)
        - Support (tickets, events)
        - Room booking
        - Projects
        - Knowledge
        - Identity (sign-in)
        - Something else
    validations:
      required: true
  - type: textarea
    id: flows
    attributes:
      label: What should flow into Atlas
      description: The records or readings you need, and how fresh they must be.
      placeholder: "Example: each room system's status and firmware version, every 15 minutes"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you get this today
      description: The console, export or report you use now.
  - type: input
    id: docs
    attributes:
      label: The tool's public API documentation
      description: A link to the manufacturer's public documents, if there is one.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I could test a connector against this tool with non-production data.
        - label: I could write the connector with the connector kit.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: This request contains no credentials, tenant names or real records.
          required: true
