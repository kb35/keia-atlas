# OpenSSF Scorecard: scores the repository's security practices and publishes the
# result (badge and public API). Findings also appear under Security > Code scanning.
# Publishing results only works on a public repository.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results (OIDC)
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the report for a few days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Show results in code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
