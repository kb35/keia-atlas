# Runs on every push and pull request: checks all data against its schemas, builds
# the site, then runs the tests. The build comes first so the tests that read the
# built pages (dist/) run too. A red X on GitHub means one of them failed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code, including the pinned Keia submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency versions
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build the site (fails if any page breaks)
        run: npm run build
        # Built as of the demo's anchor, so the tests that read the built pages see the dates they were written
        # for whatever day CI runs (the rolling demo clock, docs/rules/data.md F12). Pages builds on today's date.
        env:
          DEMO_BUILD_DATE: anchor

      - name: Run the tests, including those that read the built pages
        run: npm test
