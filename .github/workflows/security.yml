# Scans the full git history for committed secrets (passwords, tokens, keys).
# A red X means gitleaks found something that looks like a real secret.
# Personal GitHub accounts need no licence key; an organisation account needs a
# free GITLEAKS_LICENSE secret (see https://gitleaks.io).
name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # lets gitleaks comment on a pull request when it finds something
    steps:
      - name: Get the code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # only needed for organisation accounts
