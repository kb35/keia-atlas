# Makes a release when a version tag (for example v0.2.0) is pushed. Nothing else starts it.
#
#   1. check:     the tag matches package.json, then validate the data, build the site and run the tests.
#   2. container: build the image, push it to the GitHub Container Registry, write an SBOM (a software bill of
#                 materials: every package inside the image), and sign the image and the SBOM with Sigstore.
#                 Signing is "keyless": GitHub vouches for this workflow, so there is no signing key to keep.
#   3. release:   a GitHub release with the changelog section and the SBOM attached.
#
# How to make a release: CONTRIBUTING.md, "Releases".
# To check a signature: cosign verify ghcr.io/<owner>/<repo>:<version> \
#   --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Nothing by default; each job asks for only what it needs.
permissions: {}

# One release at a time, and never cancel one half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the code, including the pinned Keia submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Check the tag matches the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag $TAG, package.json $version"
          test "$TAG" = "v$version"

      - name: Check the changelog has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependency versions
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Build the site (fails if any page breaks)
        run: npm run build

      - name: Run the tests, including those that read the built pages
        run: npm test

  container:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to the GitHub Container Registry
      id-token: write # keyless signing: GitHub vouches for this workflow to Sigstore
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Get the code, including the pinned Keia submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Name the image (registry names must be lower case)
        id: name
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Work out the image tags from the version
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write the SBOM (CycloneDX) for the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Keep the SBOM for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image, and attach the SBOM as a signed attestation
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

  release:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Create the release with its changelog section and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Container image: \`$IMAGE:$version\` (\`$DIGEST\`), signed with Sigstore; the SBOM is attached."
          } >> notes.md
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" sbom.cdx.json --title "Keia Atlas $version" --notes-file notes.md --verify-tag $prerelease
